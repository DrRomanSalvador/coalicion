name: Complete historical backtest

on:
  push:
    branches: [main]
    paths:
      - "scripts/backtest_2023_baseline.py"
      - "scripts/run_complete_backtest.py"
      - "scripts/complete_historical_calibration.py"
      - "scripts/run_full_oos.py"
      - "src/electoral.py"
      - "src/coalition.py"
      - "data/resultados_oficiales_2004_2023.csv"
      - "artifacts/data/cis_historical_2004_2023.csv"
      - "data/2023_circunscripciones_oficiales.csv"
      - ".github/workflows/complete-backtest.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: complete-backtest-main
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --no-input "numpy>=2.0,<2.4" "pandas==2.3.3"
      - name: Execute independent MC-10000 gate
        run: |
          PYTHONPATH=. python scripts/run_mc_10000.py
          python - <<'PY'
          import json
          x=json.load(open("ci_evidence/mc_10000.json",encoding="utf-8"))
          assert x["status"]=="PASS" and x["iterations"]==10000
          assert x["constituencies"]==52 and x["seats"]==350
          assert x["invariants"]["every_draw_seat_sum_350"] is True
          assert x["invariants"]["all_allocations_status_OK"] is True
          PY
      - name: Execute complete backtest
        run: |
          set +e
          PYTHONPATH=. python scripts/run_complete_backtest.py             --input artifacts/data/cis_historical_2004_2023.csv             --output ci_evidence/backtest_complete_2004_2023.json
          rc=$?
          test -s ci_evidence/backtest_complete_2004_2023.json
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          python - <<'PY'
          import json, math
          x=json.load(open("ci_evidence/backtest_2023_baseline.json", encoding="utf-8"))
          m=x["metrics"]
          c=x["contracts"]
          coverage=float(m["coverage_actual_seats_in_calibrated_interval_winners"])
          assert math.isfinite(coverage) and coverage >= 0.85
          assert c["historical_conformal_calibration"] is True
          assert c["calibration_before_target_election"] is True
          assert c["target_election_excluded_from_calibration"] is True
          assert c["conformal_nominal_coverage_95"] is True
          assert c["calibrated_coverage_gate"] is True
          assert int(x["n_simulations"]) == 10000
          print("TERRITORIAL_SEAT_CALIBRATION_PASS", coverage)
          PY
      - name: Upload backtest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complete-backtest-2004-2023
          path: |
            ci_evidence/backtest_complete_2004_2023.json
            ci_evidence/backtest_2023_baseline.json
            ci_evidence/oos_full_backtest.json
            ci_evidence/oos_calibration.json

# Re-run after calibration envelope correction.
