name: Historical Spain data materialization

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 1 * *"
  push:
    branches: ["main"]
    paths:
      - "scripts/ingest_official_electoral_history.R"
      - "scripts/ingest_cis_historical_surveys.R"
      - "scripts/validate_historical_data.py"
      - "config/electoral_sources.json"
      - "tests/test_poll_monitor.py"
      - ".github/workflows/historical-data-materialization.yml"

permissions:
  contents: write

concurrency:
  group: historical-spain-data
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install R dependencies
        run: |
          Rscript -e 'install.packages(c("readxl","dplyr","readr","tibble","haven","purrr","opencis"), repos="https://cloud.r-project.org")'

      - name: Ingest official Interior
        run: Rscript scripts/ingest_official_electoral_history.R

      - name: Ingest official CIS microdata
        run: Rscript scripts/ingest_cis_historical_surveys.R

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install --upgrade pip pytest requests beautifulsoup4 lxml

      - name: Run regression tests
        run: python -m pytest tests/test_poll_monitor.py -q

      - name: Validate canonical historical datasets
        run: python scripts/validate_historical_data.py

      - name: Persist generated datasets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/resultados_oficiales_2004_2023.csv data/encuestas_historicas_2004_2023.csv data/manifests/HISTORICAL_DATA_MATERIALIZATION.json
          if git diff --cached --quiet; then
            echo "No material changes."
          else
            git commit -m "data: materialize official Spain historical electoral and CIS data"
            git push origin main
          fi
