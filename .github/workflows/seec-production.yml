name: SEEC production posterior
# Manual fallback only. The canonical push-triggered production sampler is
# seec-production-real.yml; full_reproducible_suite.yml also runs SEEC in CI.
on:
  workflow_dispatch:
permissions: {contents: write}
jobs:
  seec:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check --no-input "numpy>=2.0,<2.4" "pandas==2.3.3" "pymc==6.3.2" "pytensor>=3.2.2,<3.4" "arviz>=1.1.0,<2.0"
      - name: Resolve canonical seed
        run: echo "COALICION_SEED=$(python -c 'from src.reproducibility_contract import ExecutionContract; print(ExecutionContract.seed)')" >> "$GITHUB_ENV"
      - run: python scripts/run_seec_production.py --draws 2500 --tune 3000 --chains 4 --seed "$COALICION_SEED"
      - run: |
          python - <<'PY'
          import json, math
          x=json.load(open("ci_evidence/seec_production.json"))
          assert x["status"]=="PASS" and x["total_draws"]>=10000
          assert x["diagnostics"]["divergences"]==0
          assert math.isfinite(x["diagnostics"]["max_r_hat"]) and x["diagnostics"]["max_r_hat"]<=1.01
          PY
      - name: Persist genuine SEEC evidence with race recovery
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp ci_evidence/seec_production.json /tmp/seec_production.json
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p ci_evidence
            cp /tmp/seec_production.json ci_evidence/seec_production.json
            git add ci_evidence/seec_production.json
            if git diff --cached --quiet; then
              echo "Canonical SEEC evidence is already persisted."
              exit 0
            fi
            git commit -m "ci: materialize genuine SEEC posterior evidence"
            if git push origin HEAD:main; then
              echo "SEEC evidence persisted on attempt $attempt."
              exit 0
            fi
            echo "Concurrent main update; retrying evidence persistence ($attempt/5)."
            sleep 3
          done
          echo "Unable to persist SEEC evidence after 5 attempts."
          exit 1
