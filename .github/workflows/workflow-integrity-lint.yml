name: Workflow integrity lint

on:
  pull_request:
    paths:
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: Lint every GitHub Actions workflow
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned actionlint release
        shell: bash
        run: |
          set -euo pipefail
          version="1.7.12"
          archive="actionlint_${version}_linux_amd64.tar.gz"
          curl --fail --location --retry 3 --retry-all-errors \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}" \
            --output "/tmp/${archive}"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/${archive}" | sha256sum --check
          tar -xzf "/tmp/${archive}" -C /tmp actionlint
          /tmp/actionlint -version
      - name: Validate all workflow syntax and expressions
        run: /tmp/actionlint -color .github/workflows/*.yml
