name: Emergency historical runner release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/emergency-historical-release.yml"

permissions:
  actions: write
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Release stale historical run and dispatch final integration
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/$REPOSITORY/actions/runs/37669329362/force-cancel" >/dev/null || true
          sleep 3
          gh api --method POST "repos/$REPOSITORY/actions/workflows/377488491/dispatches" -f ref=main >/dev/null
          echo "Final historical integration dispatched from corrected system-R bootstrap."
