name: COLMENA — Queen Gate + Atomic Workers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/COLMENA_MISSION_CONTROL.json"
      - "scripts/colmena_queen.py"
      - "scripts/colmena_worker.py"
      - "scripts/colmena_closure.py"
      - ".github/workflows/colmena_execute.yml"

permissions:
  contents: read

concurrency:
  group: colmena-execution-main
  cancel-in-progress: false

jobs:
  queen:
    name: Queen Gate
    runs-on: ubuntu-latest
    outputs:
      batch_numbers: \${{ steps.plan.outputs.batch_numbers }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: plan
        shell: bash
        run: |
          set -euo pipefail
          python scripts/colmena_queen.py --ref "\${GITHUB_SHA}" --output queen_approval.json
          python - <<'PY' >> "\$GITHUB_OUTPUT"
          import json
          p=json.load(open("queen_approval.json",encoding="utf-8"))
          print("batch_numbers="+json.dumps([b["batch"] for b in p["batches"]],separators=(",",":")))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: colmena-queen-approval
          path: queen_approval.json

  workers:
    name: Worker batch \${{ matrix.number }}
    needs: queen
    if: needs.queen.result == 'success'
    strategy:
      fail-fast: false
      max-parallel: 32
      matrix:
        batch_number: \${{ fromJSON(needs.queen.outputs.batch_numbers) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: colmena-queen-approval
      - name: Execute logical atomic workers
        shell: bash
        env:
          BATCH_NUMBER: \${{ matrix.batch_number }}
        run: |
          set +e
          mkdir -p worker_evidence
          overall=0
          python - <<'PY'
          import json, os, subprocess, sys
          p=json.load(open("queen_approval.json",encoding="utf-8"))
          batch=int(os.environ["BATCH_NUMBER"])
          ids=next(b["mission_ids"] for b in p["batches"] if int(b["batch"])==batch)
          overall=0
          for mission_id in ids:
              rc=subprocess.run([
                  sys.executable,"scripts/colmena_worker.py",
                  "--mission-id",mission_id,"--approval","queen_approval.json",
                  "--ref",os.environ["GITHUB_SHA"],"--out",f"worker_evidence/{mission_id}.json"
              ]).returncode
              if rc: overall=1
          json.dump({"schema":"COLMENA_BATCH_CHECKPOINT_V1","batch":batch,"status":"COMPLETADA" if overall==0 else "BLOQUEADA","mission_ids":ids},open(f"worker_evidence/checkpoint_batch_{batch}.json","w",encoding="utf-8"),ensure_ascii=False,indent=2)
          raise SystemExit(overall)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worker-evidence-batch-\${{ matrix.number }}
          path: worker_evidence/*.json
          if-no-files-found: error

  closure:
    name: Queen Closure Gate
    needs: [queen, workers]
    if: always() && needs.queen.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: colmena-queen-approval
      - uses: actions/download-artifact@v4
        with:
          pattern: worker-evidence-batch-*
          path: worker_evidence
          merge-multiple: true
      - name: Validate complete closure
        run: |
          python scripts/colmena_closure.py \
            --approval queen_approval.json \
            --evidence-dir worker_evidence \
            --out colmena_closure.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: colmena-closure
          path: colmena_closure.json
# Invocation marker: Queen + full colmena requested on main.
