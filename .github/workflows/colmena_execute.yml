name: COLMENA — Queen Gate + Atomic Workers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/COLMENA_MISSION_CONTROL.json"
      - "scripts/colmena_queen.py"
      - "scripts/colmena_worker.py"
      - "scripts/colmena_closure.py"
      - ".github/workflows/colmena_execute.yml"
      - "src/colmena_resume.py"

permissions:
  contents: read

jobs:
  queen:
    name: Queen Gate
    runs-on: ubuntu-22.04
    outputs:
      batch_numbers: ${{ steps.plan.outputs.batch_numbers }}
      mission_ids: ${{ steps.plan.outputs.mission_ids }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: plan
        shell: bash
        run: |
          set -euo pipefail
          python scripts/colmena_queen.py --ref "${GITHUB_SHA}" --output queen_approval.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          p=json.load(open("queen_approval.json",encoding="utf-8"))
          print("batch_numbers="+json.dumps([b["batch"] for b in p["batches"]],separators=(",",":")))
          print("mission_ids="+json.dumps([m["id"] for m in p["missions"]],separators=(",",":")))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: colmena-queen-approval
          path: |
            queen_approval.json
            queen_state.json

  workers:
    name: Agent ${{ matrix.mission_id }}
    needs: queen
    if: needs.queen.result == 'success'
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        mission_id: ${{ fromJSON(needs.queen.outputs.mission_ids) }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: colmena-queen-approval
      - name: Execute independent AI agent worker
        shell: bash
        env:
          MISSION_ID: ${{ matrix.mission_id }}
          COLMENA_AGENT_PROVIDER: huggingface-inference-providers
          COLMENA_AI_AGENT_EXECUTION: "true"
          HF_TOKEN: ${{ secrets.Reina_token }}
          COLMENA_AGENT_MODEL: openai/gpt-oss-120b:fastest
          COLMENA_AGENT_EXECUTION_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.mission_id }}
        run: |
          set +e
          mkdir -p worker_evidence
          python scripts/colmena_worker.py --mission-id "$MISSION_ID" --approval queen_approval.json --ref "$GITHUB_SHA" --out "worker_evidence/$MISSION_ID.json"
          exit $?
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worker-evidence-${{ matrix.mission_id }}
          path: worker_evidence/*.json
          if-no-files-found: error

  closure:
    name: Queen Closure Gate
    needs: [queen, workers]
    if: always() && needs.queen.result == 'success'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: colmena-queen-approval
      - uses: actions/download-artifact@v4
        with:
          pattern: worker-evidence-*
          path: worker_evidence
          merge-multiple: true
      - name: Validate complete closure
        run: |
          python scripts/colmena_closure.py \
            --approval queen_approval.json \
            --evidence-dir worker_evidence \
            --out colmena_closure.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: colmena-closure
          path: colmena_closure.json

  persist:
    name: Persist Queen Checkpoint
    permissions:
      contents: write
    needs: [queen, workers, closure]
    if: always() && needs.queen.result == 'success'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: colmena-queen-approval
          path: persist/queen
      - uses: actions/download-artifact@v4
        with:
          pattern: worker-evidence-*
          path: persist/workers
          merge-multiple: true
      - uses: actions/download-artifact@v4
        if: always()
        with:
          name: colmena-closure
          path: persist/closure
      - name: Materialize durable checkpoint
        shell: bash
        env:
          RUN_STARTED_AT: ${{ github.run_started_at }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/colmena/latest
          rm -rf artifacts/colmena/latest/*
          cp persist/queen/queen_approval.json artifacts/colmena/latest/queen_approval.json
          cp persist/queen/queen_state.json artifacts/colmena/latest/queen_state.json
          cp -R persist/workers/. artifacts/colmena/latest/
          if [ -f persist/closure/colmena_closure.json ]; then
            cp persist/closure/colmena_closure.json artifacts/colmena/latest/colmena_closure.json
          else
            printf '%s\n' '{"status":"NO_CLOSURE_ARTIFACT"}' > artifacts/colmena/latest/colmena_closure.json
          fi
          python - <<'PY'
          import json, os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          root=Path("artifacts/colmena/latest")
          evidence=sorted(root.glob("M*.json"))
          closure=json.loads((root/"colmena_closure.json").read_text(encoding="utf-8"))
          tests=[
            {"name":"queen_gate","status":"PASS" if Path("persist/queen/queen_approval.json").exists() else "FAIL"},
            {"name":"worker_evidence_count","status":"PASS" if len(evidence)==179 else "FAIL","count":len(evidence)},
            {"name":"closure","status":closure.get("status","UNKNOWN")}
          ]
          operational={
            "schema":"COALICION_OPERATIONAL_STATE_V1",
            "commit":os.environ["GITHUB_SHA"],
            "mission_current":"P0_RUNTIME_179_AGENTS",
            "tasks_completed":["queen_gate"] if tests[0]["status"]=="PASS" else [],
            "tasks_blocked":[] if len(evidence)==179 else ["179 independent worker evidences not yet persisted"],
            "tests":tests,
            "workflow_run_id":int(os.environ["GITHUB_RUN_ID"]),
            "workflow_status":"completed_persist_step",
            "artifacts":[p.name for p in sorted(root.iterdir()) if p.is_file()],
            "timestamp_europe_madrid":datetime.now(ZoneInfo("Europe/Madrid")).isoformat()
          }
          Path("artifacts/operational_state.json").write_text(json.dumps(operational,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          summary={
            "schema":"COLMENA_PERSISTED_CHECKPOINT_V1",
            "run_id":int(os.environ["GITHUB_RUN_ID"]),
            "run_attempt":int(os.environ["GITHUB_RUN_ATTEMPT"]),
            "commit":os.environ["GITHUB_SHA"],
            "mission_evidence_files":len(evidence),
            "batch_checkpoints":len(sorted(root.glob("checkpoint_batch_*.json"))),
            "closure_status":closure.get("status"),
            "persisted_at":os.environ["RUN_STARTED_AT"]
          }
          (root/"checkpoint.json").write_text(json.dumps(summary,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
      - name: Commit durable checkpoint to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "coalicion-colmena[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/colmena/latest
          git diff --cached --quiet && exit 0
          git commit -m "chore(colmena): persist execution checkpoint"
          git push origin HEAD:main
# Invocation marker: Queen + full colmena requested on main.
