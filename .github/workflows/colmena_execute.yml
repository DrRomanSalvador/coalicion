name: COLMENA — Queen Gate + Atomic Workers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/COLMENA_MISSION_CONTROL.json"
      - "scripts/colmena_queen.py"
      - "scripts/colmena_worker.py"
      - "scripts/colmena_closure.py"
      - ".github/workflows/colmena_execute.yml"

permissions:
  contents: read

concurrency:
  group: colmena-execution-main
  cancel-in-progress: false

jobs:
  queen:
    name: Queen Gate
    runs-on: ubuntu-latest
    outputs:
      batches: \${{ steps.plan.outputs.batches }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: plan
        shell: bash
        run: |
          set -euo pipefail
          python scripts/colmena_queen.py --ref "\${GITHUB_SHA}" --output queen_approval.json
          python - <<'PY' >> "\$GITHUB_OUTPUT"
          import json
          p=json.load(open("queen_approval.json",encoding="utf-8"))
          print("batches="+json.dumps({"include":[{"number":b["batch"],"mission_ids":json.dumps(b["mission_ids"],ensure_ascii=False)} for b in p["batches"]]},separators=(",",":")))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: colmena-queen-approval
          path: queen_approval.json

  workers:
    name: Worker batch \${{ matrix.number }}
    needs: queen
    if: needs.queen.result == 'success'
    strategy:
      fail-fast: false
      max-parallel: 32
      matrix: \${{ fromJSON(needs.queen.outputs.batches) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: colmena-queen-approval
      - name: Execute logical atomic workers
        shell: bash
        env:
          MISSION_IDS: \${{ matrix.mission_ids }}
        run: |
          set +e
          mkdir -p worker_evidence
          overall=0
          while IFS= read -r id; do
            python scripts/colmena_worker.py \
              --mission-id "\$id" \
              --approval queen_approval.json \
              --ref "\${GITHUB_SHA}" \
              --out "worker_evidence/\${id}.json"
            rc=\$?
            if [ "\$rc" -ne 0 ]; then overall=1; fi
          done < <(python -c 'import json,os; print("\\n".join(json.loads(os.environ["MISSION_IDS"])))')
          exit "\$overall"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worker-evidence-batch-\${{ matrix.number }}
          path: worker_evidence/*.json
          if-no-files-found: error

  closure:
    name: Queen Closure Gate
    needs: [queen, workers]
    if: always() && needs.queen.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: colmena-queen-approval
      - uses: actions/download-artifact@v4
        with:
          pattern: worker-evidence-batch-*
          path: worker_evidence
          merge-multiple: true
      - name: Validate complete closure
        run: |
          python scripts/colmena_closure.py \
            --approval queen_approval.json \
            --evidence-dir worker_evidence \
            --out colmena_closure.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: colmena-closure
          path: colmena_closure.json
