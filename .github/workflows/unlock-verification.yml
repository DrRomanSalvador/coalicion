name: Unlock verification
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install --disable-pip-version-check --no-input -r requirements.txt
      - name: OOS
        run: python scripts/complete_historical_calibration.py --input artifacts/data/cis_historical_2004_2023.csv --output /tmp/oos.json
      - name: OOS gate
        run: |
          python - <<'PY'
          import json, math
          x=json.load(open("/tmp/oos.json"))
          print(json.dumps(x,indent=2,ensure_ascii=False))
          assert x["status"]=="PASS"
          c=x["empirical_90pct_interval_calibration"]["BASE"]["mean_coverage"]
          assert c is not None and math.isfinite(c) and c>=0.85
          PY
      - name: MC 10000
        run: python scripts/run_mc_10000.py --iterations 10000 --seed 20261008
      - name: SEEC territorial 10000
        run: python scripts/materialize_seec_posterior.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unlock-evidence
          path: |
            /tmp/oos.json
            ci_evidence/mc_10000.json
            ci_evidence/seec_posterior.json
