name: Unlock verification
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/complete_historical_calibration.py"
      - "scripts/run_mc_10000.py"
      - "scripts/materialize_seec_posterior.py"
      - "src/oos_pipeline.py"
      - "src/reproducibility_contract.py"
      - "data/resultados_oficiales_2004_2023.csv"
      - "artifacts/data/election_2023_canonical.json"
      - "requirements.txt"
      - ".github/workflows/unlock-verification.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: unlock-verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements.txt
      - name: Historical out-of-sample calibration
        run: python scripts/complete_historical_calibration.py --input artifacts/data/cis_historical_2004_2023.csv --output /tmp/oos.json
      - name: Enforce OOS certification gate
        run: |
          python - <<'PY'
          import json, math
          x=json.load(open("/tmp/oos.json", encoding="utf-8"))
          assert x.get("schema") == "HISTORICAL_OOS_CALIBRATION_V2", x.get("schema")
          assert x.get("status") == "PASS", x.get("status")
          assert x.get("certification_gate", {}).get("passed") is True
          c=x["empirical_90pct_interval_calibration"]["BASE"]["mean_coverage"]
          assert c is not None and math.isfinite(c) and c >= 0.85, c
          print("OOS CERTIFICATION PASS", c)
          PY
      - name: Run canonical 10k Monte Carlo
        run: python scripts/run_mc_10000.py --iterations 10000 --seed "$(python -c 'from src.reproducibility_contract import ExecutionContract; print(ExecutionContract.seed)')"
      - name: Materialize territorial posterior
        run: python scripts/materialize_seec_posterior.py
      - name: Verify reproducible evidence
        run: |
          python - <<'PY'
          import json
          mc=json.load(open("ci_evidence/mc_10000.json", encoding="utf-8"))
          posterior=json.load(open("ci_evidence/seec_posterior.json", encoding="utf-8"))
          assert mc["status"] == "PASS" and mc["iterations"] >= 10000
          assert mc["seed"] == mc["canonical_seed"]
          assert mc["constituencies"] == 52 and mc["seats"] == 350
          assert mc["invariants"]["every_draw_seat_sum_350"] is True
          assert posterior["status"] == "PASS" and posterior["draws"] >= 10000
          assert posterior["constituencies"] == 52
          assert posterior["external_audit"] is False
          print("UNLOCK VERIFICATION PASS")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unlock-evidence
          path: |
            /tmp/oos.json
            ci_evidence/mc_10000.json
            ci_evidence/seec_posterior.json
          if-no-files-found: ignore
