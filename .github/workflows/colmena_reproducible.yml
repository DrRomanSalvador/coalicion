name: Colmena reproducible

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: contract-main
  cancel-in-progress: true

jobs:
  contract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest numpy
      - name: Reanudación de contexto
        id: resume
        continue-on-error: true
        run: python -m src.colmena_resume
      - name: Contrato reproducible
        id: contract
        continue-on-error: true
        run: python -m src.reproducibility_contract
      - name: Suite contractual
        id: tests
        continue-on-error: true
        run: pytest -q tests/test_reproducibility_contract.py tests/test_error_registry.py tests/test_colmena_resume.py tests/test_product_contract.py tests/test_resume_error_registry_consistency.py
      - name: Resultado del gate
        if: always()
        env:
          RESUME: ${{ steps.resume.outcome }}
          CONTRACT: ${{ steps.contract.outcome }}
          TESTS: ${{ steps.tests.outcome }}
        run: |
          printf 'resume=%s\ncontract=%s\ntests=%s\n' "$RESUME" "$CONTRACT" "$TESTS"
          test "$RESUME" = success && test "$CONTRACT" = success && test "$TESTS" = success
