name: Repair canonical historical materialization

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-materialization.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-canonical-materialization
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild exact canonical CSV from official parts
        run: |
          set -euo pipefail
          python scripts/materialize_official_history_from_parts.py

      - name: Verify canonical materialization
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          p = Path("data/resultados_oficiales_2004_2023.csv")
          manifest = json.loads(Path("data/manifests/INTERIOR_ACQUISITION.json").read_text(encoding="utf-8"))
          assert p.is_file() and p.stat().st_size > 1000, "canonical CSV missing or empty"
          assert manifest.get("status") == "PASS", "official acquisition manifest is not PASS"
          assert manifest.get("source_tier") == "PRIMARY_INTERIOR", "non-primary source cannot be canonical"
          official = manifest.get("official_results", {})
          assert official.get("rows") == 50700, "unexpected canonical row count"
          assert len(official.get("elections", [])) == 8, "unexpected election count"
          assert official.get("constituencies_per_election") == 52, "unexpected constituency count"
          assert official.get("seats_per_election") == 350, "unexpected seat count"
          actual_sha = hashlib.sha256(p.read_bytes()).hexdigest()
          assert actual_sha == manifest.get("derived_csv_sha256"), "CSV SHA-256 does not match acquisition manifest"
          assert p.stat().st_size == manifest.get("derived_csv_bytes"), "CSV size does not match acquisition manifest"
          print(f"PASS: canonical official CSV verified against manifest ({actual_sha})")
          PY

      - name: Commit repaired materialization with concurrency recovery
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/resultados_oficiales_2004_2023.csv data/manifests/INTERIOR_ACQUISITION.json
          if git diff --cached --quiet; then
            echo "Canonical materialization already exact."
            exit 0
          fi
          git commit -m "fix(data): restore exact canonical historical materialization"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git merge-base --is-ancestor HEAD origin/main; then
              echo "Canonical materialization commit is already present on main."
              exit 0
            fi
            if ! git rebase origin/main; then
              git rebase --abort
              echo "::error::Canonical CSV or manifest changed concurrently; refusing to overwrite newer official data."
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Canonical materialization persisted (attempt $attempt)."
              exit 0
            fi
            echo "Concurrent main update; retrying canonical materialization ($attempt/5)." >&2
            sleep "$((attempt * 3))"
          done
          echo "::error::Unable to persist canonical materialization after 5 retries."
          exit 1
