name: SEEC 10000 territorial posterior evidence
on:
  push:
    branches: [main]
    paths: ["scripts/materialize_seec_posterior.py","data/resultados_oficiales_2004_2023.csv",".github/workflows/seec-10000-evidence.yml"]
  workflow_dispatch:
permissions: {contents: write}
concurrency:
  group: seec-posterior-persistence-${{ github.ref }}
  cancel-in-progress: false
jobs:
  posterior:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check --no-input "numpy>=2.0,<2.4"
      - run: python scripts/materialize_seec_posterior.py
      - run: |
          python - <<'PY'
          import json
          x=json.load(open("ci_evidence/seec_posterior.json"))
          assert x["status"]=="PASS"
          assert x["draws"]>=10000
          assert x["constituencies"]==52
          assert x["rng_algorithm"]=="numpy.PCG64"
          PY
      - name: Persist SEEC evidence on main only with race recovery
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          snapshot="$(mktemp)"
          cp ci_evidence/seec_posterior.json "$snapshot"
          expected_input_sha="$(python -c 'import json; print(json.load(open("ci_evidence/seec_posterior.json", encoding="utf-8"))["input_sha256"])')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            current_input_sha="$(sha256sum data/resultados_oficiales_2004_2023.csv | cut -d ' ' -f1)"
            if [ "$current_input_sha" != "$expected_input_sha" ]; then
              echo "::error::FAIL_CLOSED: official input changed during inference; rerun against the current main dataset."
              exit 1
            fi

            mkdir -p ci_evidence
            cp "$snapshot" ci_evidence/seec_posterior.json
            git add ci_evidence/seec_posterior.json
            if git diff --cached --quiet; then
              echo "SEEC evidence is already current on main."
              exit 0
            fi

            git commit -m "ci: materialize genuine 10k SEEC posterior evidence"
            if git push origin HEAD:main; then
              echo "SEEC evidence persisted on main (attempt $attempt)."
              exit 0
            fi
            echo "Concurrent main update; retrying from the newest main (attempt $attempt)." >&2
            sleep "$((attempt * 3))"
          done

          echo "::error::Unable to persist SEEC evidence after 5 concurrent-update retries."
          exit 1
