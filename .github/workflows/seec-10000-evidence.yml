name: SEEC 10000 territorial posterior evidence
on:
  push:
    branches: [main]
    paths: ["scripts/materialize_seec_posterior.py","data/resultados_oficiales_2004_2023.csv",".github/workflows/seec-10000-evidence.yml"]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  posterior:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check --no-input "numpy>=2.0,<2.4"
      - run: python scripts/materialize_seec_posterior.py
      - run: |
          python - <<'PY'
          import json
          x=json.load(open("ci_evidence/seec_posterior.json"))
          assert x["status"]=="PASS"
          assert x["draws"]>=10000
          assert x["constituencies"]==52
          assert x["rng_algorithm"]=="numpy.PCG64"
          PY
      - name: Persist SEEC evidence on main only
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci_evidence/seec_posterior.json
          git diff --cached --quiet || (git commit -m "ci: materialize genuine 10k SEEC posterior evidence" && git push origin HEAD:main)
