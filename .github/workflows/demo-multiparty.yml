name: Demo multiparty 2023

on:
  push:
    branches: [main]
    paths:
      - "scripts/demo_multiparty.py"
      - "config/demo_multiparty_2023.json"
      - "artifacts/demo_multiparty_2023.json"
      - "artifacts/data/election_2023_canonical.json"
      - "src/electoral.py"
      - "src/coalition.py"
      - "scripts/demo_e2e.py"
      - "tests/test_demo_multiparty.py"
      - "scripts/demo_decision_analysis.py"
      - "tests/test_demo_decision_analysis.py"
      - "DECISION_ANALYSIS_USAGE.md"
      - "web/demo/index.html"
      - "tests/test_demo_decision_ui.py"
      - "tests/test_demo_e2e.py"
      - ".github/workflows/demo-multiparty.yml"
  pull_request:
    paths:
      - "scripts/demo_multiparty.py"
      - "config/demo_multiparty_2023.json"
      - "artifacts/demo_multiparty_2023.json"
      - "artifacts/data/election_2023_canonical.json"
      - "src/electoral.py"
      - "src/coalition.py"
      - "scripts/demo_e2e.py"
      - "scripts/demo_decision_analysis.py"
      - "tests/test_demo_decision_analysis.py"
      - "DECISION_ANALYSIS_USAGE.md"
      - "web/demo/index.html"
      - "tests/test_demo_decision_ui.py"
      - "tests/test_demo_multiparty.py"
      - "tests/test_demo_e2e.py"
      - ".github/workflows/demo-multiparty.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coalicion-demo-multiparty
  cancel-in-progress: true

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run multiparty tests
        run: python -m pytest -q tests/test_demo_multiparty.py
      - name: Run existing end-to-end demo and regression
        run: |
          python scripts/demo_e2e.py
          python -m pytest -q tests/test_demo_e2e.py tests/test_coalition.py tests/test_neutral_audit.py
      - name: Generate multiparty result artifact
        run: python scripts/demo_multiparty.py --output artifacts/demo_multiparty_2023.json
      - name: Run decision-analysis tests
        run: python -m pytest -q tests/test_demo_decision_analysis.py
      - name: Generate decision analysis and executive report
        run: python scripts/demo_decision_analysis.py
      - name: Test interactive decision interface
        run: python -m pytest -q tests/test_demo_decision_ui.py
      - name: Validate generated JSON and report
        run: |
          python -m json.tool artifacts/demo_multiparty_2023.json > /dev/null
          python -m json.tool artifacts/demo_decision_analysis_2023.json > /dev/null
          test -s reports/demo_decision_analysis_2023.md
      - name: Require existing demo artifact to be reproducible
        run: git diff --exit-code -- artifacts/demo_multiparty_2023.json
      - name: Upload reproducible demo result
        uses: actions/upload-artifact@v4
        with:
          name: coalicion-demo-multiparty-2023
          path: |
            artifacts/demo_multiparty_2023.json
            artifacts/demo_decision_analysis_2023.json
            reports/demo_decision_analysis_2023.md
          if-no-files-found: error
