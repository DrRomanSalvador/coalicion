name: Integrate official CIS historical surveys

on:
  pull_request:
    branches: ["main"]
    paths:
      - "scripts/ingest_cis_historical_surveys.R"
      - ".github/workflows/integrate-cis-history.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev
      - name: Install R dependencies
        run: |
          Rscript -e 'install.packages(c("opencis","dplyr","readr","tibble","haven","purrr"), repos="https://cloud.r-project.org")'
      - name: Ingest CIS historical surveys
        run: Rscript scripts/ingest_cis_historical_surveys.R
      - name: Validate CIS dataset
        run: |
          python - <<'PY'
          import csv, hashlib, json
          from pathlib import Path
          p=Path("data/encuestas_historicas_2004_2023.csv")
          assert p.exists() and p.stat().st_size>1000
          with p.open(encoding="utf-8",newline="") as f: rows=list(csv.DictReader(f))
          assert len(rows)>=1000, len(rows)
          assert {r["nivel_fuente"] for r in rows}=={"PRIMARY_OFFICIAL_MICRODATA"}
          manifest={"schema":"CIS_HISTORICAL_DATA_V1","status":"PASS","path":str(p),
                    "sha256":hashlib.sha256(p.read_bytes()).hexdigest(),
                    "rows":len(rows),"studies":len({r["codigo_estudio"] for r in rows})}
          Path("data/manifests").mkdir(parents=True,exist_ok=True)
          Path("data/manifests/CIS_HISTORICAL_DATA.json").write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(manifest,ensure_ascii=False,indent=2))
          PY
      - name: Commit CIS data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/encuestas_historicas_2004_2023.csv data/manifests/CIS_HISTORICAL_DATA.json
          git diff --cached --quiet && exit 0
          git commit -m "Add official CIS historical survey data"
          git push origin "HEAD:$GITHUB_HEAD_REF"
