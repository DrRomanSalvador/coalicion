name: COALICIÓN — Situation Brief

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "config/**"
      - ".github/workflows/situation_brief.yml"
  schedule:
    - cron: "0 8 * * *"
      timezone: "Europe/Madrid"
    - cron: "0 16 * * *"
      timezone: "Europe/Madrid"
    - cron: "0 0 * * *"
      timezone: "Europe/Madrid"

permissions:
  contents: write

concurrency:
  group: situation-brief-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate situation state
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/generate_situation_state.py

      - name: Generate review briefing
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m src.email.newsletter

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check --no-input pytest

      - name: Verify deterministic contracts
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/test_situation_state.py tests/test_operational_briefing.py tests/test_electoral_intelligence.py

      - name: Persist materialized state
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          git config user.name "coalicion-situation[bot]"
          git config user.email "coalicion-situation[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            python scripts/generate_situation_state.py
            python -m src.email.newsletter

            git add artifacts/situation_state.json artifacts/newsletter/latest.html
            if git diff --cached --quiet; then
              echo "No materialized change."
              exit 0
            fi

            git commit -m "chore(intelligence): materialize situation brief"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Concurrent main update; retrying ($attempt/5)."
            git reset --hard HEAD^
          done

          echo "Unable to push materialized state after 5 attempts."
          exit 1
