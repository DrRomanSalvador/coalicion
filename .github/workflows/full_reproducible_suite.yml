name: Full reproducible suite — tests + OOS + SEEC

on:
  push:
    branches: [main]
    paths: ["src/**","tests/**","scripts/**","data/**","artifacts/data/**","requirements.txt",".github/workflows/full_reproducible_suite.yml"]
  workflow_dispatch:

concurrency:
  group: full-reproducible-suite-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q src tests scripts
      - run: python -m pytest -q

  oos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --no-input "numpy>=2.0,<2.4"
      - run: python scripts/complete_historical_calibration.py --input artifacts/data/cis_historical_2004_2023.csv --output ci_evidence/oos_calibration.json
      - run: |
          python - <<'PY'
          import json, math
          x=json.load(open("ci_evidence/oos_calibration.json", encoding="utf-8"))
          assert x["status"] == "PASS"
          assert x["leakage_checks"]["field_end_before_election"] is True
          assert x["leakage_checks"]["all_test_elections_use_only_prior_elections"] is True
          assert x["leakage_checks"]["evaluated_election_excluded_from_training"] is True
          c=x["empirical_90pct_interval_calibration"]["BASE"]["mean_coverage"]
          assert c is not None and math.isfinite(c) and c >= 0.85
          print(json.dumps({"status":x["status"],"n_rows":x["n_rows"],"n_elections":x["n_elections"],"walk_forward_holdouts":x["walk_forward_holdouts"],"base_coverage":c}, indent=2))
          PY

  seec:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: PYTHONPATH=. python scripts/run_seec_production.py

  gate:
    if: always()
    needs: [tests, oos, seec]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "tests=${{ needs.tests.result }}"
          echo "oos=${{ needs.oos.result }}"
          echo "seec=${{ needs.seec.result }}"
          test "${{ needs.tests.result }}" = success
          test "${{ needs.oos.result }}" = success
          test "${{ needs.seec.result }}" = success
