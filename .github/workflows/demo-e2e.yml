name: COALICIÓN demo end-to-end

on:
  push:
    branches: [main, demo/e2e-coalicion-20261009]
    paths:
      - "coalicion.py"
      - "src/coalition.py"
      - "src/decision.py"
      - "src/electoral.py"
      - "scripts/demo_e2e.py"
      - "tests/test_demo_e2e.py"
      - "tests/test_coalition.py"
      - "tests/test_neutral_audit.py"
      - "artifacts/data/election_2023_canonical.json"
      - "artifacts/data/election_2023_audit.json"
      - ".github/workflows/demo-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coalicion-demo-e2e
  cancel-in-progress: true

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run real-data demo
        run: python scripts/demo_e2e.py
      - name: Run focused regression tests
        run: pytest -q tests/test_demo_e2e.py tests/test_coalition.py tests/test_neutral_audit.py
