name: OOS calibration — canonical gate

on:
  push:
    branches: [main]
    paths:
      - "src/oos_pipeline.py"
      - "src/bias_filter.py"
      - "src/context_corrections.py"
      - "src/poll_error.py"
      - "src/cis_history.py"
      - "scripts/complete_historical_calibration.py"
      - "artifacts/data/cis_historical_2004_2023.csv"
      - "data/resultados_oficiales_2004_2023.csv"
      - ".github/workflows/oos-calibration.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oos-calibration-main
  cancel-in-progress: false

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deterministic runtime
        run: |
          python -m pip install --disable-pip-version-check --no-input "numpy>=2.0,<2.4"
      - name: Execute expanding-window OOS calibration
        run: |
          set -euo pipefail
          python scripts/complete_historical_calibration.py \
            --input artifacts/data/cis_historical_2004_2023.csv \
            --output ci_evidence/oos_calibration.json
      - name: Verify OOS evidence contract
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          p = Path("ci_evidence/oos_calibration.json")
          x = json.loads(p.read_text())
          assert x["status"] == "PASS"
          assert x["n_rows"] > 0
          assert x["n_elections"] >= 3
          assert x["walk_forward_holdouts"] >= 1
          assert x["leakage_checks"]["field_end_before_election"] is True
          assert x["leakage_checks"]["all_test_elections_use_only_prior_elections"] is True
          assert x["leakage_checks"]["evaluated_election_excluded_from_training"] is True
          base = x["empirical_90pct_interval_calibration"]["BASE"]
          coverage = base["mean_coverage"]
          assert coverage is not None and math.isfinite(coverage) and coverage >= 0.85
          for model, metrics in x["row_level_metrics"].items():
              for key in ("mae","rmse","median_abs_error","max_abs_error","bias"):
                  assert math.isfinite(float(metrics[key])), (model, key)
          PY
      - name: Commit genuine OOS evidence with stale-input and race protection
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tested_sha="$(git rev-parse HEAD)"
          cp ci_evidence/oos_calibration.json /tmp/oos_calibration.json
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            current_sha="$(git rev-parse origin/main)"
            if [ "$tested_sha" != "$current_sha" ]; then
              changed_paths="$(git diff --name-only "$tested_sha" "$current_sha")"
              unexpected_paths="$(printf '%s\n' "$changed_paths" | awk '$0 !~ /^(ci_evidence\/|reports\/)/')"
              if [ -n "$unexpected_paths" ]; then
                echo "::notice::OOS evidence was tested against $tested_sha but main changed in code/data; stale evidence will not be published."
                printf 'tested=%s current=%s\nchanged paths:\n%s\n' "$tested_sha" "$current_sha" "$unexpected_paths" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
            git reset --hard origin/main
            mkdir -p ci_evidence
            cp /tmp/oos_calibration.json ci_evidence/oos_calibration.json
            git add ci_evidence/oos_calibration.json
            if git diff --cached --quiet; then
              echo "OOS evidence is already current."
              exit 0
            fi
            git commit -m "ci: materialize expanding-window OOS calibration evidence"
            if git push origin HEAD:main; then
              echo "OOS evidence persisted after freshness validation (attempt $attempt)."
              exit 0
            fi
            echo "Concurrent main update; retrying OOS evidence persistence ($attempt/5)." >&2
            sleep "$((attempt * 3))"
          done
          echo "::error::Unable to persist fresh OOS evidence after five attempts."
          exit 1

# canonical OOS gate: strict election-code scope validation
