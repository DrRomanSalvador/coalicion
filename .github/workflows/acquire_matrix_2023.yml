name: Acquire and certify 2023 coalition matrix

on:
  workflow_dispatch:
permissions:
  contents: write

concurrency:
  group: acquire-matrix-2023
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias de adquisición
        run: python -m pip install --upgrade pip openpyxl certifi requests beautifulsoup4
      - name: Adquirir y validar matriz 2023
        run: python scripts/acquire_2023_matrix.py
      - name: Auditoría fail-closed
        run: |
          python -m src.neutral_audit artifacts/data/election_2023_canonical.json | tee artifacts/data/election_2023_audit.json
          test "$(python -c 'import json; print(json.load(open("artifacts/data/election_2023_audit.json"))["status"])')" = "PASS"
      - name: Hash canónico
        run: sha256sum artifacts/data/election_2023_canonical.json | tee artifacts/data/election_2023_canonical.json.sha256
      - name: Verificación de invariantes
        run: |
          python -m pytest -q tests/test_neutral_coalition.py tests/test_neutral_audit.py tests/test_electoral.py tests/test_decision.py
      - name: Persistir evidencia
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/data/election_2023_canonical.json artifacts/data/election_2023_matrix_acquisition.json artifacts/data/election_2023_audit.json artifacts/data/election_2023_canonical.json.sha256 data/manifests/official_interior_congreso.json data/official_interior_congreso_1977_2023.csv
          if git diff --cached --quiet; then
            echo "NO_CHANGES"
          else
            git commit -m "data: materialize verified 2023 constituency matrix"
            git push
          fi
