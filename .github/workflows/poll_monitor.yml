name: Autonomous poll monitor

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "artifacts/**"
  schedule:
    - cron: "2-59/5 * * * *"

permissions:
  contents: write

concurrency:
  group: autonomous-poll-monitor-main
  cancel-in-progress: false

jobs:
  poll_monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml pytest
          python -m json.tool config/poll_monitor.json >/dev/null
          python -m pytest tests/test_poll_monitor.py -q

      - name: Monitorizar fuentes
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python -m src.poll_monitor

      - name: Commit histórico y estado (resistente a carreras)
        run: |
          set -euo pipefail
          git config user.name "coalicion-poll-monitor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/poll_monitor_state.json artifacts/surveys artifacts/survey_history.jsonl
          if git diff --cached --quiet; then
            echo "Sin cambios persistibles."
            exit 0
          fi
          git commit -m "chore: persist poll monitor state"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git merge-base --is-ancestor origin/main HEAD; then
              if git push origin HEAD:main; then
                echo "Persistencia publicada en main (intento $attempt)."
                exit 0
              fi
            else
              echo "main avanzó; rebasando el commit de persistencia (intento $attempt)."
              git rebase --autostash origin/main
              continue
            fi
            echo "Push rechazado por avance remoto; reintentando sincronización (intento $attempt)."
            git fetch origin main
            git rebase --autostash origin/main
          done
          echo "ERROR: no se pudo publicar el estado después de 5 intentos."
          exit 1
