name: Autonomous poll monitor

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "artifacts/**"
      - "ci_evidence/**"
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: autonomous-poll-monitor-main
  cancel-in-progress: false

jobs:
  poll_monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml feedparser pytest
          python -m json.tool config/poll_monitor.json >/dev/null
          python -m pytest tests/test_poll_monitor.py tests/test_cis_monitor.py tests/test_electomania_monitor.py tests/test_dato_electoral_monitor.py tests/test_twitter_monitor.py tests/test_poll_validator.py tests/test_poll_hasher.py tests/test_poll_normalizer.py -q

      - name: Monitorizar fuentes
        id: monitor
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.reina_token }}
          TELEGRAM_ALLOWED_CHATS: ${{ secrets.TELEGRAM_ALLOWED_CHATS || secrets.TELEGRAM_CHAT_ID }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: |
          set -euo pipefail
          set +e
          python -m src.poll_monitor
          monitor_rc=$?
          set -e
          echo "monitor_exit_code=$monitor_rc" >> "$GITHUB_OUTPUT"

          # Snapshot the poll monitor's own state before downstream materialization.
          # Persist this diagnostic state even when coverage/notification is BLOCKED.
          test -f artifacts/poll_monitor_state.json || {
            echo "::error::Poll monitor state is missing after execution."
            exit 1
          }
          rm -rf /tmp/poll-monitor-snapshot
          mkdir -p /tmp/poll-monitor-snapshot/surveys
          cp artifacts/poll_monitor_state.json /tmp/poll-monitor-snapshot/
          if [[ -f artifacts/survey_history.jsonl ]]; then
            cp artifacts/survey_history.jsonl /tmp/poll-monitor-snapshot/
          else
            touch /tmp/poll-monitor-snapshot/survey_history.jsonl
          fi
          if [[ -d artifacts/surveys ]]; then
            cp -a artifacts/surveys/. /tmp/poll-monitor-snapshot/surveys/
          fi

          if [[ "$monitor_rc" -eq 0 ]]; then
            python scripts/materialize_estimation_inputs.py
            python scripts/materialize_poll_source_coverage.py
            cp ci_evidence/poll_source_coverage.json /tmp/poll-monitor-snapshot/
            cp artifacts/estimation/observations.json /tmp/poll-monitor-snapshot/observations.json
          else
            echo "::warning::Poll monitor reported BLOCKED. Derived inputs are not refreshed; state will be persisted before the final failure gate."
          fi

      - name: Persistir estado con autocuración de carreras
        if: always() && github.ref == 'refs/heads/main' && steps.monitor.outputs.monitor_exit_code != ''
        id: persist
        run: |
          set -euo pipefail
          git config user.name "coalicion-poll-monitor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            # Reaplicar el snapshot ya validado. Nunca hacemos rebase de JSON/JSONL.
            test -f /tmp/poll-monitor-snapshot/poll_monitor_state.json || { echo "::error::Poll state snapshot missing."; exit 1; }
            cp /tmp/poll-monitor-snapshot/poll_monitor_state.json artifacts/poll_monitor_state.json
            cp /tmp/poll-monitor-snapshot/survey_history.jsonl artifacts/survey_history.jsonl
            rm -rf artifacts/surveys
            mkdir -p artifacts/surveys
            cp -a /tmp/poll-monitor-snapshot/surveys/. artifacts/surveys/
            git add artifacts/poll_monitor_state.json artifacts/surveys artifacts/survey_history.jsonl
            if [[ -f /tmp/poll-monitor-snapshot/observations.json ]]; then
              cp /tmp/poll-monitor-snapshot/observations.json artifacts/estimation/observations.json
              git add artifacts/estimation/observations.json
            fi
            if [[ -f /tmp/poll-monitor-snapshot/poll_source_coverage.json ]]; then
              cp /tmp/poll-monitor-snapshot/poll_source_coverage.json ci_evidence/poll_source_coverage.json
              git add ci_evidence/poll_source_coverage.json
            fi
            if git diff --cached --quiet; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "Sin cambios persistibles."
              exit 0
            fi

            git commit -m "chore: persist poll monitor state"

            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "Persistencia publicada en main (intento $attempt)."
              exit 0
            fi

            echo "Carrera detectada; regenerando commit sobre el main más reciente (intento $attempt)."
          done

          echo "ERROR: no se pudo publicar el estado después de 5 intentos."
          exit 1

      - name: Despertar COALMENA automáticamente
        if: steps.persist.outputs.changed == 'true' && steps.monitor.outputs.monitor_exit_code == '0' && steps.monitor.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/dispatches" \
            -f event_type="poll_monitor_completed" \
            -f "client_payload[commit]=${GITHUB_SHA}" \
            -f "client_payload[source]=poll_monitor"
      - name: Fail closed after persisting monitor state
        if: always() && steps.monitor.outcome != 'skipped'
        env:
          MONITOR_EXIT_CODE: ${{ steps.monitor.outputs.monitor_exit_code }}
          MONITOR_OUTCOME: ${{ steps.monitor.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$MONITOR_EXIT_CODE" ]]; then
            echo "::error::Poll monitor did not produce an exit status; refusing to report success."
            exit 1
          fi
          if [[ "$MONITOR_EXIT_CODE" != "0" ]]; then
            echo "::error::Poll monitor reported BLOCKED coverage or undelivered required alerts. State persistence was attempted before this gate."
            exit 1
          fi
          if [[ "$MONITOR_OUTCOME" != "success" ]]; then
            echo "::error::Poll monitor/materialization step failed; downstream state is not certified."
            exit 1
          fi
