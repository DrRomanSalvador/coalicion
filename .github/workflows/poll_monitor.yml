name: Autonomous poll monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: autonomous-poll-monitor
  cancel-in-progress: false

jobs:
  poll_monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml
          python -m pytest tests/test_poll_monitor.py -q

      - name: Monitorizar fuentes
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python -m src.poll_monitor

      - name: Commit histórico y estado
        run: |
          git config user.name "coalicion-poll-monitor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/poll_monitor_state.json artifacts/surveys artifacts/survey_history.jsonl
          if git diff --cached --quiet; then
            echo "Sin cambios persistibles."
          else
            git commit -m "chore: persist poll monitor state"
            git push
          fi
