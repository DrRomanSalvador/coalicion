name: Methodology validation

on:
  push:
    branches: [main]
    paths:
      - "src/models/**"
      - "src/methodology_registry.py"
      - "src/methodology_bridge.py"
      - "src/prediction.py"
      - "src/rapid_decision_center.py"
      - "src/electoral_radar_adapter.py"
      - "tests/test_methodology_*.py"
      - "requirements.txt"
      - "requirements-optional-methodology.txt"
      - ".github/workflows/methodology_validation.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-methodology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install core dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: |
          python -m py_compile             src/methodology_registry.py             src/models/*.py             src/prediction.py             src/rapid_decision_center.py             src/electoral_radar_adapter.py
      - name: Test methodology adapters
        run: python -m pytest -q tests/test_methodology_registry.py tests/test_methodology_bridge.py tests/test_methodology_models.py
      - name: Test canonical integration
        run: python -m pytest -q tests/test_electoral_intelligence.py tests/test_electoral_radar_adapter.py
