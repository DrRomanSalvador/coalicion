name: Primary Interior fast materialization
on:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths:
      - "scripts/materialize_primary_interior.py"
      - "scripts/materialize_official_history_from_parts.py"
      - "data/official_materialization_parts/**"
      - ".github/workflows/primary-interior-materialization.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check --no-input openpyxl certifi
      - name: Materialize official source
        run: |
          set -euo pipefail
          if [ -d data/official_materialization_parts ] && [ "$(find data/official_materialization_parts -name "*.csv" | wc -l)" -eq 11 ]; then
            python scripts/materialize_official_history_from_parts.py
          else
            python scripts/materialize_primary_interior.py
          fi
      - run: |
          set -euo pipefail
          mkdir -p ci_evidence
          cp data/manifests/INTERIOR_ACQUISITION.json ci_evidence/interior_acquisition.json
          printf 'PRIMARY_INTERIOR\n' > ci_evidence/historico_source_tier.txt
      - name: Commit primary materialization
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/resultados_oficiales_2004_2023.csv data/manifests/INTERIOR_ACQUISITION.json ci_evidence/interior_acquisition.json ci_evidence/historico_source_tier.txt
          git add -f data/raw/Elecciones-Congreso.xlsx 2>/dev/null || true
          python - <<'PY'
          from pathlib import Path
          p=Path(".github/workflows/primary-interior-materialization.yml")
          s=p.read_text()
          s=s.replace('  schedule:\n    - cron: "*/5 * * * *"\n','')
          p.write_text(s)
          PY
          git add .github/workflows/primary-interior-materialization.yml
          git commit -m "Materialize primary Interior historical electoral data" || exit 0
          git push origin HEAD:main
