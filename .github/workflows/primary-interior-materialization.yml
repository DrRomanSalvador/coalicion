name: Primary Interior fast materialization
on:
  schedule:
    - cron: "17 4 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/materialize_primary_interior.py"
      - "scripts/materialize_official_history_from_parts.py"
      - "scripts/materialize_official_interior_dataset.py"
      - "src/data.py"
      - "src/electoral.py"
      - "data/official_materialization_parts/**"
      - ".github/workflows/primary-interior-materialization.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check --no-input openpyxl certifi
      - name: Materialize official source
        run: |
          set -euo pipefail
          if [ -d data/official_materialization_parts ] && [ "$(find data/official_materialization_parts -name "*.csv" | wc -l)" -eq 11 ]; then
            if ! python scripts/materialize_official_history_from_parts.py; then
              echo "Materialization parts failed integrity; falling back to primary Interior acquisition."
              python scripts/materialize_primary_interior.py
            fi
          else
            python scripts/materialize_primary_interior.py
          fi
      - name: Materialize workbook-derived historical dataset
        run: |
          set -euo pipefail
          # Fresh runners do not retain ignored/uncommitted XLSX files from previous runs.
          # Acquire the pinned official workbook before deriving the 16-election dataset.
          if [ ! -s data/raw/Elecciones-Congreso.xlsx ]; then
            python scripts/materialize_primary_interior.py
          fi
          test -s data/raw/Elecciones-Congreso.xlsx
          python scripts/materialize_official_interior_dataset.py
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          p=Path("data/manifests/official_interior_congreso.json")
          m=json.loads(p.read_text(encoding="utf-8"))
          assert m["status"] == "READY"
          assert m["sha256"] == "dba3394f1812f338067231bce68acf56af1e13ddf8cfb709a814bcc46357ebc2"
          assert m["bytes"] == Path("data/raw/Elecciones-Congreso.xlsx").stat().st_size
          assert len(m["elections"]) == 16
          assert m["constituencies"] == 52
          assert m["validated_2023"]["status"] == "PASS"
          reconciliation = m["validated_2023"]["vote_seat_reconciliation"]
          assert reconciliation["status"] == "PASS"
          assert reconciliation["constituencies"] == 52
          assert reconciliation["discrepancies"] == 0
          csv_path = Path("data/official_interior_congreso_1977_2023.csv")
          canonical_path = Path("artifacts/data/election_2023_canonical.json")
          sidecar_path = canonical_path.with_name(canonical_path.name + ".sha256")
          assert csv_path.stat().st_size == m["normalized_csv_bytes"] > 0
          assert hashlib.sha256(csv_path.read_bytes()).hexdigest() == m["normalized_csv_sha256"]
          assert canonical_path.stat().st_size == m["canonical_2023_bytes"] > 0
          canonical_sha = hashlib.sha256(canonical_path.read_bytes()).hexdigest()
          assert canonical_sha == m["canonical_2023_sha256"]
          assert sidecar_path.read_text(encoding="utf-8").strip().split()[0] == canonical_sha
          PY
      - run: |
          set -euo pipefail
          mkdir -p ci_evidence
          cp data/manifests/INTERIOR_ACQUISITION.json ci_evidence/interior_acquisition.json
          printf 'PRIMARY_INTERIOR\n' > ci_evidence/historico_source_tier.txt
      - name: Commit primary materialization
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/resultados_oficiales_2004_2023.csv data/manifests/INTERIOR_ACQUISITION.json ci_evidence/interior_acquisition.json ci_evidence/historico_source_tier.txt
          git add data/official_interior_congreso_1977_2023.csv data/manifests/official_interior_congreso.json artifacts/data/election_2023_canonical.json artifacts/data/election_2023_canonical.json.sha256
          git add -f data/raw/Elecciones-Congreso.xlsx 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No validated materialization changes to commit."
            exit 0
          fi
          git commit -m "Materialize primary Interior historical electoral data"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            echo "Concurrent main update; retrying materialization push."
            sleep $((attempt * 5))
          done
          echo "FAIL-CLOSED: could not publish validated primary materialization after concurrent-update retries."
          exit 1
