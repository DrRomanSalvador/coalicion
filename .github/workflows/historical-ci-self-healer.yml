name: Historical CI self-healer

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: historical-ci-self-healer
  cancel-in-progress: false

jobs:
  heal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Converge historical CI to green
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          workflow="Historical data — canonical integration"

          for cycle in 1 2 3; do
            run_json="$(gh run list --repo "${{ github.repository }}" --workflow "${workflow}" --limit 1 --json databaseId,status,conclusion,headBranch,headSha)"
            run_id="$(python -c 'import json,sys; x=json.loads(sys.argv[1]); print(x[0]["databaseId"] if x else "")' "${run_json}")"
            if [ -z "$run_id" ]; then
              echo "No historical run exists yet."
              exit 0
            fi

            status="$(python -c 'import json,sys; print(json.loads(sys.argv[1])[0]["status"])' "${run_json}")"
            conclusion="$(python -c 'import json,sys; print(json.loads(sys.argv[1])[0].get("conclusion") or "")' "${run_json}")"
            echo "cycle=$cycle run=$run_id status=$status conclusion=$conclusion"

            if [ "$status" = "in_progress" ] || [ "$status" = "queued" ] || [ "$status" = "waiting" ] || [ "$status" = "requested" ]; then
              echo "Historical CI is still running; do not interfere."
              exit 0
            fi

            if [ "$conclusion" = "success" ]; then
              echo "Historical CI is GREEN."
              exit 0
            fi

            if [ "$conclusion" = "failure" ] || [ "$conclusion" = "cancelled" ] || [ "$conclusion" = "timed_out" ]; then
              echo "Historical CI is not green; re-running failed jobs."
              gh run rerun "$run_id" --repo "${{ github.repository }}" --failed
              sleep 20
              continue
            fi

            echo "Unknown terminal state: $conclusion"
            exit 1
          done

          echo "Self-healer handed control back to the next scheduled cycle."
