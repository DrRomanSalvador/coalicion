name: Historical CI orchestrator
# Sole automatic gate for historical execution; never overlaps active historical runs.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/ingest_official_electoral_history.R"
      - "scripts/ingest_cis_historical_surveys.R"
      - "scripts/validate_historical_data.py"
      - "scripts/run_full_oos.py"
      - "src/oos_pipeline.py"
      - "scripts/run_seec_production.py"
      - "scripts/master_certification.py"
      - "scripts/complete_historical_calibration.py"
      - "scripts/materialize_official_history_from_parts.py"
      - ".github/workflows/historical-data-integration.yml"
      - ".github/workflows/historical-ci-orchestrator.yml"
  workflow_run:
    workflows: ["Historical data — canonical integration"]
    types: [completed]
  schedule:
    - cron: "*/5 * * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: historical-ci-orchestrator
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Decide and dispatch exactly one historical run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          workflow_file="historical-data-integration.yml"
          current_sha="$(gh api "repos/$REPO/commits/main" --jq '.sha')"

          runs="$(gh run list --repo "$REPO" --workflow "$workflow_file" --limit 20             --json databaseId,status,conclusion,headSha,createdAt,updatedAt)"

          set +e
          python - "$runs" "$current_sha" <<'PY'
          import json, sys, subprocess, os
          from datetime import datetime, timezone
          runs=json.loads(sys.argv[1])
          sha=sys.argv[2]
          active={"queued","in_progress","waiting","requested","pending"}
          now=datetime.now(timezone.utc)
          fresh_active=False
          for r in runs:
              if r.get("status") not in active:
                  continue
              updated=r.get("updatedAt") or r.get("createdAt")
              age=(now-datetime.fromisoformat(updated.replace("Z","+00:00"))).total_seconds()
              if age < 300:
                  print(f"HISTORICAL_ACTIVE:{r['databaseId']}:{r['status']}:age={int(age)}")
                  fresh_active=True
                  continue
              print(f"HISTORICAL_STALE_CANCEL:{r['databaseId']}:age={int(age)}")
              try:
                  subprocess.run(["gh","run","cancel",str(r["databaseId"]),"--repo",os.environ["REPO"]],check=True)
              except subprocess.CalledProcessError as exc:
                  print(f"FAIL_CLOSED: could not cancel stale run {r['databaseId']}: {exc}", file=sys.stderr)
                  raise SystemExit(2)
          if fresh_active:
              raise SystemExit(0)
          for r in runs:
              if r.get("headSha")==sha and r.get("conclusion")=="success":
                  print(f"HISTORICAL_GREEN:{sha}")
                  raise SystemExit(0)
          raise SystemExit(1)
          PY
          decision=$?
          set -e
          case "$decision" in
            0) exit 0 ;;
            1) ;;
            *) echo "::error::Historical orchestration decision failed; refusing to dispatch a duplicate run."; exit "$decision" ;;
          esac

          echo "No active/green historical run for $current_sha; dispatching exactly one."