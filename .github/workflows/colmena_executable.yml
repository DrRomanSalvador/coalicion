name: COALMENA — Queen + Atomic Workers
# Real execution trigger: this workflow must produce observable runtime evidence.

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "docs/COLMENA_MISSION_CONTROL.json"
      - "scripts/colmena_*.py"
      - "scripts/colmena_local_ai.mjs"
      - ".github/workflows/colmena_executable.yml"
  pull_request:
    paths:
      - "docs/COLMENA_MISSION_CONTROL.json"
      - "scripts/colmena_*.py"
      - ".github/workflows/colmena_executable.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: colmena-executable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  queen-gate:
    name: Queen Gate
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore local AI cache
        id: local-ai-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            .cache
          key: ${{ runner.os }}-colmena-local-ai-v1-transformersjs-3.8.1-smollm2
      - name: Prepare local AI runtime
        if: steps.local-ai-cache.outputs.cache-hit != 'true'
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund @huggingface/transformers@3.8.1
      - name: Warm local AI model
        run: |
          node scripts/colmena_local_ai.mjs --warm
      - name: Real local AI smoke test
        run: |
          printf '%s\n' '{"agent_id":"agent-SMOKE","mission_id":"SMOKE","mission":"runtime smoke test","scope":"Generate one independent response."}' |
            node scripts/colmena_local_ai.mjs > smoke.json
          python - <<'PY'
          import json
          d=json.loads(open("smoke.json",encoding="utf-8").read().splitlines()[-1])
          assert d.get("content"), "LOCAL_AI_SMOKE_FAILED: empty generated content"
          print(json.dumps({"smoke":"PASS","model":d.get("model"),"response_sha256":__import__("hashlib").sha256(d["content"].encode()).hexdigest()}))
          PY
      - name: Save local AI cache
        if: steps.local-ai-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            .cache
          key: ${{ runner.os }}-colmena-local-ai-v1-transformersjs-3.8.1-smollm2
      - id: gate
        run: |
          set -euo pipefail
          python scripts/colmena_queen.py --ref "${GITHUB_SHA}" --output queen_approval.json
      - id: matrix
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          p=json.load(open("queen_approval.json",encoding="utf-8"))
          print("matrix="+json.dumps({
              "mission_id":[m["id"] for m in p["missions"]]
          },separators=(",",":")))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: colmena-queen-gate
          path: |
            queen_approval.json
            queen_state.json
          if-no-files-found: error
          retention-days: 14

  worker:
    name: "Worker ${{ matrix.mission_id }}"
    needs: queen-gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 32
      matrix: ${{ fromJSON(needs.queen-gate.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            .cache
          key: ${{ runner.os }}-colmena-local-ai-v1-transformersjs-3.8.1-smollm2
          fail-on-cache-miss: true
      - uses: actions/download-artifact@v4
        with:
          name: colmena-queen-gate
          path: .
      - name: Execute independent AI agent worker
        env:
          MISSION_ID: ${{ matrix.mission_id }}
          COLMENA_AGENT_PROVIDER: github-actions-local-transformers-js
          COLMENA_AI_AGENT_EXECUTION: "true"
          COLMENA_AGENT_MODEL: onnx-community/SmolLM2-135M-Instruct-ONNX-MHA:q4f16
          COLMENA_AGENT_EXECUTION_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.mission_id }}
        run: |
          set -euo pipefail
          mkdir -p worker_evidence
          python scripts/colmena_worker.py             --mission-id "$MISSION_ID"             --approval queen_approval.json             --ref "${GITHUB_SHA}"             --out "worker_evidence/$MISSION_ID.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "colmena-worker-${{ matrix.mission_id }}"
          path: worker_evidence/${{ matrix.mission_id }}.json
          if-no-files-found: error
          retention-days: 14

  queen-summary:
    name: Queen Final Reconciliation
    if: always() && needs.queen-gate.result == 'success'
    needs: [queen-gate, worker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: colmena-worker-*
          path: worker_evidence
          merge-multiple: true
      - name: Reconcile 179 AI worker evidences
        run: |
          python - <<'PY'
          import json, pathlib, sys
          files=sorted(pathlib.Path("worker_evidence").glob("M*.json"))
          rows=[json.loads(p.read_text()) for p in files]
          counts={}
          runtime_pass=0
          for r in rows:
              counts[r["status"]]=counts.get(r["status"],0)+1
              if r.get("runtime_status") == "PASS" and r.get("agent_runtime",{}).get("independent") is True and r.get("agent_runtime",{}).get("ai_execution") is True and isinstance(r.get("ai_inference"),dict):
                  runtime_pass += 1
          mission_failures=sorted(r["mission_id"] for r in rows if r.get("status")!="PASS")
          report={
              "schema":"COLMENA_RECONCILIATION_V3",
              "worker_files":len(rows),
              "expected_workers":179,
              "counts":counts,
              "runtime_pass":runtime_pass,
              "mission_pass":sum(r.get("status")=="PASS" for r in rows),
              "mission_failures":mission_failures,
              "fail_closed":True,
              "all_179_ai_runtime_pass":len(rows)==179 and runtime_pass==179,
              "all_179_missions_pass":len(rows)==179 and not mission_failures
          }
          pathlib.Path("reconciliation.json").write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(report,ensure_ascii=False))
          if not report["all_179_ai_runtime_pass"]:
              sys.exit(1)
          if not report["all_179_missions_pass"]:
              print("MISSION_CLOSURE_BLOCKED: runtime is real, but unresolved missions remain.")
              sys.exit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: colmena-reconciliation
          path: reconciliation.json
          if-no-files-found: error
          retention-days: 30
