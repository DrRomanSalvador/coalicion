name: Auditoria 2023 y suite SEEC

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/auditoria_2023.yml"
      - "src/**"
      - "tests/**"
      - "scripts/audit_2023.py"
      - "scripts/stage_historico_secondary.py"
      - "scripts/validate_historical_secondary.py"
      - "scripts/backtest_2023_baseline.py"
  pull_request:
    paths:
      - ".github/workflows/auditoria_2023.yml"
      - "src/**"
      - "tests/**"
      - "scripts/**"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python -m pip install --upgrade pip pytest pandas openpyxl certifi
      - name: Verificar contrato determinista y ancla primaria
        id: contract
        continue-on-error: true
        run: python -m src.reproducibility_contract
      - name: Ejecutar suite completa aunque el contrato falle
        id: tests
        continue-on-error: true
        run: python -m pytest -q
      - name: Capturar evidencia de tests
        if: always()
        run: |
          mkdir -p ci_evidence
          python -m pytest -q > ci_evidence/pytest.log 2>&1 || true
          python -m src.reproducibility_contract > ci_evidence/reproducibility_contract.json 2>&1 || true
          printf 'contract=%s\ntests=%s\n' "\${CONTRACT}" "\${TESTS}" > ci_evidence/test_outcomes.txt
      - name: Publicar artifacts de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-ci-evidence
          path: ci_evidence/
      - name: Resultado del gate de tests
        if: always()
        env:
          CONTRACT: ${{ steps.contract.outcome }}
          TESTS: ${{ steps.tests.outcome }}
        run: |
          printf 'contract=%s\ntests=%s\n' "$CONTRACT" "$TESTS"
          test "$CONTRACT" = success && test "$TESTS" = success

  audit-2023:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python -m pip install --upgrade pip pandas openpyxl certifi
      - name: Descargar fuente oficial Interior
        continue-on-error: true
        id: official
        run: |
          mkdir -p .audit_2023
          if ! curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 180 "https://descargas.interior.gob.es/datasets/resultados_electorales/Elecciones-Congreso.xlsx" -o .audit_2023/Elecciones-Congreso.xlsx; then
            python - <<'PY'
import certifi
from urllib.request import urlopen
url="https://descargas.interior.gob.es/datasets/resultados_electorales/Elecciones-Congreso.xlsx"
with urlopen(url, timeout=180, context=__import__("ssl").create_default_context(cafile=certifi.where())) as r:
    open(".audit_2023/Elecciones-Congreso.xlsx","wb").write(r.read())
PY
          fi
          test -s .audit_2023/Elecciones-Congreso.xlsx
          sha256sum .audit_2023/Elecciones-Congreso.xlsx | tee .audit_2023/source.sha256
      - name: Ejecutar auditoría 2023
        if: steps.official.outcome == 'success'
        run: python scripts/audit_2023.py
      - name: Publicar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-2023
          path: .audit_2023/

  historico-interior:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python -m pip install --upgrade pip pandas openpyxl pyreadr certifi
      - name: Intentar fuente primaria Interior
        id: official
        continue-on-error: true
        run: |
          mkdir -p .audit_historico
          if ! curl --fail --location --retry 5 --retry-all-errors --connect-timeout 20 --max-time 180 "https://descargas.interior.gob.es/datasets/resultados_electorales/Elecciones-Congreso.xlsx" -o .audit_historico/Elecciones-Congreso.xlsx; then
            python - <<'PY'
import certifi, ssl
from urllib.request import urlopen
url="https://descargas.interior.gob.es/datasets/resultados_electorales/Elecciones-Congreso.xlsx"
ctx=ssl.create_default_context(cafile=certifi.where())
with urlopen(url, timeout=180, context=ctx) as r:
    open(".audit_historico/Elecciones-Congreso.xlsx","wb").write(r.read())
PY
          fi
      - name: Staging histórico oficial (si está disponible)
        if: steps.official.outcome == 'success'
        run: |
          set -o pipefail
          echo "SOURCE_TIER=PRIMARY_INTERIOR_RAW_ONLY" | tee .audit_historico/source_tier.txt
          python scripts/stage_historico_interior.py 2>&1 | tee .audit_historico/staging.log
          echo "PRIMARY_SOURCE_STAGED_SECONDARY_BACKTEST_FOLLOWS" | tee .audit_historico/validation_status.txt
      - name: Staging histórico secundario para backtest OOS
        run: |
          set -o pipefail
          if test "${{ steps.official.outcome }}" != "success"; then
            echo "SOURCE_TIER=SECONDARY_REPLICA" | tee .audit_historico/source_tier.txt
          else
            echo "PRIMARY_PLUS_SECONDARY_BACKTEST" | tee .audit_historico/source_tier.txt
          fi
          python scripts/stage_historico_secondary.py 2>&1 | tee -a .audit_historico/staging.log
          python scripts/validate_historical_secondary.py
          python scripts/backtest_2023_baseline.py 2>&1 | tee .audit_historico/backtest.log
      - name: Publicar diagnóstico del staging
        if: always()
        run: |
          mkdir -p ci_evidence
          cp .audit_historico/staging.log ci_evidence/historico_staging_run.log 2>/dev/null || true
          cp .audit_historico/source_tier.txt ci_evidence/historico_source_tier.txt 2>/dev/null || true
          cp .audit_historico/validation.json ci_evidence/historico_validation.json 2>/dev/null || true
          cp .audit_historico/secondary_manifest.json ci_evidence/historico_manifest.json 2>/dev/null || true
          cp .audit_historico/backtest_2023_baseline.json ci_evidence/backtest_2023_baseline.json 2>/dev/null || true
          cp .audit_historico/backtest.log ci_evidence/backtest_2023_baseline.log 2>/dev/null || true
          cp .audit_historico/validation_status.txt ci_evidence/historico_validation_status.txt 2>/dev/null || true
      - name: Publicar dataset fuente y metadatos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seec-historico-interior-staging
          path: .audit_historico/
