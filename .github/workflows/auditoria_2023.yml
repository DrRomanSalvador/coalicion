name: Auditoria 2023 y suite SEEC

on:
  push:
    paths:
      - ".github/workflows/auditoria_2023.yml"
      - "src/**"
      - "tests/**"
      - "scripts/audit_2023.py"
      - "scripts/stage_historico_secondary.py"
      - "scripts/validate_historical_secondary.py"
      - "scripts/backtest_2023_baseline.py"
  pull_request:
    paths:
      - ".github/workflows/auditoria_2023.yml"
      - "src/**"
      - "tests/**"
      - "scripts/**"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python -m pip install --upgrade pip pytest pandas openpyxl
      - name: Ejecutar suite completa
        run: python -m pytest -q

  audit-2023:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python -m pip install --upgrade pip pandas openpyxl
      - name: Descargar fuente oficial Interior
        continue-on-error: true
        id: official
        run: |
          mkdir -p .audit_2023
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 180 "https://descargas.interior.gob.es/datasets/resultados_electorales/Elecciones-Congreso.xlsx" -o .audit_2023/Elecciones-Congreso.xlsx
          sha256sum .audit_2023/Elecciones-Congreso.xlsx | tee .audit_2023/source.sha256
      - name: Ejecutar auditoría 2023
        if: steps.official.outcome == 'success'
        run: python scripts/audit_2023.py
      - name: Publicar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-2023
          path: .audit_2023/

  historico-interior:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python -m pip install --upgrade pip pandas openpyxl pyreadr
      - name: Intentar fuente primaria Interior
        id: official
        continue-on-error: true
        run: |
          mkdir -p .audit_historico
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 20 --max-time 180 "https://descargas.interior.gob.es/datasets/resultados_electorales/Elecciones-Congreso.xlsx" -o .audit_historico/Elecciones-Congreso.xlsx
      - name: Staging histórico seleccionado
        run: |
          set -o pipefail
          if test -s .audit_historico/Elecciones-Congreso.xlsx; then
            echo "SOURCE_TIER=PRIMARY_INTERIOR" | tee .audit_historico/source_tier.txt
            python scripts/stage_historico_interior.py 2>&1 | tee .audit_historico/staging.log
          else
            echo "SOURCE_TIER=SECONDARY_REPLICA" | tee .audit_historico/source_tier.txt
            python scripts/stage_historico_secondary.py 2>&1 | tee .audit_historico/staging.log
          fi
      - name: Validar histórico provincial
        if: success()
        run: python scripts/validate_historical_secondary.py
      - name: Ejecutar backtesting 2023 baseline
        if: success()
        run: |
          set -o pipefail
          python scripts/backtest_2023_baseline.py 2>&1 | tee .audit_historico/backtest.log
      - name: Publicar diagnóstico del staging
        if: always()
        run: |
          mkdir -p ci_evidence
          cp .audit_historico/staging.log ci_evidence/historico_staging_run.log 2>/dev/null || true
          cp .audit_historico/source_tier.txt ci_evidence/historico_source_tier.txt 2>/dev/null || true
          cp .audit_historico/validation.json ci_evidence/historico_validation.json 2>/dev/null || true
          cp .audit_historico/secondary_manifest.json ci_evidence/historico_manifest.json 2>/dev/null || true
          cp .audit_historico/backtest_2023_baseline.json ci_evidence/backtest_2023_baseline.json 2>/dev/null || true
          cp .audit_historico/backtest.log ci_evidence/backtest_2023_baseline.log 2>/dev/null || true
          git config user.name "SEEC CI"
          git config user.email "seec-ci@users.noreply.github.com"
          git add ci_evidence/
          git diff --cached --quiet || git commit -m "Record historical staging CI evidence"
          git push origin HEAD:main || true
      - name: Publicar dataset fuente y metadatos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seec-historico-interior-staging
          path: .audit_historico/
