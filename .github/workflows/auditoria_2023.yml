name: Auditoria 2023 y suite SEEC

on:
  push:
    paths:
      - ".github/workflows/auditoria_2023.yml"
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "run26.py"
      - "requirements.txt"
  pull_request:
    paths:
      - ".github/workflows/auditoria_2023.yml"
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "run26.py"
      - "requirements.txt"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pandas pyreadr
      - name: Verificar contrato de reproducibilidad
        id: contract
        continue-on-error: true
        run: python -m src.reproducibility_contract
      - name: Ejecutar suite completa
        run: python -m pytest -q
      - name: Registrar estado de certificación
        if: always()
        run: |
          python scripts/master_certification.py || true
          if test "${{ steps.contract.outcome }}" = "failure"; then
            echo "Contrato primario pendiente: la ausencia del binario Interior mantiene la certificación estricta bloqueada."
          fi
      - name: Verificación de estado operativo
        run: python -m scripts.product_status

  product-reproducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pandas pyreadr
      - name: Ejecutar pipeline de producto
        env:
          USE_CERTIFI: "true"
        run: python run26.py
      - name: Publicar artefactos de verificación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-2023-producto
          path: |
            artifacts/
            ci_evidence/
            reports/
            data/encuestas_historicas_2004_2023.csv
