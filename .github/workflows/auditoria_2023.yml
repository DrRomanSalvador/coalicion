name: Auditoria 2023 y suite SEEC

on:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: auditoria-2023-main
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verificar contrato de reproducibilidad
        run: python -m src.reproducibility_contract

      - name: Ejecutar tests
        run: python -m pytest -q

      - name: Preparar CA verificada
        run: python -m pip install --upgrade certifi

      - name: Descargar fuente oficial Interior
        run: |
          set -euo pipefail
          CA_BUNDLE="$(python -c 'import certifi; print(certifi.where())')"
          export CURL_CA_BUNDLE="$CA_BUNDLE"
          URL="https://descargas.interior.gob.es/datasets/resultados_electorales/Elecciones-Congreso.xlsx"
          OUT=".audit_2023/Elecciones-Congreso.xlsx"
          mkdir -p .audit_2023
          ok=false
          for attempt in 1 2 3; do
            if curl --fail --location --retry 2 --retry-all-errors --connect-timeout 20 --max-time 180 \
              --cacert "$CA_BUNDLE" "$URL" -o "$OUT"; then
              ok=true
              break
            fi
            rm -f "$OUT"
            sleep $((attempt * 5))
          done
          if [ "$ok" != true ]; then
            # The official endpoint currently presents an incomplete TLS chain
            # on GitHub-hosted runners. Keep the official URL and fail closed
            # on content validation; only transport verification is relaxed.
            curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 180               --insecure -A "Mozilla/5.0-coalicion-audit/2.0" "$URL" -o "$OUT"
          fi
          test -s "$OUT"
          sha256sum "$OUT" | tee .audit_2023/source.sha256

      - name: Materializar y reconciliar la fuente primaria descargada
        run: python scripts/materialize_official_interior_dataset.py --input .audit_2023/Elecciones-Congreso.xlsx

      - name: Ejecutar auditoría canónica 2023
        run: python scripts/audit_2023.py

      - name: Staging histórico Interior
        run: |
          set -euo pipefail
          mkdir -p .audit_historico
          cp .audit_2023/Elecciones-Congreso.xlsx .audit_historico/Elecciones-Congreso.xlsx
          python scripts/stage_historico_interior.py 2>&1 | tee .audit_historico/staging.log
          echo "PRIMARY_SOURCE_PRESENT_SECONDARY_VALIDATION_SKIPPED" | tee .audit_historico/validation_status.txt

      - name: Publicar evidencia de auditoría
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-2023
          path: |
            .audit_2023/
            .audit_historico/
          if-no-files-found: ignore
