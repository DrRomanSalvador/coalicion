name: Auditoria 2023 y suite SEEC

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/auditoria_2023.yml"
      - "src/**"
      - "tests/**"
      - "scripts/**"
  pull_request:
    paths:
      - ".github/workflows/auditoria_2023.yml"
      - "src/**"
      - "tests/**"
      - "scripts/**"

permissions:
  contents: read

concurrency:
  group: auditoria-2023-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verificar contrato de reproducibilidad
        run: python -m src.reproducibility_contract

      - name: Ejecutar tests
        run: python -m pytest -q

      - name: Preparar CA verificada
        run: python -m pip install --upgrade certifi

      - name: Descargar fuente oficial Interior
        run: |
          set -euo pipefail
          export CURL_CA_BUNDLE="$(python -c \"import certifi; print(certifi.where())\")"
          mkdir -p .audit_2023
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 20 --max-time 180 \
            "https://descargas.interior.gob.es/datasets/resultados_electorales/Elecciones-Congreso.xlsx" \
            -o .audit_2023/Elecciones-Congreso.xlsx
          test -s .audit_2023/Elecciones-Congreso.xlsx
          sha256sum .audit_2023/Elecciones-Congreso.xlsx | tee .audit_2023/source.sha256

      - name: Ejecutar auditoría 2023
        run: python scripts/audit_2023.py

      - name: Staging histórico Interior
        run: |
          set -euo pipefail
          mkdir -p .audit_historico
          cp .audit_2023/Elecciones-Congreso.xlsx .audit_historico/Elecciones-Congreso.xlsx
          python scripts/stage_historico_interior.py 2>&1 | tee .audit_historico/staging.log
          echo "PRIMARY_SOURCE_PRESENT_SECONDARY_VALIDATION_SKIPPED" | tee .audit_historico/validation_status.txt

      - name: Publicar evidencia de auditoría
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-2023
          path: |
            .audit_2023/
            .audit_historico/
          if-no-files-found: ignore
