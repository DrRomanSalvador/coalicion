name: SEEC production real
on:
  push:
    branches: [main]
    paths:
      - "scripts/run_seec_production.py"
      - "src/seec_bayesian.py"
      - "src/reproducibility_contract.py"
      - "artifacts/data/cis_historical_2004_2023.csv"
      - "artifacts/data/cis_recent_2024_2026.csv"
      - "requirements.txt"
      - ".github/workflows/seec-production-real.yml"
  pull_request_target:
    branches: [main]
    paths:
      - "scripts/run_seec_production.py"
      - "src/seec_bayesian.py"
      - "src/reproducibility_contract.py"
      - "artifacts/data/cis_historical_2004_2023.csv"
      - "artifacts/data/cis_recent_2024_2026.csv"
      - "requirements.txt"
      - ".github/workflows/seec-production-real.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: seec-posterior-persistence-${{ github.ref }}
  cancel-in-progress: false
jobs:
  seec:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install SEEC dependencies
        run: |
          set -o pipefail
          python -m pip install --disable-pip-version-check --no-input "pymc==6.3.2" "arviz>=1.1.0,<2.0" 2>&1 | tee /tmp/seec_pip_install.log
      - name: Resolve canonical seed
        run: echo "COALICION_SEED=$(python -c 'from src.reproducibility_contract import ExecutionContract; print(ExecutionContract.seed)')" >> "$GITHUB_ENV"
      - name: Run real SEEC posterior
        run: |
          set -o pipefail
          python scripts/run_seec_production.py --input artifacts/data/cis_historical_2004_2023.csv --draws 2500 --tune 3000 --chains 4 --seed "$COALICION_SEED" 2>&1 | tee /tmp/seec_run.log
      - name: Verify production gate
        run: |
          python - <<'PY'
          import json, math
          x=json.load(open("ci_evidence/seec_production.json"))
          assert x["status"]=="PASS"
          assert x["seed"]==int(__import__("os").environ["COALICION_SEED"])==x["canonical_seed"]
          assert x["chains"]==4
          assert x["total_draws"]>=10000
          assert x["diagnostics"]["divergences"]==0
          assert math.isfinite(x["diagnostics"]["max_r_hat"]) and x["diagnostics"]["max_r_hat"]<=1.01
          print("SEEC PRODUCTION PASS",x["total_draws"],x["diagnostics"])
          PY
      - name: Stage diagnostics for safe artifact persistence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci_evidence/diagnostics
          if [[ -f /tmp/seec_pip_install.log ]]; then cp /tmp/seec_pip_install.log ci_evidence/diagnostics/seec_pip_install.log; fi
          if [[ -f /tmp/seec_run.log ]]; then cp /tmp/seec_run.log ci_evidence/diagnostics/seec_run.log; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seec-production-diagnostics
          path: ci_evidence/diagnostics/**
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: seec-production-evidence
          path: ci_evidence/seec_production.json

# deterministic production gate

  persist_evidence:
    name: Persist SEEC evidence on trusted main push
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: seec
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Download SEEC diagnostics
        uses: actions/download-artifact@v4
        with:
          name: seec-production-diagnostics
          path: /tmp/seec-diagnostics
          if-no-artifact-found: ignore
      - name: Download successful SEEC evidence
        if: needs.seec.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: seec-production-evidence
          path: /tmp/seec-evidence
      - name: Persist successful SEEC posterior evidence
        if: needs.seec.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os, pathlib, urllib.request
          candidates=list(pathlib.Path("/tmp/seec-evidence").rglob("seec_production.json"))
          if not candidates:
              raise SystemExit("Successful SEEC run produced no downloadable posterior evidence")
          body=candidates[0].read_bytes()
          api=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/contents/ci_evidence/seec_production.json"
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","Content-Type":"application/json","X-GitHub-Api-Version":"2022-11-28"}
          req=urllib.request.Request(api,headers=headers)
          try:
              with urllib.request.urlopen(req) as resp: current=json.load(resp)
              sha=current["sha"]
          except Exception:
              sha=None
          payload={"message":"ci: materialize genuine SEEC production evidence","content":base64.b64encode(body).decode(),"branch":"main"}
          if sha: payload["sha"]=sha
          req=urllib.request.Request(api,data=json.dumps(payload).encode(),method="PUT",headers=headers)
          with urllib.request.urlopen(req) as resp: print(resp.read().decode())
          PY
      - name: Persist failed SEEC diagnostics
        if: needs.seec.result != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os, pathlib, urllib.request
          root=pathlib.Path("/tmp/seec-diagnostics")
          logs=sorted(root.rglob("*.log")) if root.exists() else []
          detail="\n\n".join(f"--- {p.name} ---\n"+p.read_text(errors="replace") for p in logs)
          body=f"SEEC_PRODUCTION_FAILURE\nsha: {os.environ['GITHUB_SHA']}\nrun: {os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}\n\n"+(detail or "No diagnostic logs were produced.")
          api=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/contents/ci_evidence/seec_production_failure.txt"
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","Content-Type":"application/json","X-GitHub-Api-Version":"2022-11-28"}
          req=urllib.request.Request(api,headers=headers)
          try:
              with urllib.request.urlopen(req) as resp: current=json.load(resp)
              sha=current["sha"]
          except Exception:
              sha=None
          payload={"message":"ci: materialize SEEC production failure diagnostics","content":base64.b64encode(body.encode()).decode(),"branch":"main"}
          if sha: payload["sha"]=sha
          req=urllib.request.Request(api,data=json.dumps(payload).encode(),method="PUT",headers=headers)
          with urllib.request.urlopen(req) as resp: print(resp.read().decode())
          PY
