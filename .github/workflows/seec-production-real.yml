name: SEEC production real
on:
  push:
    branches: [main]
    paths:
      - "scripts/run_seec_production.py"
      - "src/seec_bayesian.py"
      - "src/reproducibility_contract.py"
      - "artifacts/data/cis_historical_2004_2023.csv"
      - "artifacts/data/cis_recent_2024_2026.csv"
      - "requirements.txt"
      - ".github/workflows/seec-production-real.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/run_seec_production.py"
      - "src/seec_bayesian.py"
      - "src/reproducibility_contract.py"
      - "artifacts/data/cis_historical_2004_2023.csv"
      - "artifacts/data/cis_recent_2024_2026.csv"
      - "requirements.txt"
      - ".github/workflows/seec-production-real.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: seec-production-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  seec:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install SEEC dependencies
        run: |
          set -o pipefail
          python -m pip install --disable-pip-version-check --no-input "pymc==6.3.2" "arviz>=1.1.0,<2.0" 2>&1 | tee /tmp/seec_pip_install.log
      - name: Resolve canonical seed
        run: echo "COALICION_SEED=$(python -c 'from src.reproducibility_contract import ExecutionContract; print(ExecutionContract.seed)')" >> "$GITHUB_ENV"
      - name: Run real SEEC posterior
        run: |
          set -o pipefail
          python scripts/run_seec_production.py --input artifacts/data/cis_historical_2004_2023.csv --draws 2500 --tune 3000 --chains 4 --seed "$COALICION_SEED" 2>&1 | tee /tmp/seec_run.log
      - name: Verify production gate
        run: |
          python - <<'PY'
          import json, math
          x=json.load(open("ci_evidence/seec_production.json"))
          assert x["status"]=="PASS"
          assert x["seed"]==int(__import__("os").environ["COALICION_SEED"])==x["canonical_seed"]
          assert x["chains"]==4
          assert x["total_draws"]>=10000
          assert x["diagnostics"]["divergences"]==0
          assert math.isfinite(x["diagnostics"]["max_r_hat"]) and x["diagnostics"]["max_r_hat"]<=1.01
          print("SEEC PRODUCTION PASS",x["total_draws"],x["diagnostics"])
          PY
      - name: Stage diagnostics for safe artifact persistence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci_evidence/diagnostics
          if [[ -f /tmp/seec_pip_install.log ]]; then cp /tmp/seec_pip_install.log ci_evidence/diagnostics/seec_pip_install.log; fi
          if [[ -f /tmp/seec_run.log ]]; then cp /tmp/seec_run.log ci_evidence/diagnostics/seec_run.log; fi

      - name: Materialize failed-run evidence
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci_evidence/diagnostics
          {
            echo "SEEC_PRODUCTION_FAILURE"
            echo "tested_sha: $TESTED_SHA"
            echo "run: $RUN_URL"
            echo "python: $(python --version 2>&1)"
          } > ci_evidence/diagnostics/seec_production_failure.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seec-production-diagnostics
          path: ci_evidence/diagnostics/**
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: seec-production-evidence
          path: ci_evidence/seec_production.json

# deterministic production gate
