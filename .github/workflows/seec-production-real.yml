name: SEEC production real
on:
  push:
    branches: [main]
    paths:
      - "scripts/run_seec_production.py"
      - "src/seec_bayesian.py"
      - "artifacts/data/cis_historical_2004_2023.csv"
      - "requirements.txt"
      - ".github/workflows/seec-production-real.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  seec:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install SEEC dependencies
        run: |
          set -o pipefail
          python -m pip install --disable-pip-version-check --no-input "pymc==6.3.2" "arviz>=1.1.0,<2.0" 2>&1 | tee /tmp/seec_pip_install.log
      - name: Materialize installation failure evidence
        if: failure()
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p ci_evidence
          {
            echo "SEEC_INSTALL_FAILURE"
            echo "sha: $GITHUB_SHA"
            echo "python:"
            python --version
            echo "pip:"
            python -m pip --version
            echo "log:"
            cat /tmp/seec_pip_install.log
          } > ci_evidence/seec_install_failure.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci_evidence/seec_install_failure.txt
          git diff --cached --quiet && exit 0
          git commit -m "ci: materialize SEEC installation failure evidence"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep 5
          done
          exit 1
      - name: Run real SEEC posterior
        run: |
          set -o pipefail
          python scripts/run_seec_production.py --draws 2500 --tune 1000 --seed 20261008 2>&1 | tee /tmp/seec_run.log
      - name: Materialize SEEC execution failure evidence
        if: failure()
        run: |
          set -euo pipefail
          mkdir -p ci_evidence
          {
            echo "SEEC_EXECUTION_FAILURE"
            echo "sha: $GITHUB_SHA"
            cat /tmp/seec_run.log
          } > ci_evidence/seec_execution_failure.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci_evidence/seec_execution_failure.txt
          git diff --cached --quiet && exit 0
          git commit -m "ci: materialize SEEC execution failure evidence"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep 5
          done
          exit 1
      - name: Verify production gate
        run: |
          python - <<'PY'
          import json, math
          x=json.load(open("ci_evidence/seec_production.json"))
          assert x["status"]=="PASS"
          assert x["chains"]==4
          assert x["total_draws"]>=10000
          assert x["diagnostics"]["divergences"]==0
          assert math.isfinite(x["diagnostics"]["max_r_hat"]) and x["diagnostics"]["max_r_hat"]<=1.01
          print("SEEC PRODUCTION PASS",x["total_draws"],x["diagnostics"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seec-production-diagnostics
          path: |
            ci_evidence/seec_install_failure.txt
            ci_evidence/seec_execution_failure.txt
            /tmp/seec_pip_install.log
            /tmp/seec_run.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: seec-production-evidence
          path: ci_evidence/seec_production.json

# deterministic production gate
