name: SEEC production real
on:
  push:
    branches: [main]
    paths:
      - "scripts/run_seec_production.py"
      - "src/seec_bayesian.py"
      - "src/reproducibility_contract.py"
      - "artifacts/data/cis_historical_2004_2023.csv"
      - "artifacts/data/cis_recent_2024_2026.csv"
      - "requirements.txt"
      - ".github/workflows/seec-production-real.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/run_seec_production.py"
      - "src/seec_bayesian.py"
      - "src/reproducibility_contract.py"
      - "artifacts/data/cis_historical_2004_2023.csv"
      - "artifacts/data/cis_recent_2024_2026.csv"
      - "requirements.txt"
      - ".github/workflows/seec-production-real.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  seec:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install SEEC dependencies
        run: |
          set -o pipefail
          python -m pip install --disable-pip-version-check --no-input "pymc==6.3.2" "arviz>=1.1.0,<2.0" 2>&1 | tee /tmp/seec_pip_install.log
      - name: Materialize installation failure evidence
        if: failure() && github.event_name == 'push'
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p ci_evidence
          {
            echo "SEEC_INSTALL_FAILURE"
            echo "sha: $GITHUB_SHA"
            echo "python:"
            python --version
            echo "pip:"
            python -m pip --version
            echo "log:"
            cat /tmp/seec_pip_install.log
          } > ci_evidence/seec_install_failure.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci_evidence/seec_install_failure.txt
          git diff --cached --quiet && exit 0
          git commit -m "ci: materialize SEEC installation failure evidence"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep $((attempt * 5))
          done
          exit 1
      - name: Resolve canonical seed
        run: echo "COALICION_SEED=$(python -c 'from src.reproducibility_contract import ExecutionContract; print(ExecutionContract.seed)')" >> "$GITHUB_ENV"
      - name: Run real SEEC posterior
        run: |
          set -o pipefail
          python scripts/run_seec_production.py --input artifacts/data/cis_historical_2004_2023.csv --draws 2500 --tune 3000 --chains 4 --seed "$COALICION_SEED" 2>&1 | tee /tmp/seec_run.log
      - name: Materialize SEEC execution failure evidence
        if: failure() && github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, json, os, pathlib, urllib.request
          p=pathlib.Path("/tmp/seec_run.log")
          body="SEEC_EXECUTION_FAILURE\nsha: "+os.environ["GITHUB_SHA"]+"\n"+(p.read_text(errors="replace") if p.exists() else "NO_RUN_LOG")
          api=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/contents/ci_evidence/seec_execution_failure.txt"
          req=urllib.request.Request(api,headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"})
          try:
              with urllib.request.urlopen(req) as resp: current=json.load(resp)
              sha=current["sha"]
          except Exception:
              sha=None
          payload={"message":"ci: materialize SEEC execution failure evidence","content":base64.b64encode(body.encode()).decode()}
          if sha: payload["sha"]=sha
          req=urllib.request.Request(api,data=json.dumps(payload).encode(),method="PUT",headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","Content-Type":"application/json","X-GitHub-Api-Version":"2022-11-28"})
          with urllib.request.urlopen(req) as resp: print(resp.read().decode())
          PY
      - name: Verify production gate
        run: |
          python - <<'PY'
          import json, math
          x=json.load(open("ci_evidence/seec_production.json"))
          assert x["status"]=="PASS"
          assert x["seed"]==int(__import__("os").environ["COALICION_SEED"])==x["canonical_seed"]
          assert x["chains"]==4
          assert x["total_draws"]>=10000
          assert x["diagnostics"]["divergences"]==0
          assert math.isfinite(x["diagnostics"]["max_r_hat"]) and x["diagnostics"]["max_r_hat"]<=1.01
          print("SEEC PRODUCTION PASS",x["total_draws"],x["diagnostics"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seec-production-diagnostics
          path: |
            ci_evidence/seec_install_failure.txt
            ci_evidence/seec_execution_failure.txt
            /tmp/seec_pip_install.log
            /tmp/seec_run.log
          if-no-files-found: ignore
      - name: Materialize genuine SEEC evidence in main
        if: success() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, json, os, pathlib, urllib.request
          path=pathlib.Path("ci_evidence/seec_production.json")
          body=path.read_bytes()
          api=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/contents/ci_evidence/seec_production.json"
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","Content-Type":"application/json","X-GitHub-Api-Version":"2022-11-28"}
          req=urllib.request.Request(api,headers=headers)
          try:
              with urllib.request.urlopen(req) as resp: current=json.load(resp)
              sha=current["sha"]
          except Exception:
              sha=None
          payload={"message":"ci: materialize genuine SEEC production evidence","content":base64.b64encode(body).decode()}
          if sha: payload["sha"]=sha
          req=urllib.request.Request(api,data=json.dumps(payload).encode(),method="PUT",headers=headers)
          with urllib.request.urlopen(req) as resp: print(resp.read().decode())
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: seec-production-evidence
          path: ci_evidence/seec_production.json

# deterministic production gate
