name: Historical data — canonical integration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/historical-data-integration.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: historical-data-canonical-${{ github.ref }}-v2
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Runner smoke test
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Assert runner
        run: |
          set -euxo pipefail
          python --version
          uname -a
