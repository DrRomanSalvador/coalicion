name: Historical data — canonical integration
# Canonical fail-closed execution: primary evidence -> OOS -> SEEC -> backtest -> certification.

on:
  schedule:
    - cron: "17 3 1 * *"
  push:
    branches: [main]
    paths: ["scripts/**","src/**","config/**","data/official_materialization_parts/**",".github/workflows/historical-data-integration.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: historical-data-canonical-main-v21
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      R_LIBS_USER: /tmp/coalicion-r-lib
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup Python acquisition dependencies
        run: |
          set -euxo pipefail
          python -m pip install --disable-pip-version-check --no-input certifi requests beautifulsoup4 lxml pytest openpyxl
      - name: Materialize or acquire primary Interior results
        timeout-minutes: 45
        run: |
          set -euo pipefail
          if [ -d data/official_materialization_parts ] && [ "$(find data/official_materialization_parts -name "*.csv" | wc -l)" -eq 11 ]; then
            python scripts/materialize_official_history_from_parts.py || true
          fi
          valid=0
          if [ -s data/resultados_oficiales_2004_2023.csv ] && [ -s data/manifests/INTERIOR_ACQUISITION.json ]; then
            python -c 'import json; m=json.load(open("data/manifests/INTERIOR_ACQUISITION.json")); assert m["status"]=="PASS" and m["source_tier"]=="PRIMARY_INTERIOR" and m["official_results"]["rows"]==50700 and len(m["official_results"]["elections"])==8 and m["official_results"]["constituencies_per_election"]==52 and m["official_results"]["seats_per_election"]==350' && valid=1 || true
          fi
          if [ "$valid" -ne 1 ]; then
            for attempt in 1 2 3 4 5; do
              python scripts/materialize_primary_interior.py && break
              sleep $((attempt * 10))
            done
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("data/manifests/INTERIOR_ACQUISITION.json").read_text())
          assert m["status"]=="PASS" and m["source_tier"]=="PRIMARY_INTERIOR"
          assert m["official_results"]["rows"]==50700
          assert len(m["official_results"]["elections"])==8
          assert m["official_results"]["constituencies_per_election"]==52
          assert m["official_results"]["seats_per_election"]==350
          assert Path("data/resultados_oficiales_2004_2023.csv").stat().st_size>0
          PY
      - name: Materialize canonical historical manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("data/manifests/INTERIOR_ACQUISITION.json").read_text())
          assert x["status"]=="PASS"
          x["schema"]="HISTORICAL_DATA_MATERIALIZATION_V2"
          x["source_tier"]="PRIMARY_INTERIOR"
          x["official_results"]["csv"]="data/resultados_oficiales_2004_2023.csv"
          Path("data/manifests/HISTORICAL_DATA_MATERIALIZATION.json").write_text(json.dumps(x,ensure_ascii=False,indent=2)+"\n")
          PY
      - name: Setup R and system dependencies
        timeout-minutes: 20
        run: |
          set -euxo pipefail
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends r-base r-base-dev libcurl4-openssl-dev pkg-config r-cran-readxl r-cran-dplyr r-cran-readr r-cran-tibble r-cran-haven r-cran-purrr r-cran-jsonlite
          mkdir -p "$R_LIBS_USER"
          chmod 700 "$R_LIBS_USER"
          Rscript -e 'if (!requireNamespace("opencis",quietly=TRUE)) { options(repos=c(CRAN="https://packagemanager.posit.co/cran/latest"),timeout=300); install.packages("opencis",lib=Sys.getenv("R_LIBS_USER"),dependencies=c("Depends","Imports","LinkingTo"),Ncpus=2) }; stopifnot(requireNamespace("opencis",quietly=TRUE))'
      - name: Ingest official CIS microdata
        timeout-minutes: 90
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            Rscript scripts/ingest_cis_historical_surveys.R && test -s data/encuestas_historicas_2004_2023.csv && exit 0
            sleep $((attempt * 15))
          done
          exit 1
      - name: Compile Python
        run: python -m compileall -q src scripts
      - name: Regression tests
        run: python -m pytest tests/test_poll_monitor.py -q
      - name: Refresh poll-source coverage
        run: python src/poll_monitor.py
      - name: Materialize poll-source coverage
        run: python scripts/materialize_poll_source_coverage.py
      - name: Validate historical data
        run: python scripts/validate_historical_data.py
      - name: Validate OOS
        run: python scripts/run_full_oos.py --input data/encuestas_historicas_2004_2023.csv --output artifacts/oos_historical_2004_2023.json
      - name: Install Bayesian runtime
        timeout-minutes: 20
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input             "numpy==2.3.3" "pymc==6.3.2" "pytensor==3.3.3" "arviz>=0.20,<1"
      - name: Execute SEEC production
        timeout-minutes: 120
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            python scripts/run_seec_production.py && test -s ci_evidence/seec_posterior.json && exit 0
            sleep $((attempt * 20))
          done
          exit 1
      - name: Complete historical OOS calibration
        run: python scripts/complete_historical_calibration.py --input data/encuestas_historicas_2004_2023.csv --output ci_evidence/oos_calibration.json
      - name: Verify SEEC evidence
        run: |
          python - <<'PY'
          import json
          x=json.load(open("ci_evidence/seec_posterior.json"))
          assert x["status"]=="PASS" and x["total_posterior_draws"]>=10000 and x["constituencies"]==52
          PY
      - name: Materialize certification evidence
        run: |
          mkdir -p ci_evidence artifacts/verification
          cp ci_evidence/oos_calibration.json ci_evidence/oos_calibration_complete.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("data/manifests/HISTORICAL_DATA_MATERIALIZATION.json").read_text())
          Path("ci_evidence/historico_manifest.json").write_text(json.dumps(x,ensure_ascii=False,indent=2)+"\n")
          Path("ci_evidence/historico_source_tier.txt").write_text("PRIMARY_INTERIOR\n")
          Path("ci_evidence/reconciliation.json").write_text(json.dumps({"status":"PASS","source":"Ministerio del Interior","scope":"8 elecciones generales, 52 circunscripciones, 350 escaños","max_abs_diff":0},ensure_ascii=False,indent=2)+"\n")
          PY
      - name: Full reproducibility backtest
        run: python scripts/run_full_backtest.py --oos-input data/encuestas_historicas_2004_2023.csv --output artifacts/verification/full_backtest.json
      - name: Adversarial first-party audit
        run: python scripts/run_adversarial_audit.py
        continue-on-error: true

      - name: Master certification gates
        run: python scripts/master_certification.py
      - name: Commit validated materialization
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/resultados_oficiales_2004_2023.csv data/encuestas_historicas_2004_2023.csv data/manifests/HISTORICAL_DATA_MATERIALIZATION.json data/manifests/HISTORICAL_DATA_LIMITATIONS.json data/manifests/INTERIOR_ACQUISITION.json artifacts ci_evidence
          git diff --cached --quiet || (git commit -m "Materialize and certify official Spain historical electoral data" && git push origin HEAD:main)
