name: Historical data — canonical integration
# Canonical acquisition runner: v7 verified HTTPS fallback.
# Certification execution trigger: historical OOS + SEEC + master gates.
# Final trigger after deterministic materialization fixes.
# v13: explicit certification execution on main after primary-source validation.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "scripts/ingest_official_electoral_history.R"
      - "scripts/ingest_cis_historical_surveys.R"
      - "scripts/validate_historical_data.py"
      - "scripts/run_full_oos.py"
      - "src/oos_pipeline.py"
      - "config/electoral_sources.json"
      - ".github/workflows/historical-data-integration.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: historical-data-canonical-main-v13
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      R_LIBS_USER: /tmp/coalicion-r-lib

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup acquisition CA bundle
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --disable-pip-version-check --no-input certifi requests beautifulsoup4 lxml pytest
          python -c 'import certifi; print(certifi.where())'

      - name: Setup R
        shell: bash
        run: |
          set -euxo pipefail
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends r-base r-base-dev libcurl4-openssl-dev pkg-config
          R --version

      - name: Validate or acquire official Interior results
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          if [ -d data/official_materialization_parts ] && [ "$(find data/official_materialization_parts -name "*.csv" | wc -l)" -eq 11 ]; then
            if ! python scripts/materialize_official_history_from_parts.py; then
              echo "Materialization parts incomplete/incompatible; falling back to primary Interior acquisition."
            fi
          fi
          if [ -s data/resultados_oficiales_2004_2023.csv ] && [ -s data/manifests/INTERIOR_ACQUISITION.json ] && python -c 'import json; m=json.load(open("data/manifests/INTERIOR_ACQUISITION.json", encoding="utf-8")); assert m["status"]=="PASS" and m["source_tier"]=="PRIMARY_INTERIOR" and m["official_results"]["rows"]==50700 and len(m["official_results"]["elections"])==8 and m["official_results"]["constituencies_per_election"]==52 and m["official_results"]["seats_per_election"]==350'; then
            echo "Using already validated primary Interior materialization."
          else
            export CURL_CA_BUNDLE="$(python -c 'import certifi; print(certifi.where())')"
            for attempt in 1 2 3 4 5; do
              echo "Interior acquisition attempt $attempt/5"
              if Rscript scripts/ingest_official_electoral_history.R; then
                test -s data/raw/Elecciones-Congreso.xlsx
                test -s data/manifests/INTERIOR_ACQUISITION.json
                exit 0
              fi
              echo "Transient acquisition failure; waiting before retry."
              sleep $((attempt * 10))
            done
            echo "FAIL-CLOSED: Interior acquisition did not converge after deterministic retries."
            exit 1
          fi

      - name: Materialize canonical historical manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          src=Path("data/manifests/INTERIOR_ACQUISITION.json")
          dst=Path("data/manifests/HISTORICAL_DATA_MATERIALIZATION.json")
          x=json.loads(src.read_text(encoding="utf-8"))
          x["schema"]="HISTORICAL_DATA_MATERIALIZATION_V2"
          x["status"]="PASS"
          x["source_tier"]="PRIMARY_INTERIOR"
          x["official_results"]["csv"]="data/resultados_oficiales_2004_2023.csv"
          dst.write_text(json.dumps(x,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY

      - name: Install R dependencies
        timeout-minutes: 15
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$R_LIBS_USER"
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libcurl4-openssl-dev pkg-config r-cran-readxl r-cran-dplyr r-cran-readr r-cran-tibble r-cran-haven r-cran-purrr r-cran-jsonlite
          Rscript -e 'options(repos=c(CRAN="https://packagemanager.posit.co/cran/latest"), timeout=300); install.packages("opencis", lib=Sys.getenv("R_LIBS_USER"), dependencies=c("Depends","Imports","LinkingTo"), Ncpus=2)'
          Rscript -e 'lib <- Sys.getenv("R_LIBS_USER"); .libPaths(unique(c(lib, .libPaths()))); pkgs <- c("opencis","readxl","dplyr","readr","tibble","haven","purrr","jsonlite"); ok <- vapply(pkgs, requireNamespace, logical(1), quietly=TRUE); print(data.frame(package=names(ok),available=unname(ok))); stopifnot(all(ok))'

      - name: Ingest official CIS microdata
        timeout-minutes: 90
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            echo "CIS acquisition attempt $attempt/5"
            if Rscript scripts/ingest_cis_historical_surveys.R; then
              test -s data/encuestas_historicas_2004_2023.csv
              exit 0
            fi
            echo "Transient CIS acquisition failure; waiting before retry."
            sleep $((attempt * 15))
          done
          echo "FAIL-CLOSED: CIS acquisition did not converge after deterministic retries."
          exit 1

      - name: Compile Python
        run: python -m compileall -q src scripts

      - name: Regression tests
        run: python -m pytest tests/test_poll_monitor.py -q

      - name: Refresh poll-source coverage evidence
        run: python src/poll_monitor.py

      - name: Materialize poll-source coverage
        run: python scripts/materialize_poll_source_coverage.py

      - name: Validate historical data
        run: python scripts/validate_historical_data.py

      - name: Validate OOS
        run: python scripts/run_full_oos.py --input data/encuestas_historicas_2004_2023.csv --output artifacts/oos_historical_2004_2023.json

      - name: Install Bayesian runtime
        timeout-minutes: 20
        run: |
          python -m pip install --disable-pip-version-check --no-input "pymc>=5,<6" "numpy>=1.26,<3" "pytensor>=2.20,<3"

      - name: Execute SEEC production
        timeout-minutes: 120
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "SEEC execution attempt $attempt/3"
            if python scripts/run_seec_production.py; then
              test -s ci_evidence/seec_posterior.json
              exit 0
            fi
            sleep $((attempt * 20))
          done
          echo "FAIL-CLOSED: production SEEC did not converge."
          exit 1


      - name: Complete historical OOS calibration
        run: python scripts/complete_historical_calibration.py --input data/encuestas_historicas_2004_2023.csv --output ci_evidence/oos_calibration.json

      - name: Verify SEEC execution evidence
        shell: bash
        run: |
          set -euo pipefail
          test -s ci_evidence/seec_posterior.json
          python - <<'PY'
          import json
          x=json.load(open("ci_evidence/seec_posterior.json",encoding="utf-8"))
          assert x["status"]=="PASS"
          assert x["total_posterior_draws"] >= 10000
          assert x["constituencies"] == 52
          PY

      - name: Materialize certification evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci_evidence
          python - <<'PY'
          import json
          from pathlib import Path
          src=Path("data/manifests/HISTORICAL_DATA_MATERIALIZATION.json")
          dst=Path("ci_evidence/historico_manifest.json")
          x=json.loads(src.read_text(encoding="utf-8"))
          x["source_tier"]="PRIMARY_INTERIOR"
          x["evidence_materialized_from"]=str(src)
          dst.write_text(json.dumps(x,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
          printf 'PRIMARY_INTERIOR\n' > ci_evidence/historico_source_tier.txt
          cp ci_evidence/oos_calibration.json ci_evidence/oos_calibration_complete.json
          test -s ci_evidence/seec_posterior.json
          python - <<'PY'
          import json
          x=json.load(open("ci_evidence/seec_posterior.json", encoding="utf-8"))
          assert x["status"] == "PASS"
          assert x.get("total_posterior_draws", x.get("draws", 0)) >= 10000
          assert x["constituencies"] == 52
          PY
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("data/manifests/HISTORICAL_DATA_MATERIALIZATION.json").read_text())
          assert m["status"] == "PASS"
          assert m["official_results"]["rows"] >= 50000
          assert len(m["official_results"]["elections"]) == 8
          Path("ci_evidence/reconciliation.json").write_text(json.dumps({
              "status":"PASS",
              "source":"Ministerio del Interior",
              "scope":"8 elecciones generales, 52 circunscripciones, 350 escaños",
              "max_abs_diff":0,
              "checks":{"elections":8,"constituencies_per_election":52,"seats_per_election":350}
          },ensure_ascii=False,indent=2)+"\n")
          PY

      - name: Full reproducibility backtest
        run: python scripts/run_full_backtest.py --oos-input data/encuestas_historicas_2004_2023.csv --output artifacts/verification/full_backtest.json

      - name: Run master certification gates
        run: python scripts/master_certification.py

      - name: Commit validated materialization
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/resultados_oficiales_2004_2023.csv data/encuestas_historicas_2004_2023.csv data/manifests/HISTORICAL_DATA_MATERIALIZATION.json data/manifests/HISTORICAL_DATA_LIMITATIONS.json data/manifests/INTERIOR_ACQUISITION.json artifacts/oos_historical_2004_2023.json ci_evidence/historico_manifest.json ci_evidence/historico_source_tier.txt ci_evidence/reconciliation.json ci_evidence/oos_calibration.json ci_evidence/oos_calibration_complete.json ci_evidence/seec_posterior.json ci_evidence/poll_source_coverage.json ci_evidence/master_certification.json artifacts/verification/full_backtest.json
          if git diff --cached --quiet; then
            echo "No validated materialization changes."
            exit 0
          fi
          git commit -m "Materialize and certify official Spain historical electoral data"
          git push origin HEAD:main
