name: Historical data — canonical integration

on:
  schedule:
    - cron: "17 3 1 * *"
  push:
    branches: [main]
    paths:
      - "scripts/ingest_official_electoral_history.R"
      - "scripts/ingest_cis_historical_surveys.R"
      - "scripts/validate_historical_data.py"
      - "scripts/run_full_oos.py"
      - "src/oos_pipeline.py"
      - ".github/workflows/historical-data-integration.yml"
      - "config/electoral_sources.json"
  pull_request:
    branches: [main]
    paths:
      - "scripts/ingest_official_electoral_history.R"
      - "scripts/ingest_cis_historical_surveys.R"
      - "scripts/validate_historical_data.py"
      - "scripts/run_full_oos.py"
      - "src/oos_pipeline.py"
      - ".github/workflows/historical-data-integration.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: historical-data-canonical-main
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-latest
    env:
      R_LIBS_USER: /tmp/coalicion-r-lib
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup R
        timeout-minutes: 10
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y r-base r-base-dev

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y curl libcurl4-openssl-dev libssl-dev libxml2-dev libharfbuzz-dev libfribidi-dev libfontconfig1-dev r-cran-readxl r-cran-dplyr r-cran-readr r-cran-tibble r-cran-haven r-cran-purrr r-cran-httr r-cran-jsonlite r-cran-xml2 r-cran-rvest r-cran-stringr r-cran-lubridate r-cran-tidyr r-cran-cli r-cran-rlang r-cran-vctrs r-cran-glue r-cran-lifecycle r-cran-magrittr

      - name: Install R dependencies
        timeout-minutes: 15
        run: |
          set -euxo pipefail
          mkdir -p "$R_LIBS_USER"
          Rscript -e 'options(repos=c(CRAN="https://cloud.r-project.org"), timeout=180); install.packages("opencis", lib=Sys.getenv("R_LIBS_USER"), dependencies=c("Depends","Imports","LinkingTo"), Ncpus=2, quiet=FALSE)'
          Rscript -e 'pkgs <- c("opencis","readxl","dplyr","readr","tibble","haven","purrr"); stopifnot(all(vapply(pkgs, requireNamespace, logical(1), quietly=TRUE)))'

      - name: Ingest official Interior results
        run: Rscript scripts/ingest_official_electoral_history.R

      - name: Ingest official CIS microdata
        run: Rscript scripts/ingest_cis_historical_surveys.R

      - name: Compile Python validation and OOS code
        run: python -m compileall -q src scripts

      - name: Run regression tests
        run: python -m pytest tests/test_poll_monitor.py -q

      - name: Validate datasets and create provenance manifest
        run: python scripts/validate_historical_data.py

      - name: Validate OOS contract against canonical CIS and official results
        run: python scripts/run_full_oos.py --input data/encuestas_historicas_2004_2023.csv --output artifacts/oos_historical_2004_2023.json

      - name: Commit only validated materialization
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/resultados_oficiales_2004_2023.csv data/encuestas_historicas_2004_2023.csv data/manifests/HISTORICAL_DATA_MATERIALIZATION.json data/manifests/HISTORICAL_DATA_LIMITATIONS.json artifacts/oos_historical_2004_2023.json
          if git diff --cached --quiet; then
            echo "No validated data changes."
            exit 0
          fi
          git commit -m "Materialize and certify official Spain historical electoral data"
          git push origin HEAD:main
