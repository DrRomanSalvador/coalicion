name: Historical data — canonical integration

on:
  schedule:
    - cron: "17 3 1 * *"
  push:
    branches: [main]
    paths:
      - "scripts/ingest_official_electoral_history.R"
      - "scripts/ingest_cis_historical_surveys.R"
      - "scripts/validate_historical_data.py"
      - "scripts/run_full_oos.py"
      - "src/oos_pipeline.py"
      - "config/electoral_sources.json"
  pull_request:
    branches: [main]
    paths:
      - "scripts/ingest_official_electoral_history.R"
      - "scripts/ingest_cis_historical_surveys.R"
      - "scripts/validate_historical_data.py"
      - "scripts/run_full_oos.py"
      - "src/oos_pipeline.py"
      - ".github/workflows/historical-data-integration.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: historical-data-canonical-main
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    env:
      R_LIBS_USER: /tmp/coalicion-r-lib
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup R
        timeout-minutes: 10
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"
          use-public-rspm: true

      - name: Install R dependencies
        timeout-minutes: 20
        run: |
          set -euxo pipefail
          mkdir -p "$R_LIBS_USER"
          Rscript -e 'options(repos=c(RSPM="https://packagemanager.posit.co/cran/latest"), timeout=300); install.packages(c("opencis","readxl","dplyr","readr","tibble","haven","purrr"), lib=Sys.getenv("R_LIBS_USER"), dependencies=c("Depends","Imports","LinkingTo"), Ncpus=2, quiet=FALSE)'
          Rscript -e 'pkgs <- c("opencis","readxl","dplyr","readr","tibble","haven","purrr"); stopifnot(all(vapply(pkgs, requireNamespace, logical(1), quietly=TRUE)))'

      - name: Ingest official Interior results
        run: Rscript scripts/ingest_official_electoral_history.R

      - name: Ingest official CIS microdata
        run: Rscript scripts/ingest_cis_historical_surveys.R

      - name: Compile Python validation and OOS code
        run: python -m compileall -q src scripts

      - name: Run regression tests
        run: python -m pytest tests/test_poll_monitor.py -q

      - name: Validate datasets and create provenance manifest
        run: python scripts/validate_historical_data.py

      - name: Validate OOS contract against canonical CIS and official results
        run: python scripts/run_full_oos.py --input data/encuestas_historicas_2004_2023.csv --output artifacts/oos_historical_2004_2023.json

      - name: Commit only validated materialization
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/resultados_oficiales_2004_2023.csv data/encuestas_historicas_2004_2023.csv data/manifests/HISTORICAL_DATA_MATERIALIZATION.json data/manifests/HISTORICAL_DATA_LIMITATIONS.json artifacts/oos_historical_2004_2023.json
          if git diff --cached --quiet; then
            echo "No validated data changes."
            exit 0
          fi
          git commit -m "Materialize and certify official Spain historical electoral data"
          git push origin HEAD:main
