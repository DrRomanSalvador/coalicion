name: Historical data integration

on:
  push:
    branches: [main]
    paths:
      - "scripts/integrate_historical_sources.R"
      - ".github/workflows/historical-data-integration.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"
      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::tidyr
            any::stringr
            any::purrr
            any::readr
            any::haven
            any::jsonlite
            any::tibble
            any::infoelectoral
            any::opencis
      - name: Integrate official results and CIS data
        run: Rscript scripts/integrate_historical_sources.R
      - name: Validate generated datasets
        shell: bash
        run: |
          python - <<'PY'
          import csv, json, pathlib
          for p in ["data/resultados_oficiales_2004_2023.csv","data/encuestas_historicas_2004_2023.csv"]:
              f=pathlib.Path(p)
              if not f.exists() or f.stat().st_size < 100:
                  raise SystemExit(f"FAIL: {p} missing/empty")
              with f.open(encoding="utf-8") as h:
                  rows=sum(1 for _ in csv.reader(h))-1
              if rows < 1:
                  raise SystemExit(f"FAIL: {p} has no observations")
              print(p, rows)
          m=json.loads(pathlib.Path("ci_evidence/historical_data_manifest.json").read_text())
          if "2023-11-23" in str(m):
              raise SystemExit("FAIL: invented 2023-11 general election")
          PY
      - name: Commit integrated data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/resultados_oficiales_2004_2023.csv data/encuestas_historicas_2004_2023.csv ci_evidence/historical_data_manifest.json ci_evidence/infoelectoral_schema_*.txt
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Integrate official election results and CIS historical data"
            git push origin main
          fi
