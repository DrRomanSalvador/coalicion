name: Weekly survey vigilance audit

on:
  schedule:
    - cron: "30 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-survey-vigilance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml feedparser pytest
      - name: Validate Python syntax
        run: python -m py_compile scripts/weekly_survey_audit.py scripts/survey_watch.py

      - name: Run weekly vigilance audit
        run: python scripts/weekly_survey_audit.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-survey-vigilance
          path: ci_evidence/weekly_survey_audit.json
          if-no-files-found: error
