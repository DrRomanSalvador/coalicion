name: Deploy COALICIÓN Telegram webhook

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "telegram-worker/**"
      - ".github/workflows/deploy_telegram_worker.yml"

permissions:
  contents: read

concurrency:
  group: coalicion-telegram-worker-production
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ALLOWED_USER_ID: ${{ secrets.TELEGRAM_ALLOWED_USER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate required secrets without printing them
        shell: bash
        run: |
          set -euo pipefail
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID TELEGRAM_BOT_TOKEN TELEGRAM_ALLOWED_USER_ID; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Missing repository secret: $key. Add it in Settings > Secrets and variables > Actions."
              exit 1
            fi
          done
          [[ "$TELEGRAM_ALLOWED_USER_ID" =~ ^[0-9]+$ ]] || {
            echo "::error::TELEGRAM_ALLOWED_USER_ID must contain the operator's numeric Telegram user ID, not the bot token or username."
            exit 1
          }
      - name: Install dependencies
        working-directory: telegram-worker
        run: npm install --no-audit --no-fund
      - name: Test webhook security and command handlers
        working-directory: telegram-worker
        run: npm test
      - name: Type-check worker
        working-directory: telegram-worker
        run: npm run typecheck
      - name: Generate a fresh webhook secret
        shell: bash
        run: |
          set -euo pipefail
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          printf 'TELEGRAM_WEBHOOK_SECRET=%s\n' "$secret" >> "$GITHUB_ENV"
      - name: Deploy Worker and provision D1 binding
        id: deploy
        working-directory: telegram-worker
        shell: bash
        run: |
          set -euo pipefail
          if npx wrangler deploy 2>&1 | tee "$RUNNER_TEMP/wrangler-deploy.log"; then
            :
          else
            deploy_status=$?
            if grep -qiE 'register a workers\.dev subdomain|workers\.dev subdomain' "$RUNNER_TEMP/wrangler-deploy.log"; then
              echo "::error::Cloudflare account has not registered its workers.dev subdomain. One-time setup required: open Cloudflare Dashboard > Workers & Pages and complete the workers.dev onboarding for this account, then rerun this workflow. No webhook was changed."
            fi
            exit "$deploy_status"
          fi
          URL="$(grep -Eo 'https://coalicion-telegram\.[a-zA-Z0-9-]+\.workers\.dev' "$RUNNER_TEMP/wrangler-deploy.log" | tail -n 1 || true)"
          if [[ -z "$URL" ]]; then
            echo "::error::Deployment did not report the expected coalicion-telegram.<subdomain>.workers.dev URL. Inspect the Wrangler output; Telegram webhook was not configured."
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Configure Worker secrets
        working-directory: telegram-worker
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$TELEGRAM_BOT_TOKEN" | npx wrangler secret put TELEGRAM_BOT_TOKEN
          printf '%s' "$TELEGRAM_WEBHOOK_SECRET" | npx wrangler secret put TELEGRAM_WEBHOOK_SECRET
          printf '%s' "$TELEGRAM_ALLOWED_USER_ID" | npx wrangler secret put TELEGRAM_ALLOWED_USER_ID
      - name: Register Telegram webhook
        shell: bash
        env:
          WORKER_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          payload="$(python -c 'import json,os; print(json.dumps({"url":os.environ["WORKER_URL"]+"/telegram/webhook","secret_token":os.environ["TELEGRAM_WEBHOOK_SECRET"],"allowed_updates":["message","callback_query"],"drop_pending_updates":False}))')"
          result="$(curl --fail-with-body --silent --show-error --retry 3 --retry-delay 2 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook" -H 'content-type: application/json' --data "$payload")"
          python -c 'import json,sys; d=json.loads(sys.argv[1]); assert d.get("ok") is True, "Telegram rejected webhook registration"; print("Telegram webhook registered.")' "$result"
      - name: Verify public health endpoint
        env:
          WORKER_URL: ${{ steps.deploy.outputs.url }}
        run: curl --fail --silent --show-error --retry 5 --retry-delay 2 "$WORKER_URL/health"
