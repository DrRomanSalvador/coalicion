name: Telegram bot validation
# Canonical user-facing contract validation

on:
  push:
    branches: [main]
    paths:
      - "src/telegram_bot.py"
      - "tests/test_telegram_bot.py"
      - "requirements.txt"
  pull_request:
    paths:
      - "src/telegram_bot.py"
      - "tests/test_telegram_bot.py"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install core dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile bot
        run: python -m py_compile src/telegram_bot.py
      - name: Test bot
        run: python -m pytest -q tests/test_telegram_bot.py
