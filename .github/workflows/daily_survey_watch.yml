name: Daily neutral survey watch

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions has no DST-aware cron. Run at both possible UTC
    # hours and let the script gate on Europe/Madrid local hour == 08.
    - cron: "0 6 * * *"
    - cron: "0 7 * * *"

permissions:
  contents: write

concurrency:
  group: daily-neutral-survey-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ejecutar vigilancia neutral
        run: python scripts/survey_watch.py
      - name: Persistir informe y estado
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/survey_watch_report.json artifacts/survey_watch_state.json artifacts/surveys
          if git diff --cached --quiet; then
            echo "NO_CHANGES"
          else
            git commit -m "ci: persist daily survey watch"
            git push
          fi
