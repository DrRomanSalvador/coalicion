name: Daily survey watch

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run daily survey watch
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/survey_watch.py
      - name: Upload watch report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-survey-watch
          path: |
            artifacts/survey_watch_report.json
            artifacts/survey_watch_state.json
            artifacts/surveys/
          if-no-files-found: warn
