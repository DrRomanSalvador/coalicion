name: phase2-product

on:
  push:
    branches: [main]
    paths:
      - "src/models/**"
      - "src/pipeline/**"
      - "src/trailability/**"
      - "src/alerts/**"
      - "src/recovery/**"
      - "src/reproducibility/**"
      - "src/security/**"
      - "src/monitoring/**"
      - "src/backup/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - "src/telegram_bot.py"
      - "tests/test_*phase2*.py"
      - "tests/test_territorial_prediction_2026.py"
      - "data/surveys/current_2026/**"
      - "scripts/materialize_phase2_demo.py"
      - "scripts/verify_phase2_priority1.py"
      - "tests/test_phase2_priority2.py"
      - "tests/test_alerts.py"
      - "tests/test_recovery.py"
      - "tests/test_reproducibility_product.py"
      - "tests/test_security.py"
      - "tests/test_docker.py"
      - "tests/test_monitoring_backup.py"
      - "scripts/materialize_reproducibility_checkpoint.py"
      - "artifacts/phase2_reproducibility_status.json"
      - "scripts/materialize_priority2_checkpoint.py"
      - "scripts/materialize_phase2_demo.py"
      - "artifacts/phase2_priority2_status.json"
      - "artifacts/phase2_priority1_status.json"
      - "artifacts/phase2_priority4_status.json"
      - "artifacts/phase2_priority6_status.json"
      - "docs/DEMO_TODAY.md"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  phase2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: pip install -r requirements.lock
      - name: Materialize demo
        run: python scripts/materialize_phase2_demo.py
      - name: Materialize Priority 2 gate
        run: python scripts/materialize_priority2_checkpoint.py
      - name: Materialize reproducibility evidence
        run: python scripts/materialize_reproducibility_checkpoint.py
      - name: Verify Phase 2
        run: |
          python -m pytest -q tests/test_trailability.py tests/test_full_pipeline.py tests/test_reproducibility_phase2.py tests/test_territorial_prediction_2026.py tests/test_phase2_priority1.py tests/test_phase2_priority2.py tests/test_alerts.py tests/test_recovery.py tests/test_reproducibility_product.py tests/test_security.py tests/test_docker.py tests/test_monitoring_backup.py
          python -m pytest -q tests/test_telegram_bot.py tests/test_telegram_integration.py
      - name: Upload demo evidence
        uses: actions/upload-artifact@v4
        with:
          name: coalicion-phase2-demo
          path: |
            artifacts/territorial_prediction_20261008.json
            data/surveys/current_2026/current_national.json
            ci_evidence/phase2_master_checkpoint.json
            ci_evidence/phase2_architecture_inventory.json
            artifacts/phase2_priority1_status.json
            artifacts/phase2_priority2_status.json
            artifacts/phase2_priority4_status.json
            artifacts/phase2_reproducibility_status.json
            artifacts/phase2_priority6_status.json
