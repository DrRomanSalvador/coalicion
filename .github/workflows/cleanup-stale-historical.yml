name: Cleanup stale historical runners

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel stale historical runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          runs="$(gh api "repos/$REPOSITORY/actions/workflows/377488491/runs?per_page=100" --jq '.workflow_runs[] | select(.status == "queued" or .status == "in_progress" or .status == "pending") | [.id,.run_number] | @tsv')"
          latest="$(gh api "repos/$REPOSITORY/actions/workflows/377488491/runs?per_page=100" --jq '[.workflow_runs[] | select(.head_branch == "main")] | max_by(.created_at) | .id')"
          while IFS=$'\t' read -r run_id run_number; do
            [ -n "${run_id:-}" ] || continue
            if [ "$run_id" != "$latest" ]; then
              echo "Cancelling stale historical run #$run_number ($run_id)"
              gh api --method POST "repos/$REPOSITORY/actions/runs/$run_id/force-cancel" >/dev/null || gh api --method POST "repos/$REPOSITORY/actions/runs/$run_id/cancel" >/dev/null || true
            fi
          done <<< "$runs"
          echo "Dispatching canonical historical integration on current main"
          gh api --method POST "repos/$REPOSITORY/actions/workflows/377488491/dispatches" -f ref=main >/dev/null
