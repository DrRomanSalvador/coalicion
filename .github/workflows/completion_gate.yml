name: completion-gate

on:
  push:
    branches: [main]
    paths-ignore:
      - "artifacts/**"
      - "ci_evidence/**"
      - "reports/**"
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: completion-gate-main
  cancel-in-progress: false

jobs:
  completion-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.lock ]; then pip install -r requirements.lock; else pip install pytest; fi

      - name: Run contract suite
        run: pytest -q

      - name: Verify master certification readiness
        id: gate
        run: |
          python scripts/master_certification.py
          python - <<'PY'
          import json
          x=json.load(open("ci_evidence/master_certification.json",encoding="utf-8"))
          assert x["status"] in {"READY_FOR_EXTERNAL_AUDIT","CERTIFIED"}
          assert all(g["status"] == "PASS" for g in x["gates"] if g["name"] != "external_audit")
          print("COMPLETION_GATE=PASS", x["status"])
          PY

      - name: Persist verified master certification evidence
        if: success() && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp ci_evidence/master_certification.json /tmp/master_certification.json
          tested_sha="$(python -c 'import json; print(json.load(open("/tmp/master_certification.json", encoding="utf-8")).get("tested_commit") or "")')"
          test -n "$tested_sha" || { echo "::error::Certification evidence has no tested_commit."; exit 1; }
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            current_sha="$(git rev-parse HEAD)"
            if [ "$tested_sha" != "$current_sha" ]; then
              changed_paths="$(git diff --name-only "$tested_sha" "$current_sha")"
              unexpected_paths="$(printf '%s\n' "$changed_paths" | awk '$0 !~ /^(artifacts\/|ci_evidence\/|reports\/|docs\/COLMENA_STATE\.json$)/')"
              if [ -n "$unexpected_paths" ]; then
                echo "::notice::main code/data changed after certification tests; stale certification will not be persisted."
                printf 'tested=%s current=%s\nchanged paths:\n%s\n' "$tested_sha" "$current_sha" "$unexpected_paths" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
            set +e
            python - /tmp/master_certification.json <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          for path, expected in payload.get("evidence_sha256", {}).items():
              p = Path(path)
              actual = hashlib.sha256(p.read_bytes()).hexdigest() if p.is_file() else None
              if actual != expected:
                  print(f"STALE_CERTIFICATION_EVIDENCE:{path}:expected={expected}:actual={actual}")
                  raise SystemExit(3)
          PY
            freshness_rc=$?
            set -e
            if [ "$freshness_rc" -eq 3 ]; then
              echo "::notice::certification evidence inputs changed; stale certification will not be persisted."
              echo "Tests passed for $tested_sha, but the referenced evidence changed on main; no certification snapshot was published." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$freshness_rc" -ne 0 ]; then
              exit "$freshness_rc"
            fi
            mkdir -p ci_evidence
            cp /tmp/master_certification.json ci_evidence/master_certification.json
            git add ci_evidence/master_certification.json
            if git diff --cached --quiet; then
              echo "Master certification evidence is already current."
              exit 0
            fi
            git commit -m "ci: persist verified master certification gates"
            if git push origin HEAD:main; then
              echo "Master certification evidence persisted."
              exit 0
            fi
            echo "Concurrent main update; retrying certification evidence persistence ($attempt/5)."
            sleep $((attempt * 3))
          done
          echo "FAIL-CLOSED: unable to persist master certification evidence."
          exit 1

      - name: Notify Telegram only after verified main-branch completion
        if: success() && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "Telegram secrets not configured; completion remains verified in GitHub."
            exit 0
          fi
          python - <<'PY'
          import os, urllib.request, urllib.parse
          token=os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id=os.environ["TELEGRAM_CHAT_ID"]
          status=json.load(open("ci_evidence/master_certification.json",encoding="utf-8"))["status"]
          text=f"✅ COALICIÓN: todos los gates internos PASS. Estado: {status}."
          data=urllib.parse.urlencode({"chat_id":chat_id,"text":text}).encode()
          req=urllib.request.Request(f"https://api.telegram.org/bot{token}/sendMessage", data=data, method="POST")
          urllib.request.urlopen(req, timeout=15).read()
          PY
