name: Political intelligence system gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/political_intelligence.py"
      - "tests/test_political_intelligence*.py"
      - "scripts/build_political_intelligence_manifest.py"
      - "config/political_intelligence_sources.json"
      - ".github/workflows/political_intelligence_system.yml"

permissions:
  contents: read

jobs:
  system-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile integration layer
        run: python -m py_compile src/political_intelligence.py scripts/build_political_intelligence_manifest.py
      - name: Validate political intelligence
        run: python -m pytest tests/test_political_intelligence.py tests/test_political_intelligence_system.py -q
      - name: Build reproducibility manifest
        run: python scripts/build_political_intelligence_manifest.py
      - name: Publish manifest
        uses: actions/upload-artifact@v4
        with:
          name: political-intelligence-manifest
          path: artifacts/political_intelligence_manifest.json
