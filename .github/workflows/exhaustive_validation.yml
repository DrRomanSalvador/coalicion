name: Exhaustive fail-closed validation

on:
  workflow_dispatch:
  push:
    branches:
      - "fix/seec-oos-main-current"
      - "main"
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/**"

concurrency:
  # Keep main validation independent from PR validation; only supersede runs for the same ref.
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Verify self-healer covers every workflow
        shell: python
        run: |
          import re
          from pathlib import Path

          workflow_dir = Path(".github/workflows")
          names = {}
          for path in sorted(workflow_dir.glob("*.yml")):
              text = path.read_text(encoding="utf-8")
              match = re.search(r"^name:\\s*(.*?)\\s*$", text, re.MULTILINE)
              if not match:
                  raise SystemExit(f"Workflow lacks a top-level name: {path}")
              name = match.group(1).strip().strip('"').strip("'")
              if name != "Autonomous repository self-healer":
                  names[name] = path

          healer = (workflow_dir / "autonomous_self_healer.yml").read_text(encoding="utf-8")
          block = re.search(r"(?ms)^  workflow_run:\\n(.*?)(?=^\\S|\\Z)", healer)
          if not block:
              raise SystemExit("Self-healer workflow_run trigger is missing.")
          configured = {
              item.strip().strip('"').strip("'")
              for item in re.findall(r"^\\s+-\\s+(.+?)\\s*$", block.group(1), re.MULTILINE)
          }
          missing = sorted(set(names) - configured)
          if missing:
              raise SystemExit("Self-healer misses workflows: " + ", ".join(missing))
          print(f"SELF_HEALER_COVERAGE=PASS ({len(names)} workflows)")
      - name: Lint all GitHub Actions workflows
        shell: bash
        run: |
          set -euo pipefail
          version="1.7.12"
          archive="actionlint_${version}_linux_amd64.tar.gz"
          curl --fail --location --retry 3 --retry-all-errors \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}" \
            --output "/tmp/${archive}"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/${archive}" | sha256sum --check
          tar -xzf "/tmp/${archive}" -C /tmp actionlint
          /tmp/actionlint -color .github/workflows/*.yml
      - name: Run fail-closed gate
        run: python scripts/autonomous_fix_and_validate.py --strict
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-validation
          path: artifacts/verification/autonomous_validation.json
