name: Exhaustive fail-closed validation

on:
  workflow_dispatch:
  push:
    branches:
      - "fix/seec-oos-main-current"
      - "main"
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/exhaustive_validation.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/exhaustive_validation.yml"

concurrency:
  group: validate-main
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run fail-closed gate
        run: python scripts/autonomous_fix_and_validate.py --strict
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-validation
          path: artifacts/verification/autonomous_validation.json
