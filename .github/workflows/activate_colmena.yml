name: Activar Colmena

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/queen_bee.py"
      - "scripts/queen_bee_v2.py"
      - "cli.py"
      - "scripts/ai_electoral_data_engine.py"
      - "scripts/exhaustive_data_acquisition.py"
      - "scripts/worker_bee.py"
      - ".github/workflows/activate_colmena.yml"

permissions:
  contents: write

concurrency:
  group: colmena-2023
  cancel-in-progress: false

jobs:
  queen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python -m pip install --upgrade pip certifi openpyxl pandas
      - name: Endurecimiento
        id: hardening
        continue-on-error: true
        run: |
          mkdir -p artifacts/queue
          set +e
          python -m unittest discover -s tests -p "test_*.py" > artifacts/queue/hardening_tests.log 2>&1
          rc=$?
          cat artifacts/queue/hardening_tests.log
          printf '%s\n' "$rc" > artifacts/queue/hardening_tests.exit
          exit "$rc"
      - name: Abeja Reina
        env:
          COLMENA_MAX_RETRIES: "3"
          COLMENA_RETRY_DELAY: "10"
        run: python scripts/queen_bee_v2.py
      - name: Publicar estado de colmena
        if: always()
        run: |
          python scripts/product_status.py || true
          test ! -f artifacts/queen_bee_report.json || cat artifacts/queen_bee_report.json
      - name: Persistir evidencia
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A artifacts reports
          if git diff --cached --quiet; then
            echo "NO_CHANGES"
          else
            git commit -m "ci: persist colmena execution evidence"
            git push
          fi
