name: Activar Colmena

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/queen_bee*.py"
      - "scripts/worker_bee.py"
      - "scripts/product_status.py"
      - "src/neutral_coalition.py"
      - "tests/test_neutral_coalition.py"
      - ".github/workflows/activate_colmena.yml"

permissions:
  contents: read

concurrency:
  group: colmena-neutral-activation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile colmena layer
        run: |
          python -m py_compile scripts/queen_bee.py scripts/queen_bee_v2.py scripts/queen_bee_v3.py scripts/worker_bee.py scripts/product_status.py src/neutral_coalition.py
      - name: Validate neutral contracts
        run: python -m pytest -q tests/test_neutral_coalition.py tests/test_neutral_audit.py tests/test_electoral.py tests/test_decision.py

