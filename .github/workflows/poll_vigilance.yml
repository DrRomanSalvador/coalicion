name: Poll vigilance

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 7 * * *"

permissions:
  contents: write

concurrency:
  group: poll-vigilance
  cancel-in-progress: false

jobs:
  ingest_polls:
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.result.outputs.status }}
      should_notify: ${{ steps.result.outputs.should_notify }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Comprobar ventana 08:00 Europe/Madrid
        id: gate
        run: |
          HOUR=$(TZ=Europe/Madrid date +%H)
          if [ "$HOUR" = "08" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ejecutar vigilancia y detección de cambios
        id: ingest
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: python scripts/ingest_polls.py
      - name: Publicar resultado
        id: result
        if: always()
        run: |
          if test -f artifacts/poll_vigilance_report.json; then
            python - <<'PY'
          import json
          p=json.load(open("artifacts/poll_vigilance_report.json",encoding="utf-8"))
          with open("/tmp/result.env","w") as f:
              f.write("status="+p["status"]+"\n")
              f.write("should_notify="+str(any(e.get("status") in {"NEW_POLL","CHANGED_POLL"} for e in p.get("events",[]))).lower()+"\n")
          PY
            cat /tmp/result.env >> "$GITHUB_OUTPUT"
          else
            echo "status=BLOCKED" >> "$GITHUB_OUTPUT"
            echo "should_notify=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mostrar informe operacional
        if: always()
        run: |
          test ! -f artifacts/poll_vigilance_report.json || cat artifacts/poll_vigilance_report.json
      - name: Persistir informe, alertas y estado
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/poll_vigilance_report.json artifacts/poll_vigilance_state.json artifacts/surveys
          if git diff --cached --quiet; then
            echo "NO_CHANGES"
          else
            git commit -m "ci: persist daily survey alerts"
            git push
          fi
      - name: Fallar cerrado ante fuente inaccesible
        if: steps.ingest.outcome == 'failure'
        run: exit 1

  send_telegram_alert:
    needs: ingest_polls
    if: needs.ingest_polls.outputs.should_notify == 'true' && needs.ingest_polls.outputs.status == 'ALERT'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recuperar informe generado
        run: git pull --ff-only
      - name: Enviar alerta Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/telegram_notifier.py artifacts/poll_vigilance_report.json
