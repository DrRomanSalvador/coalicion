name: Poll vigilance

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 7 * * *"

permissions:
  contents: write

concurrency:
  group: daily-neutral-survey-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ejecutar vigilancia y detección de cambios
        id: watch
        continue-on-error: true
        run: python scripts/survey_watch.py
      - name: Mostrar informe operacional
        if: always()
        run: |
          test ! -f artifacts/survey_watch_report.json || cat artifacts/survey_watch_report.json
          test ! -f artifacts/neutral_poll_report.json || cat artifacts/neutral_poll_report.json
      - name: Notificar por Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if test -f artifacts/survey_watch_report.json && \
             grep -Eq '"status": "(ALERT|BLOCKED)"' artifacts/survey_watch_report.json; then
            python scripts/telegram_notifier.py artifacts/poll_vigilance_report.json
          else
            echo "NO_TELEGRAM_ALERT"
          fi

      - name: Persistir informe, alertas y estado
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/survey_watch_report.json artifacts/survey_watch_state.json artifacts/surveys
          if git diff --cached --quiet; then
            echo "NO_CHANGES"
          else
            git commit -m "ci: persist daily survey alerts"
            git push
          fi
      - name: Fallar cerrado ante fuente inaccesible
        if: steps.watch.outcome == 'failure'
        run: exit 1

