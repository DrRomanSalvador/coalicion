name: Poll vigilance

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 7 * * *"

permissions:
  contents: read

concurrency:
  group: poll-vigilance
  cancel-in-progress: false

jobs:
  poll_vigilance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          pip install beautifulsoup4 requests

      - name: Comprobar ventana 08:00 Europe/Madrid
        id: gate
        run: |
          HOUR=$(TZ=Europe/Madrid date +%H)
          if [ "$HOUR" = "08" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ejecutar vigilancia y detección de cambios
        if: steps.gate.outputs.run == 'true'
        run: python scripts/ingest_polls.py

      - name: Enviar alerta Telegram si hay encuesta nueva
        if: steps.gate.outputs.run == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if python - <<'PY'
          import json
          from pathlib import Path

          report = Path("artifacts/poll_vigilance_report.json")
          if not report.exists():
              raise SystemExit(1)

          payload = json.loads(report.read_text(encoding="utf-8"))
          has_new = any(
              event.get("status") in {"NEW_POLL", "CHANGED_POLL"}
              for event in payload.get("events", [])
          )
          raise SystemExit(0 if has_new else 1)
          PY
          then
            python scripts/telegram_notifier.py artifacts/poll_vigilance_report.json
          else
            echo "Sin encuesta nueva ni revisión real: no se envía Telegram."
          fi
