name: Reproducibility and Product Verification

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Historical data — canonical integration"]
    types: [completed]

concurrency:
  group: verify-main
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --upgrade pytest
      - name: Compile core
        run: python -m py_compile coalicion.py political_product.py src/*.py scripts/*.py
      - name: Reproducibility contract
        run: python -m pytest -q tests/test_reproducibility_contract.py
      - name: Product layer
        run: python -m pytest -q tests/test_product_layer.py
      - name: Master certification report
        run: python scripts/master_certification.py > master-certification.json
      - name: Publish certification report
        uses: actions/upload-artifact@v4
        with:
          name: master-certification-report
          path: master-certification.json
