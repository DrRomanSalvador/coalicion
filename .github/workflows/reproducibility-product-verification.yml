name: Reproducibility and Product Verification

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "config/**"
      - "data/source_anchors/**"
      - ".github/workflows/**"
      - "political_product.py"
      - "coalicion.py"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "config/**"
      - "data/source_anchors/**"
      - ".github/workflows/**"
      - "political_product.py"
      - "coalicion.py"

concurrency:
  group: verify-main
  cancel-in-progress: true

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --upgrade pytest
      - name: Compile core
        run: python -m py_compile coalicion.py political_product.py src/*.py scripts/*.py
      - name: Reproducibility contract
        run: python -m pytest -q tests/test_reproducibility_contract.py
      - name: Product layer
        run: python -m pytest -q tests/test_product_layer.py
      - name: Master certification report
        run: python scripts/master_certification.py > master-certification.json
      - name: Publish certification report
        uses: actions/upload-artifact@v4
        with:
          name: master-certification-report
          path: master-certification.json
