name: External Audit - Technical Reproducibility

on:
  push:
    branches: [main]
    paths:
      - "ci_evidence/**"
      - "scripts/external_audit.py"
      - "src/**"
      - "tests/**"
      - "docs/EXTERNAL_AUDIT_MASTER.md"
      - ".github/workflows/external-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-audit-main
  cancel-in-progress: false

jobs:
  technical-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout audited commit
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Run technical audit
        run: python scripts/external_audit.py | tee external_audit_result.json

      - name: Run full contract suite
        run: pytest -q

      - name: Publish audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: external-audit-${{ github.sha }}
          path: |
            external_audit_result.json
            docs/EXTERNAL_AUDIT_MASTER.md
            ci_evidence/*.json
          retention-days: 90
