name: Inspect official Interior download transport

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/inspect-interior-source.yml"
      - "scripts/ingest_official_electoral_history.R"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test official XLSX transport
        run: |
          set -euxo pipefail
          u="https://descargas.interior.gob.es/datasets/resultados_electorales/Elecciones-Congreso.xlsx"
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 60 "$u" -o /tmp/interior.xlsx
          ls -lh /tmp/interior.xlsx
          file /tmp/interior.xlsx
      - name: Inspect workbook
        run: |
          python - <<'PY'
          import openpyxl, json
          p="/tmp/interior.xlsx"
          wb=openpyxl.load_workbook(p,read_only=True,data_only=True)
          print("SHEETS",json.dumps(wb.sheetnames,ensure_ascii=False))
          for ws in wb.worksheets:
              print("SHEET",ws.title,"ROWS",ws.max_row,"COLS",ws.max_column)
              for row in ws.iter_rows(min_row=1,max_row=min(5,ws.max_row),values_only=True):
                  print(json.dumps(list(row),ensure_ascii=False,default=str))
          PY
