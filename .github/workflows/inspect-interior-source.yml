name: Inspect official BOE election results

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/inspect-interior-source.yml"
      - "scripts/ingest_official_electoral_history.R"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Discover BOE result resolutions
        run: |
          python - <<'PY'
          import requests, re
          dates=["14 de marzo de 2004","9 de marzo de 2008","20 de noviembre de 2011","20 de diciembre de 2015","26 de junio de 2016","28 de abril de 2019","10 de noviembre de 2019","23 de julio de 2023"]
          for d in dates:
              u="https://www.boe.es/buscar/?q="+requests.utils.quote("ELECCIONES GENERALES DE "+d)
              r=requests.get(u,timeout=30)
              r.raise_for_status()
              ids=sorted(set(re.findall(r"BOE-A-\\d+-\\d+",r.text)))
              print(d, ids[:10])
          PY
