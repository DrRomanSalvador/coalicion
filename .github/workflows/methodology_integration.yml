name: Methodology integration

on:
  push:
    branches: [main]
    paths:
      - "src/methodology_*.py"
      - "src/models/**"
      - "src/rapid_decision_center.py"
      - "tests/test_methodology_*.py"
      - ".github/workflows/methodology_integration.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: methodology-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile src/methodology_pipeline.py src/methodology_bridge.py src/methodology_registry.py
      - run: python -m pytest -q tests/test_methodology_pipeline.py tests/test_methodology_bridge.py tests/test_methodology_registry.py
