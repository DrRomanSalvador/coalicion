name: Global repository orchestrator

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: global-repository-orchestrator
  cancel-in-progress: false

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Release only genuinely stuck canonical runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          now="$(date -u +%s)"
          gh api --paginate "repos/$REPOSITORY/actions/runs?per_page=100&branch=main"             --jq '.workflow_runs[] |
              select(.name == "Historical data — canonical integration" and .status == "in_progress") |
              [.id,.created_at] | @tsv' > /tmp/canonical.tsv

          while IFS=$'\t' read -r run_id created_at; do
            [ -n "$run_id" ] || continue
            started="$(date -d "$created_at" +%s)"
            if [ $((now-started)) -ge 10800 ]; then
              echo "Cancelling genuinely stuck canonical run $run_id (>=3h)."
              if ! gh api --method POST "repos/$REPOSITORY/actions/runs/$run_id/cancel"; then
                current_status="$(gh api "repos/$REPOSITORY/actions/runs/$run_id" --jq '.status')"
                if [ "$current_status" = "completed" ]; then
                  echo "Run $run_id completed before cancellation; no action needed."
                else
                  echo "::error::Unable to cancel stuck canonical run $run_id (status=$current_status)."
                  exit 1
                fi
              fi
            fi
          done < /tmp/canonical.tsv
