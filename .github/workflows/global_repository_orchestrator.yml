name: Global repository orchestrator

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: global-repository-orchestrator
  cancel-in-progress: true

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Release stuck canonical run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          api() { gh api "$@"; }
          now="$(date -u +%s)"
          api --paginate "repos/$REPOSITORY/actions/runs?per_page=100&branch=main" \
            --jq '.workflow_runs[] |
              select(.name == "Historical data — canonical integration" and .status == "in_progress") |
              [.id,.created_at] | @tsv' > /tmp/canonical.tsv
          while IFS=$'\t' read -r run_id created_at; do
            [ -n "$run_id" ] || continue
            started="$(date -d "$created_at" +%s)"
            if [ $((now-started)) -ge 300 ]; then
              api --method POST "repos/$REPOSITORY/actions/runs/$run_id/cancel" || \
              api --method POST "repos/$REPOSITORY/actions/runs/$run_id/force-cancel"
            fi
          done < /tmp/canonical.tsv
