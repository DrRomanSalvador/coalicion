name: Autonomous repository self-healer

on:
  workflow_dispatch:
    inputs:
      failed_run_id:
        description: "GitHub Actions run ID to retry failed jobs for"
        required: true
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: autonomous-workflow-self-healer
  cancel-in-progress: false

jobs:
  heal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Self-heal explicitly selected failed run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          FAILED_RUN_ID: ${{ inputs.failed_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$FAILED_RUN_ID" =~ ^[0-9]+$ ]] || {
            echo "Invalid failed_run_id: $FAILED_RUN_ID"
            exit 1
          }
          gh api --method POST "repos/$REPOSITORY/actions/runs/$FAILED_RUN_ID/rerun-failed-jobs"
          echo "Failed jobs requeued for run $FAILED_RUN_ID."
