name: Autonomous repository self-healer

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: autonomous-workflow-self-healer
  cancel-in-progress: false

jobs:
  heal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Self-heal an explicitly selected failed run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          FAILED_RUN_ID: ${{ inputs.failed_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FAILED_RUN_ID:-}" ]; then
            echo "No failed_run_id supplied; refusing to guess or create retry churn."
            exit 1
          fi
          echo "Explicit self-heal target: $FAILED_RUN_ID"
          gh api --method POST "repos/$REPOSITORY/actions/runs/$FAILED_RUN_ID/rerun-failed-jobs"
