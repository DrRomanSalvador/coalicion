              echo "::error::Resolved workflow run $RUN_ID is not in a rerunnable failed state (conclusion=$CONCLUSION)."
              exit 1
            fi
          fi

          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || {
            echo "::error::Unable to resolve a valid workflow run ID."
            exit 1
          }
          echo "Resolved failed workflow run: $RUN_ID"
