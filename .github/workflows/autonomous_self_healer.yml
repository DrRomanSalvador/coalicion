name: Autonomous repository self-healer

on:
  workflow_dispatch:
    inputs:
      failed_run_id:
        description: "Required for manual repair: one failed workflow run ID, job ID, or Actions URL"
        required: true
        type: string
  workflow_run:
    workflows:
      - completion-gate
      - Exhaustive fail-closed validation
      - Methodology extensions validation
      - Product runtime smoke
      - Historical data — canonical integration
      - Pytest — exhaustive suite
      - Autonomous poll monitor
      - Primary Interior fast materialization
      - Colmena HF — tests aislados
      - Real estimation pipeline
      - Product pipeline 2026
      - Full reproducible suite — tests + OOS + SEEC
      - Historical CI orchestrator
      - COALICIÓN — Colmena ligera
    types: [completed]

permissions:
  actions: write
  contents: read

concurrency:
  # A unique group per failed run prevents queued recovery events from cancelling one another.
  group: autonomous-workflow-self-healer-${{ github.event.workflow_run.id || inputs.failed_run_id || github.run_id }}
  cancel-in-progress: false

jobs:
  heal:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'workflow_run' &&
           github.event.workflow_run.head_branch == 'main' &&
           github.event.workflow_run.run_attempt == 1 &&
           (github.event.workflow_run.conclusion == 'failure' ||
            github.event.workflow_run.conclusion == 'cancelled' ||
            github.event.workflow_run.conclusion == 'timed_out' ||
            github.event.workflow_run.conclusion == 'startup_failure')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate target and rerun failed jobs only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          INPUT_ID: ${{ inputs.failed_run_id }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            case "$EVENT_CONCLUSION" in
              failure|cancelled|timed_out|startup_failure) ;;
              *) echo "No retry needed for conclusion=$EVENT_CONCLUSION"; exit 0 ;;
            esac
            target_id="$EVENT_RUN_ID"
          else
            raw="$(printf '%s' "$INPUT_ID" | tr -d '[:space:]')"
            if [[ "$raw" =~ ^[0-9]+$ ]]; then
              target_id="$raw"
            else
              mapfile -t ids < <(printf '%s' "$INPUT_ID" | grep -Eo 'actions/(runs|jobs)/[0-9]+' | grep -Eo '[0-9]+' || true)
              if [[ "${#ids[@]}" -eq 1 ]]; then
                target_id="${ids[0]}"
              else
                mapfile -t ids < <(printf '%s' "$INPUT_ID" | grep -Eio '(failed_run_id|workflow_run_id|run_id|job_id)[[:space:]":=]+[0-9]+' | grep -Eo '[0-9]+' || true)
                if [[ "${#ids[@]}" -eq 1 ]]; then
                  target_id="${ids[0]}"
                else
                  echo "::error::Provide one numeric run/job ID or one explicit /actions/runs/ID or /actions/jobs/ID URL; ambiguous logs are rejected."
                  exit 1
                fi
              fi
            fi
          fi

          [[ "$target_id" =~ ^[0-9]+$ ]] || { echo "::error::Invalid target ID."; exit 1; }

          # Resolve runs/jobs through the REST API. Active runs have no conclusion yet.
          run_id=""
          run_json=""
          if run_json="$(gh api "repos/$REPOSITORY/actions/runs/$target_id" 2>/dev/null)"; then
            run_id="$(jq -r '.id // empty' <<<"$run_json")"
          else
            job_json="$(gh api "repos/$REPOSITORY/actions/jobs/$target_id" 2>/dev/null)" || {
              echo "::error::ID $target_id is neither a readable workflow run nor a job in $REPOSITORY."
              exit 1
            }
            run_id="$(jq -r '.run_id // empty' <<<"$job_json")"
            [[ "$run_id" =~ ^[0-9]+$ ]] || { echo "::error::Could not resolve job $target_id to a workflow run."; exit 1; }
            run_json="$(gh api "repos/$REPOSITORY/actions/runs/$run_id")" || {
              echo "::error::Resolved workflow run $run_id cannot be read."
              exit 1
            }
          fi

          [[ "$run_id" =~ ^[0-9]+$ ]] || { echo "::error::Could not resolve a valid workflow run ID."; exit 1; }
          status="$(jq -r '.status // empty' <<<"$run_json")"
          conclusion="$(jq -r '.conclusion // empty' <<<"$run_json")"

          case "$status" in
            queued|in_progress|waiting|requested|pending)
              echo "::error::Workflow run $run_id is still $status (conclusion=${conclusion:-not-set}); wait for it to finish before requesting a rerun."
              exit 1
              ;;
            completed) ;;
            *)
              echo "::error::Workflow run $run_id has unknown status '${status:-not-set}'; refusing to rerun."
              exit 1
              ;;
          esac

          case "$conclusion" in
            failure|cancelled|timed_out|startup_failure) ;;
            *)
              echo "::error::Workflow run $run_id is not rerunnable (conclusion=$conclusion)."
              exit 1
              ;;
          esac

          echo "Validated completed workflow run: $run_id (status=$status, conclusion=$conclusion)"
          if [[ "$conclusion" == "cancelled" ]]; then
            # Cancelled runs may have no failed jobs, so --failed is not applicable.
            echo "Run was cancelled; requesting a full rerun."
            gh run rerun "$run_id" --repo "$REPOSITORY"
            echo "Requested full rerun of cancelled workflow run $run_id."
          else
            gh run rerun "$run_id" --failed --repo "$REPOSITORY"
            echo "Requested rerun of failed jobs for run $run_id."
          fi
