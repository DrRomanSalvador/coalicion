name: Autonomous repository self-healer

on:
  workflow_dispatch:
    inputs:
      failed_run_id:
        description: "GitHub Actions run ID or failed job ID to retry"
        required: true
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: autonomous-workflow-self-healer
  cancel-in-progress: false

jobs:
  heal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Self-heal explicitly selected failed run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          FAILED_RUN_ID: ${{ inputs.failed_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$FAILED_RUN_ID" =~ ^[0-9]+$ ]] || {
            echo "Invalid failed_run_id: $FAILED_RUN_ID"
            exit 1
          }
          RUN_ID="$FAILED_RUN_ID"
          if ! gh run view "$RUN_ID" --repo "$REPOSITORY" >/tmp/run.json 2>/tmp/run.err; then
            echo "Input is not a workflow-run ID; resolving it as a job ID."
            RUN_ID="$(gh api "repos/$REPOSITORY/actions/jobs/$FAILED_RUN_ID" --jq '.run_id')"
          fi
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "Unable to resolve workflow run ID"; exit 1; }
          echo "Resolved workflow run: $RUN_ID"
          gh run rerun "$RUN_ID" --failed --repo "$REPOSITORY"
          echo "Failed jobs requeued for run $RUN_ID."
