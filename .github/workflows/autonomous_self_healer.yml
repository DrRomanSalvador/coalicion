name: Autonomous repository self-healer

on:
  workflow_run:
    types: [completed]

permissions:
  actions: write
  contents: read

concurrency:
  group: autonomous-workflow-self-healer
  cancel-in-progress: false

jobs:
  heal:
    if: ${{ github.event.workflow_run.name != 'Autonomous repository self-healer' && (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Recuperar ejecución fallida
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
          FAILED_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
        shell: bash
        run: |
          set -euo pipefail

          max_attempts=3
          if [ "$RUN_ATTEMPT" -ge "$max_attempts" ]; then
            echo "ERROR: el monitor sigue fallando tras $RUN_ATTEMPT intentos."
            exit 1
          fi

          current_sha="$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          workflow_file="$(gh api "repos/$REPOSITORY/actions/workflows/$WORKFLOW_ID" --jq '.path')"

          if [ "$FAILED_SHA" != "$current_sha" ]; then
            echo "AUTO-HEAL: ejecución antigua; relanzando $workflow_file sobre main=$current_sha."
            gh api --method POST -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2026-03-10" "repos/$REPOSITORY/actions/workflows/$workflow_file/dispatches" -f ref=main
            echo "AUTO-HEAL: nueva ejecución lanzada sobre main."
            exit 0
          fi

          if [ "$RUN_ATTEMPT" -ge "$max_attempts" ]; then
            echo "AUTO-HEAL: ejecución cancelada/fallida sobre el SHA actual y límite alcanzado; no se duplica el monitor."
            exit 0
          fi

          if [ "${{ github.event.workflow_run.conclusion }}" = "cancelled" ]; then
            echo "AUTO-HEAL: ejecución cancelada sobre el SHA actual; no se duplica el monitor."
            exit 0
          fi

          echo "AUTO-HEAL: el fallo pertenece al SHA actual; reintentando solo los jobs fallidos."
          gh api --method POST -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2026-03-10" "repos/$REPOSITORY/actions/runs/$FAILED_RUN_ID/rerun-failed-jobs"
          echo "AUTO-HEAL: jobs fallidos reintentados."
