name: Autonomous repository self-healer

on:
  workflow_dispatch:
    inputs:
      failed_run_id:
        description: "Required: failed workflow run ID or failed job ID to retry"
        required: true
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: autonomous-workflow-self-healer
  cancel-in-progress: false

jobs:
  heal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate and rerun explicitly selected failed run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          FAILED_RUN_ID: ${{ inputs.failed_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          # Accept a numeric run/job ID, or extract one from pasted GitHub Actions logs/URLs.
          if [[ ! "$FAILED_RUN_ID" =~ ^[[:space:]]*[0-9]+[[:space:]]*$ ]]; then
            EXTRACTED_ID="$(printf '%s' "$FAILED_RUN_ID" | grep -Eo 'actions/(runs|jobs)/[0-9]+' | tail -n 1 | grep -Eo '[0-9]+

          RUN_ID=""
          if gh run view "$FAILED_RUN_ID" --repo "$REPOSITORY" --json databaseId,conclusion >/tmp/run.json 2>/tmp/run.err; then
            RUN_ID="$(jq -r '.databaseId // empty' /tmp/run.json)"
            CONCLUSION="$(jq -r '.conclusion // empty' /tmp/run.json)"
            if [[ "$CONCLUSION" != "failure" && "$CONCLUSION" != "cancelled" && "$CONCLUSION" != "timed_out" && "$CONCLUSION" != "startup_failure" ]]; then
              echo "::error::Workflow run $RUN_ID is not in a rerunnable failed state (conclusion=$CONCLUSION)."
              exit 1
            fi
          else
            echo "Input is not a workflow-run ID; resolving it as a job ID."
            RUN_ID="$(gh api "repos/$REPOSITORY/actions/jobs/$FAILED_RUN_ID" --jq '.run_id')"
            [[ "$RUN_ID" =~ ^[0-9]+$ ]] || {
              echo "::error::Could not resolve input as a workflow run or job ID."
              exit 1
            }
            gh run view "$RUN_ID" --repo "$REPOSITORY" --json conclusion --jq '.conclusion' >/tmp/conclusion.txt
            CONCLUSION="$(cat /tmp/conclusion.txt)"
            if [[ "$CONCLUSION" != "failure" && "$CONCLUSION" != "cancelled" && "$CONCLUSION" != "timed_out" && "$CONCLUSION" != "startup_failure" ]]; then
              echo "::error::Resolved workflow run $RUN_ID is not in a rerunnable failed state (conclusion=$CONCLUSION)."
              exit 1
            fi
          fi

          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || {
            echo "::error::Unable to resolve a valid workflow run ID."
            exit 1
          }
          echo "Resolved failed workflow run: $RUN_ID"
          gh run rerun "$RUN_ID" --failed --repo "$REPOSITORY"
          echo "Failed jobs requeued for run $RUN_ID."
 || true)"
            if [[ -z "$EXTRACTED_ID" ]]; then
              EXTRACTED_ID="$(printf '%s' "$FAILED_RUN_ID" | grep -Eio '(workflow[-_ ]run[-_ ]id|failed[-_ ]run[-_ ]id|run_id|job_id)[[:space:]":=]+[0-9]+' | grep -Eo '[0-9]+

          RUN_ID=""
