name: Autonomous repository self-healer

on:
  workflow_dispatch:
    inputs:
      failed_run_id:
        description: "Required for manual repair: one failed workflow run ID, job ID, or Actions URL"
        required: true
        type: string
  schedule:
    # workflow_run requires a static workflow allowlist; poll Actions instead to cover new workflows too.
    - cron: "*/5 * * * *"

permissions:
  actions: write
  contents: read

concurrency:
  # Serialize scheduled sweeps so two runs cannot race to rerun the same failed workflow.
  # Manual repairs remain isolated by their explicit target ID.
  group: autonomous-workflow-self-healer-${{ inputs.failed_run_id || 'scheduled-sweep' }}
  cancel-in-progress: false

jobs:
  heal:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Discover and retry current-main failures (scheduled)
        if: ${{ github.event_name == 'schedule' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
          self_id="$(gh api "repos/$REPOSITORY/actions/workflows/autonomous_self_healer.yml" --jq '.id')"
          # Query runs for the current main SHA directly, then paginate all result pages.
          # Fetching only the newest 100 repository-wide runs can miss eligible failures
          # when other workflows generate a burst of runs.
          runs_json="$(gh api --paginate --slurp "repos/$REPOSITORY/actions/runs?head_sha=$main_sha&per_page=100")"
          mapfile -t candidates < <(
            jq -r --arg sha "$main_sha" --argjson self_id "$self_id" '
              .[]
              | .workflow_runs[]
              | select(.workflow_id != $self_id)
              | select(.head_branch == "main" and .head_sha == $sha)
              | select(.status == "completed" and .run_attempt == 1)
              | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out" or .conclusion == "startup_failure")
              | .id
            ' <<<"$runs_json"
          )
          if [[ "${#candidates[@]}" -eq 0 ]]; then
            echo "No eligible failed workflow runs for current main ($main_sha)."
            exit 0
          fi
          # Bound each sweep; the five-minute schedule drains remaining candidates without retry storms.
          count=0
          for run_id in "${candidates[@]}"; do
            [[ "$count" -lt 5 ]] || break
            run_json="$(gh api "repos/$REPOSITORY/actions/runs/$run_id")"
            status="$(jq -r '.status // empty' <<<"$run_json")"
            conclusion="$(jq -r '.conclusion // empty' <<<"$run_json")"
            run_sha="$(jq -r '.head_sha // empty' <<<"$run_json")"
            [[ "$status" == "completed" && "$run_sha" == "$main_sha" ]] || continue
            case "$conclusion" in
              cancelled)
                gh run rerun "$run_id" --repo "$REPOSITORY"
                ;;
              failure|timed_out|startup_failure)
                gh run rerun "$run_id" --failed --repo "$REPOSITORY"
                ;;
              *) continue ;;
            esac
            echo "Requested recovery for run $run_id ($conclusion, SHA $run_sha)."
            count=$((count + 1))
          done
          echo "Scheduled recovery sweep finished; rerun requests=$count."
      - name: Validate target and rerun failed jobs only
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          INPUT_ID: ${{ inputs.failed_run_id }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            case "$EVENT_CONCLUSION" in
              failure|cancelled|timed_out|startup_failure) ;;
              *) echo "No retry needed for conclusion=$EVENT_CONCLUSION"; exit 0 ;;
            esac
            target_id="$EVENT_RUN_ID"
          else
            raw="$(printf '%s' "$INPUT_ID" | tr -d '[:space:]')"
            if [[ "$raw" =~ ^[0-9]+$ ]]; then
              target_id="$raw"
            else
              mapfile -t ids < <(printf '%s' "$INPUT_ID" | grep -Eo 'actions/(runs|jobs)/[0-9]+' | grep -Eo '[0-9]+' || true)
              if [[ "${#ids[@]}" -eq 1 ]]; then
                target_id="${ids[0]}"
              else
                mapfile -t ids < <(printf '%s' "$INPUT_ID" | grep -Eio '(failed_run_id|workflow_run_id|run_id|job_id)[[:space:]":=]+[0-9]+' | grep -Eo '[0-9]+' || true)
                if [[ "${#ids[@]}" -eq 1 ]]; then
                  target_id="${ids[0]}"
                else
                  echo "::error::Provide one numeric run/job ID or one explicit /actions/runs/ID or /actions/jobs/ID URL; ambiguous logs are rejected."
                  exit 1
                fi
              fi
            fi
          fi

          [[ "$target_id" =~ ^[0-9]+$ ]] || { echo "::error::Invalid target ID."; exit 1; }

          # Resolve runs/jobs through the REST API. Active runs have no conclusion yet.
          run_id=""
          run_json=""
          if run_json="$(gh api "repos/$REPOSITORY/actions/runs/$target_id" 2>/dev/null)"; then
            run_id="$(jq -r '.id // empty' <<<"$run_json")"
          else
            job_json="$(gh api "repos/$REPOSITORY/actions/jobs/$target_id" 2>/dev/null)" || {
              echo "::error::ID $target_id is neither a readable workflow run nor a job in $REPOSITORY."
              exit 1
            }
            run_id="$(jq -r '.run_id // empty' <<<"$job_json")"
            [[ "$run_id" =~ ^[0-9]+$ ]] || { echo "::error::Could not resolve job $target_id to a workflow run."; exit 1; }
            run_json="$(gh api "repos/$REPOSITORY/actions/runs/$run_id")" || {
              echo "::error::Resolved workflow run $run_id cannot be read."
              exit 1
            }
          fi

          [[ "$run_id" =~ ^[0-9]+$ ]] || { echo "::error::Could not resolve a valid workflow run ID."; exit 1; }
          status="$(jq -r '.status // empty' <<<"$run_json")"
          conclusion="$(jq -r '.conclusion // empty' <<<"$run_json")"

          case "$status" in
            queued|in_progress|waiting|requested|pending)
              echo "::error::Workflow run $run_id is still $status (conclusion=${conclusion:-not-set}); wait for it to finish before requesting a rerun."
              exit 1
              ;;
            completed) ;;
            *)
              echo "::error::Workflow run $run_id has unknown status '${status:-not-set}'; refusing to rerun."
              exit 1
              ;;
          esac

          case "$conclusion" in
            failure|cancelled|timed_out|startup_failure) ;;
            *)
              echo "::error::Workflow run $run_id is not rerunnable (conclusion=$conclusion)."
              exit 1
              ;;
          esac

          echo "Validated completed workflow run: $run_id (status=$status, conclusion=$conclusion)"
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            run_head_sha="$(jq -r '.head_sha // empty' <<<"$run_json")"
            current_main_sha="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
            if [[ -z "$run_head_sha" || -z "$current_main_sha" ]]; then
              echo "::error::Could not verify source SHA against current main; refusing automatic retry."
              exit 1
            fi
            if [[ "$run_head_sha" != "$current_main_sha" ]]; then
              echo "::notice::Skipping stale run $run_id ($run_head_sha); current main is $current_main_sha. The newer commit owns validation."
              exit 0
            fi
          fi
          if [[ "$conclusion" == "cancelled" ]]; then
            # Cancelled runs may have no failed jobs, so --failed is not applicable.
            echo "Run was cancelled; requesting a full rerun."
            gh run rerun "$run_id" --repo "$REPOSITORY"
            echo "Requested full rerun of cancelled workflow run $run_id."
          else
            gh run rerun "$run_id" --failed --repo "$REPOSITORY"
            echo "Requested rerun of failed jobs for run $run_id."
          fi
