name: mvp-validation

on:
  push:
    branches: [main]
    paths:
      - "src/web/**"
      - "src/email/**"
      - "src/pipeline/**"
      - "tests/test_mvp_e2e.py"
      - "tests/test_data_collection.py"
      - "src/data.py"
      - "tests/test_full_pipeline.py"
      - "data/surveys/current_2026/**"
      - "scripts/materialize_current_surveys.py"
      - "api.py"
      - "requirements.txt"
      - "requirements.lock"
      - "render.yaml"
      - ".github/workflows/mvp-validation.yml"
  workflow_dispatch:

concurrency:
  group: mvp-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.lock
      - name: Compile MVP modules
        run: python -m compileall -q src/web src/email src/pipeline api.py
      - name: MVP tests
        run: python -m pytest -q tests/test_mvp_e2e.py tests/test_data_collection.py tests/test_full_pipeline.py
      - name: Survey materialization
        run: python scripts/materialize_current_surveys.py
      - name: Newsletter materialization
        run: python -m src.email.newsletter
      - uses: actions/upload-artifact@v4
        with:
          name: mvp-validation-evidence
          path: |
            artifacts/newsletter/latest.html
            artifacts/surveys/current_2026_normalized.json
