name: COALICIÓN — Colmena ligera

on:
  workflow_dispatch:
  repository_dispatch:
    types: [poll_monitor_completed]
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/colmena_atomic_swarm.yml"
      - ".github/workflows/colmena_ollama_agents.yml"
      - ".github/workflows/colmena_ollama_assign.yml"
      - "scripts/colmena_queen.py"
      - "scripts/colmena_agent_ollama.py"
      - "src/colmena_resume.py"
      - "src/reproducibility_contract.py"
      - "src/error_registry.py"
      - "src/coalition.py"
      - "src/decision.py"
      - "src/electoral.py"
      - "scripts/demo_e2e.py"
      - "tests/test_colmena_ollama.py"
      - "tests/test_reproducibility_contract.py"
      - "tests/test_error_registry.py"
      - "tests/test_colmena_resume.py"
      - "tests/test_product_contract.py"
      - "tests/test_resume_error_registry_consistency.py"
      - "tests/test_demo_e2e.py"
      - "tests/test_coalition.py"
      - "tests/test_neutral_audit.py"
  push:
    branches: [main]
    paths:
      - "docs/COLMENA_STATE.json"
      - "src/colmena_resume.py"
      - "src/reproducibility_contract.py"
      - "src/error_registry.py"
      - "src/coalition.py"
      - "src/decision.py"
      - "src/electoral.py"
      - "scripts/demo_e2e.py"
      - "tests/test_reproducibility_contract.py"
      - "tests/test_error_registry.py"
      - "tests/test_colmena_resume.py"
      - "tests/test_product_contract.py"
      - "tests/test_resume_error_registry_consistency.py"
      - "tests/test_demo_e2e.py"
      - "tests/test_coalition.py"
      - "tests/test_neutral_audit.py"
      - ".github/workflows/colmena_atomic_swarm.yml"

permissions:
  contents: read

concurrency:
  group: colmena-light-main
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'repository_dispatch' || github.actor != 'github-actions[bot]'
    name: Checkpoint + contratos + demo E2E
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal test dependencies
        run: python -m pip install --disable-pip-version-check pytest numpy
      - name: Validate persistent state (fail-closed)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("docs/COLMENA_STATE.json")
          if not p.is_file():
              raise SystemExit("FAIL_CLOSED: docs/COLMENA_STATE.json missing")
          state = json.loads(p.read_text(encoding="utf-8"))
          assert state.get("schema") == "COLMENA_STATE_V1", "invalid state schema"
          assert state.get("fail_closed") is True, "fail_closed must be true"
          assert state.get("status") in {"SELLABLE_BETA", "OPERATIONAL_BETA"}, "unexpected product status"
          assert isinstance(state.get("next_single_action"), str) and state["next_single_action"].strip(), "missing next action"
          print("COLMENA_STATE=PASS")
          PY
      - name: Resume from canonical checkpoint
        run: python -m src.colmena_resume
      - name: Verify reproducibility contract
        run: python -m src.reproducibility_contract
      - name: Run core, coalition and demo regression tests
        run: >-
          python -m pytest -q
          tests/test_reproducibility_contract.py
          tests/test_error_registry.py
          tests/test_colmena_resume.py
          tests/test_product_contract.py
          tests/test_resume_error_registry_consistency.py
          tests/test_demo_e2e.py
          tests/test_coalition.py
          tests/test_neutral_audit.py
      - name: Execute end-to-end demo
        run: python scripts/demo_e2e.py
      - name: Crear evidencia inmutable de validación
        if: success()
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          TESTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/colmena/checkpoints
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          evidence = {
              "schema": "COLMENA_LIGHT_CHECKPOINT_V1",
              "status": "PASS",
              "workflow": ".github/workflows/colmena_atomic_swarm.yml",
              "tested_commit": os.environ["TESTED_SHA"],
              "run_id": os.environ["RUN_ID"],
              "run_attempt": os.environ["RUN_ATTEMPT"],
              "checks": [
                  "state_fail_closed",
                  "resume_gate",
                  "reproducibility_contract",
                  "core_and_coalition_regression",
                  "demo_e2e"
              ],
              "timestamp_utc": datetime.now(timezone.utc).isoformat(),
              "persistence": "github_actions_artifact",
              "main_modified": False
          }
          path = Path("artifacts/colmena/checkpoints/colmena-light-checkpoint.json")
          path.write_text(json.dumps(evidence, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(evidence, ensure_ascii=False, sort_keys=True))
          PY
      - name: Persistir evidencia como artefacto recuperable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: colmena-light-checkpoint-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: artifacts/colmena/checkpoints/colmena-light-checkpoint.json
          if-no-files-found: ignore
          retention-days: 90
