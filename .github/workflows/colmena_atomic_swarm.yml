name: COALICIÓN — Colmena ligera

on:
  workflow_dispatch:
  repository_dispatch:
    types: [poll_monitor_completed]
  push:
    branches: [main]
    paths:
      - "docs/COLMENA_STATE.json"
      - "src/colmena_resume.py"
      - "src/reproducibility_contract.py"
      - "src/error_registry.py"
      - "src/coalition.py"
      - "src/decision.py"
      - "src/electoral.py"
      - "scripts/demo_e2e.py"
      - "tests/test_reproducibility_contract.py"
      - "tests/test_error_registry.py"
      - "tests/test_colmena_resume.py"
      - "tests/test_product_contract.py"
      - "tests/test_resume_error_registry_consistency.py"
      - "tests/test_demo_e2e.py"
      - "tests/test_coalition.py"
      - "tests/test_neutral_audit.py"
      - ".github/workflows/colmena_atomic_swarm.yml"

permissions:
  actions: read
  contents: read

concurrency:
  group: colmena-light-main
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'repository_dispatch' || github.actor != 'github-actions[bot]'
    name: Checkpoint + contratos + demo E2E
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Locate latest successful Colmena checkpoint artifact
        id: latest_checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          artifacts_json="$(gh api --paginate --slurp "repos/$REPOSITORY/actions/artifacts?per_page=100")"
          latest_run_id="$(jq -r --arg current "$GITHUB_RUN_ID" '
            [
              .[] | .artifacts[]?
              | select(.name == "colmena-checkpoint-state" and .expired == false)
              | select(.workflow_run.head_branch == "main")
              | select((.workflow_run.id | tostring) != $current)
              | {run_id: .workflow_run.id, created_at: .created_at}
            ]
            | sort_by(.created_at) | last | .run_id // empty
          ' <<<"$artifacts_json")"
          echo "run_id=$latest_run_id" >> "$GITHUB_OUTPUT"

      - name: Download latest successful Colmena checkpoint
        id: download_checkpoint
        if: steps.latest_checkpoint.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: colmena-checkpoint-state
          path: /tmp/colmena-checkpoint
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.latest_checkpoint.outputs.run_id }}

      - name: Restore checkpoint state for validation
        if: steps.download_checkpoint.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/colmena-checkpoint/COLMENA_STATE.json || {
            echo "::error::Checkpoint artifact exists but COLMENA_STATE.json is missing."
            exit 1
          }
          cp /tmp/colmena-checkpoint/COLMENA_STATE.json docs/COLMENA_STATE.json
          cp docs/COLMENA_STATE.json /tmp/colmena-previous-state.json

      - name: Save repository checkpoint as initial fallback
        if: steps.download_checkpoint.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          cp docs/COLMENA_STATE.json /tmp/colmena-previous-state.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal test dependencies
        run: python -m pip install --disable-pip-version-check pytest numpy
      - name: Validate persistent state (fail-closed)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("docs/COLMENA_STATE.json")
          if not p.is_file():
              raise SystemExit("FAIL_CLOSED: docs/COLMENA_STATE.json missing")
          state = json.loads(p.read_text(encoding="utf-8"))
          assert state.get("schema") == "COLMENA_STATE_V1", "invalid state schema"
          assert state.get("fail_closed") is True, "fail_closed must be true"
          assert state.get("status") in {"SELLABLE_BETA", "OPERATIONAL_BETA"}, "unexpected product status"
          assert isinstance(state.get("next_single_action"), str) and state["next_single_action"].strip(), "missing next action"
          print("COLMENA_STATE=PASS")
          PY
      - name: Resume from canonical checkpoint
        run: python -m src.colmena_resume
      - name: Verify reproducibility contract
        run: python -m src.reproducibility_contract
      - name: Run core, coalition and demo regression tests
        run: >-
          python -m pytest -q
          tests/test_reproducibility_contract.py
          tests/test_error_registry.py
          tests/test_colmena_resume.py
          tests/test_product_contract.py
          tests/test_resume_error_registry_consistency.py
          tests/test_demo_e2e.py
          tests/test_coalition.py
          tests/test_neutral_audit.py
      - name: Execute end-to-end demo
        run: python scripts/demo_e2e.py
      - name: Revalidate current main and prepare checkpoint with race recovery
        if: success()
        id: checkpoint
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/colmena-previous-state.json docs/COLMENA_STATE.json

            python -m src.colmena_resume
            python -m src.reproducibility_contract
            python -m pytest -q tests/test_reproducibility_contract.py tests/test_error_registry.py tests/test_colmena_resume.py tests/test_product_contract.py tests/test_resume_error_registry_consistency.py tests/test_demo_e2e.py tests/test_coalition.py tests/test_neutral_audit.py
            python scripts/demo_e2e.py

            COMMIT_SHA="$(git rev-parse HEAD)"
            export COMMIT_SHA
            set +e
            python scripts/colmena_checkpoint.py
            checkpoint_rc=$?
            set -e
            if [ "$checkpoint_rc" -eq 3 ]; then
              echo "::notice::main changed during checkpoint validation; retrying against latest main."
              sleep "$((attempt * 3))"
              continue
            fi
            if [ "$checkpoint_rc" -ne 0 ]; then
              exit "$checkpoint_rc"
            fi

            git add docs/COLMENA_STATE.json
            if git diff --cached --quiet; then
              echo "::notice::Checkpoint is unchanged; retaining the validated current state as an artifact."
              echo "prepared=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -m "chore(colmena): prepare validated lightweight checkpoint"
            echo "prepared=true" >> "$GITHUB_OUTPUT"
            echo "Checkpoint prepared after revalidating main (attempt $attempt); no protected-branch push attempted."
            exit 0
          done
          echo "::error::Could not validate a checkpoint against a stable current-main revision after three attempts."
          exit 1

      - name: Upload validated Colmena checkpoint artifact
        if: success() && steps.checkpoint.outputs.prepared == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: colmena-checkpoint-state
          path: docs/COLMENA_STATE.json
          if-no-files-found: error
          retention-days: 90
