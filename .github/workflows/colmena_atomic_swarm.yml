name: COALICION — Queen Atomic Swarm

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/COLMENA_MISSION_CONTROL.json"
      - "scripts/colmena_queen.py"
      - "scripts/colmena_worker.py"
      - "scripts/colmena_local_ai.mjs"
      - ".github/workflows/colmena_atomic_swarm.yml"

permissions:
  contents: read

concurrency:
  group: colmena-atomic-swarm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  swarm:
    name: "👑 Queen + 179 missions / batches of 5"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore local AI cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            .cache
          key: ${{ runner.os }}-colmena-local-ai-v3-transformersjs-3.8.1-smollm2

      - name: Prepare local AI runtime
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund @huggingface/transformers@3.8.1

      - name: Save local AI cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            .cache
          key: ${{ runner.os }}-colmena-local-ai-v3-transformersjs-3.8.1-smollm2

      - name: Real local AI warm and smoke test
        run: |
          set -euo pipefail
          node scripts/colmena_local_ai.mjs --warm
          printf '%s\n' '{"agent_id":"agent-SMOKE","mission_id":"SMOKE","mission":"runtime smoke test","scope":"Generate one independent response."}' |
            node scripts/colmena_local_ai.mjs > smoke.json
          python - <<'PY'
          import json
          d=json.loads(open("smoke.json",encoding="utf-8").read().splitlines()[-1])
          assert isinstance(d.get("content"), str) and d["content"].strip()
          print("REAL_LOCAL_AI_SMOKE=PASS")
          PY

      - name: 👑 Queen creates plan and approvals
        env:
          COLMENA_AGENT_PROVIDER: github-actions-local-transformers-js
          COLMENA_AI_AGENT_EXECUTION: "true"
          COLMENA_AI_DEVICE: "cpu"
          COLMENA_AGENT_MODEL: onnx-community/SmolLM2-135M-Instruct-ONNX-MHA:q4f16
          COLMENA_AGENT_EXECUTION_ID: ${{ github.run_id }}-${{ github.run_attempt }}-queen
        run: |
          set -euo pipefail
          mkdir -p artifacts/colmena
          python scripts/colmena_queen.py             --ref "$GITHUB_SHA"             --output artifacts/colmena/queen_approval.json
          python - <<'PY'
          import json
          p=json.load(open("artifacts/colmena/queen_approval.json",encoding="utf-8"))
          assert len(p["missions"]) == 179
          assert len(p["batches"]) == 36
          assert all(len(b["mission_ids"]) <= 5 for b in p["batches"])
          print("QUEEN_PLAN=PASS", "missions=179", "batches=36")
          PY

      - name: Start persistent AI runtime
        env:
          COLMENA_AI_PORT: "8765"
          COLMENA_AI_DEVICE: "cpu"
        run: |
          set -euo pipefail
          node scripts/colmena_local_ai.mjs --server > artifacts/colmena/ai_runtime.log 2>&1 &
          echo $! > artifacts/colmena/ai_runtime.pid
          python - <<'PY'
          import time, urllib.request
          for _ in range(90):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8765/health", timeout=3) as r:
                      if r.status == 200:
                          print("AI_RUNTIME_SERVER=PASS")
                          break
              except Exception:
                  time.sleep(2)
          else:
              raise SystemExit("FAIL_CLOSED: persistent AI runtime did not become healthy")
          PY

      - name: 👑 Queen dispatches and supervises batches of 5
        env:
          COLMENA_AGENT_PROVIDER: github-actions-local-transformers-js
          COLMENA_AI_AGENT_EXECUTION: "true"
          COLMENA_AI_DEVICE: "cpu"
          COLMENA_AGENT_MODEL: onnx-community/SmolLM2-135M-Instruct-ONNX-MHA:q4f16
          COLMENA_AGENT_EXECUTION_ID: ${{ github.run_id }}-${{ github.run_attempt }}-queen
          COLMENA_AI_SERVER_URL: http://127.0.0.1:8765
        run: |
          set +e
          mkdir -p artifacts/colmena/workers
          python scripts/colmena_queen.py             --ref "$GITHUB_SHA"             --output artifacts/colmena/queen_approval.json             --supervise             --workers-dir artifacts/colmena/workers             --state artifacts/colmena/queen_runtime_state.json
          rc=$?
          kill "$(cat artifacts/colmena/ai_runtime.pid)" 2>/dev/null || true
          exit "$rc"

      - name: 👑 Queen reconciles all 179 evidences fail-closed
        if: always()
        run: |
          set +e
          python - <<'PY'
          import json, sys
          from pathlib import Path

          root=Path("artifacts/colmena")
          approval=json.loads((root/"queen_approval.json").read_text(encoding="utf-8"))
          expected={m["id"]:m for m in approval["missions"]}
          files=sorted((root/"workers").glob("worker_*.json"))
          rows=[json.loads(p.read_text(encoding="utf-8")) for p in files]
          observed={r.get("mission_id"):r for r in rows}

          exact_ids=(len(rows)==179 and len(observed)==179 and set(observed)==set(expected))
          valid=exact_ids
          for mid,m in expected.items():
              r=observed.get(mid)
              if not r:
                  valid=False
                  continue
              rt=r.get("agent_runtime",{})
              valid = valid and (
                  r.get("agent_id")==m["agent_id"] and
                  r.get("title")==m["title"] and
                  r.get("ref")==m["ref"] and
                  r.get("queen_approval")==m["approval"] and
                  r.get("status")=="PASS" and
                  r.get("runtime_status")=="PASS" and
                  rt.get("independent") is True and
                  rt.get("ai_execution") is True and
                  bool(rt.get("execution_id")) and
                  isinstance(r.get("ai_inference"),dict)
              )

          state=json.loads((root/"queen_runtime_state.json").read_text(encoding="utf-8")) if (root/"queen_runtime_state.json").exists() else {}
          ok=bool(valid and state.get("status")=="PASS" and state.get("completed")==179 and state.get("failed")==0 and state.get("blocked")==0 and state.get("batches_completed")==36)

          payload={
              "schema":"COLMENA_RECONCILIATION_V6",
              "expected":179,
              "observed":len(rows),
              "unique_missions":len(observed),
              "all_179_ai_runtime_pass":ok,
              "all_179_missions_pass":ok,
              "fail_closed":True,
              "status":"PASS" if ok else "BLOCKED"
          }
          (root/"reconciliation.json").write_text(json.dumps(payload,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(payload,ensure_ascii=False))
          sys.exit(0 if ok else 1)
          PY

      - name: Upload complete Queen evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: colmena-swarm-complete
          path: artifacts/colmena/
          if-no-files-found: error
          retention-days: 30
