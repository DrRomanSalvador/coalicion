name: COALICIÓN — Colmena ligera

on:
  workflow_dispatch:
  repository_dispatch:
    types: [poll_monitor_completed]
  push:
    branches: [main]
    paths:
      - "docs/COLMENA_STATE.json"
      - "src/colmena_resume.py"
      - "src/reproducibility_contract.py"
      - "src/error_registry.py"
      - "src/coalition.py"
      - "src/decision.py"
      - "src/electoral.py"
      - "scripts/demo_e2e.py"
      - "tests/test_reproducibility_contract.py"
      - "tests/test_error_registry.py"
      - "tests/test_colmena_resume.py"
      - "tests/test_product_contract.py"
      - "tests/test_resume_error_registry_consistency.py"
      - "tests/test_demo_e2e.py"
      - "tests/test_coalition.py"
      - "tests/test_neutral_audit.py"
      - ".github/workflows/colmena_atomic_swarm.yml"

permissions:
  contents: write

concurrency:
  group: colmena-light-main
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'repository_dispatch' || github.actor != 'github-actions[bot]'
    name: Checkpoint + contratos + demo E2E
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal test dependencies
        run: python -m pip install --disable-pip-version-check pytest numpy
      - name: Validate persistent state (fail-closed)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("docs/COLMENA_STATE.json")
          if not p.is_file():
              raise SystemExit("FAIL_CLOSED: docs/COLMENA_STATE.json missing")
          state = json.loads(p.read_text(encoding="utf-8"))
          assert state.get("schema") == "COLMENA_STATE_V1", "invalid state schema"
          assert state.get("fail_closed") is True, "fail_closed must be true"
          assert state.get("status") in {"SELLABLE_BETA", "OPERATIONAL_BETA"}, "unexpected product status"
          assert isinstance(state.get("next_single_action"), str) and state["next_single_action"].strip(), "missing next action"
          print("COLMENA_STATE=PASS")
          PY
      - name: Resume from canonical checkpoint
        run: python -m src.colmena_resume
      - name: Verify reproducibility contract
        run: python -m src.reproducibility_contract
      - name: Run core, coalition and demo regression tests
        run: >-
          python -m pytest -q
          tests/test_reproducibility_contract.py
          tests/test_error_registry.py
          tests/test_colmena_resume.py
          tests/test_product_contract.py
          tests/test_resume_error_registry_consistency.py
          tests/test_demo_e2e.py
          tests/test_coalition.py
          tests/test_neutral_audit.py
      - name: Execute end-to-end demo
        run: python scripts/demo_e2e.py
      - name: Revalidate current main and persist checkpoint with race recovery
        if: success()
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            python - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path("docs/COLMENA_STATE.json").read_text(encoding="utf-8"))
          assert state.get("schema") == "COLMENA_STATE_V1"
          assert state.get("fail_closed") is True
          assert state.get("status") in {"SELLABLE_BETA", "OPERATIONAL_BETA"}
          assert isinstance(state.get("next_single_action"), str) and state["next_single_action"].strip()
          PY
            python -m src.colmena_resume
            python -m src.reproducibility_contract
            python -m pytest -q tests/test_reproducibility_contract.py tests/test_error_registry.py tests/test_colmena_resume.py tests/test_product_contract.py tests/test_resume_error_registry_consistency.py tests/test_demo_e2e.py tests/test_coalition.py tests/test_neutral_audit.py
            python scripts/demo_e2e.py

            export COMMIT_SHA="$(git rev-parse HEAD)"
            set +e
            python scripts/colmena_checkpoint.py
            checkpoint_rc=$?
            set -e
            if [ "$checkpoint_rc" -eq 3 ]; then
              echo "::notice::main changed during checkpoint validation; retrying against latest main."
              sleep "$((attempt * 3))"
              continue
            fi
            if [ "$checkpoint_rc" -ne 0 ]; then
              exit "$checkpoint_rc"
            fi
            git add docs/COLMENA_STATE.json
            git commit -m "chore(colmena): persist lightweight validation checkpoint"

            if git push origin HEAD:main; then
              echo "Checkpoint persisted after revalidating main (attempt $attempt)."
              exit 0
            fi
            echo "Concurrent main update; revalidating latest main (attempt $attempt)." >&2
            sleep "$((attempt * 3))"
          done

          echo "::error::Could not persist a checkpoint after three fresh-main validation attempts."
          exit 1
