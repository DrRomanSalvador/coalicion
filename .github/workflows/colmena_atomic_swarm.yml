name: COALICION — Queen Atomic Swarm

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/COLMENA_MISSION_CONTROL.json"
      - "scripts/colmena_queen.py"
      - "scripts/colmena_worker.py"
      - ".github/workflows/colmena_atomic_swarm.yml"

permissions:
  contents: read

concurrency:
  group: colmena-atomic-swarm-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  swarm:
    name: "👑 Queen + 179 isolated workers"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare local AI runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund @huggingface/transformers@3.8.1
      - name: Queen plan and approvals
        run: |
          set -euo pipefail
          mkdir -p artifacts/colmena
          python scripts/colmena_queen.py --ref "$GITHUB_SHA" --output artifacts/colmena/queen_approval.json
          python scripts/queen_dispatcher.py --validate
          test "$(python -c 'import json; print(len(json.load(open("artifacts/colmena/queen_approval.json"))["missions"]))')" = "179"
      - name: Execute all 179 workers
        env:
          COLMENA_AGENT_PROVIDER: "github-actions-local"
          COLMENA_AGENT_EXECUTION_ID: "${{ github.run_id }}-${{ github.run_attempt }}"
          COLMENA_AI_AGENT_EXECUTION: "true"
          COLMENA_AI_DEVICE: "cpu"
        run: |
          set -uo pipefail
          mkdir -p artifacts/colmena/workers
          rc=0
          python - <<'PY'
          import json, subprocess, os
          d=json.load(open("artifacts/colmena/queen_approval.json",encoding="utf-8"))
          for m in d["missions"]:
              out=f"artifacts/colmena/workers/worker_{m['index']:04d}.json"
              p=subprocess.run([
                  "python","scripts/colmena_worker.py",
                  "--mission-id",m["id"],
                  "--approval","artifacts/colmena/queen_approval.json",
                  "--ref",os.environ["GITHUB_SHA"],
                  "--out",out
              ])
              if p.returncode: globals()["rc"]=1
          raise SystemExit(rc)
          PY
      - name: Reconcile 179 evidences fail-closed
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          files=sorted(Path("artifacts/colmena/workers").glob("worker_*.json"))
          rows=[json.loads(p.read_text()) for p in files]
          ids={r["mission_id"] for r in rows}
          expected=json.load(open("artifacts/colmena/queen_approval.json"))["missions"]
          expected_ids={m["id"] for m in expected}
          ok=len(rows)==179 and ids==expected_ids and all(r.get("status")=="PASS" and r.get("agent_runtime",{}).get("independent") and r.get("runtime_status")=="PASS" and r.get("ai_execution") is not False for r in rows)
          payload={"schema":"COLMENA_RECONCILIATION_V4","expected":179,"observed":len(rows),"unique_missions":len(ids),"all_179_ai_runtime_pass":ok,"all_179_missions_pass":ok,"fail_closed":True,"status":"PASS" if ok else "BLOCKED"}
          Path("artifacts/colmena/reconciliation.json").write_text(json.dumps(payload,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps(payload,ensure_ascii=False))
          sys.exit(0 if ok else 1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: colmena-swarm-complete
          path: artifacts/colmena/
          if-no-files-found: error
