name: Telegram Mini App
on:
  push:
    branches: [main]
    paths:
      - "web/telegram/**"
      - ".github/workflows/telegram_miniapp.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: telegram-miniapp-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Preflight GitHub Pages configuration
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ADMIN_TOKEN: ${{ secrets.PAGES_ADMIN_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh api "repos/$REPOSITORY/pages" >/dev/null 2>&1; then
            echo "GitHub Pages is already configured."
          elif [[ -n "$PAGES_ADMIN_TOKEN" ]]; then
            echo "GitHub Pages is absent; PAGES_ADMIN_TOKEN is available to enable it."
          else
            echo "::error::GitHub Pages is not enabled and GITHUB_TOKEN cannot create the Pages site. Enable Pages in repository Settings, or add a PAGES_ADMIN_TOKEN secret with repository administration/Pages permissions."
            exit 1
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
          token: ${{ secrets.PAGES_ADMIN_TOKEN || github.token }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/telegram
      - id: deployment
        uses: actions/deploy-pages@v4
