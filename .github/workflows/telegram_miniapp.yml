name: Telegram Mini App
on:
  push:
    branches: [main]
    paths:
      - "web/telegram/**"
      - ".github/workflows/telegram_miniapp.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: telegram-miniapp-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      deploy_enabled: ${{ steps.preflight.outputs.deploy_enabled }}
    steps:
      - uses: actions/checkout@v4
      - name: Preflight GitHub Pages configuration
        id: preflight
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PAGES_ADMIN_TOKEN || github.token }}
          PAGES_ADMIN_TOKEN: ${{ secrets.PAGES_ADMIN_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh api "repos/$REPOSITORY/pages" >/dev/null 2>&1; then
            echo "GitHub Pages is configured."
            echo "deploy_enabled=true" >> "$GITHUB_OUTPUT"
          elif [[ -n "$PAGES_ADMIN_TOKEN" ]]; then
            echo "GitHub Pages is absent; the admin token will attempt to enable it."
            echo "deploy_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Mini App deployment skipped: GitHub Pages is not enabled and this workflow has no repository-administration token. The workflow cannot enable Pages using GITHUB_TOKEN. Enable Pages once in Settings > Pages with Source = GitHub Actions, then rerun this workflow. No deployment was attempted."
            echo "deploy_enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure GitHub Pages
        if: steps.preflight.outputs.deploy_enabled == 'true'
        uses: actions/configure-pages@v5
        with:
          enablement: true
          token: ${{ secrets.PAGES_ADMIN_TOKEN || github.token }}
      - name: Upload Mini App
        if: steps.preflight.outputs.deploy_enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/telegram
      - name: Deploy Mini App
        if: steps.preflight.outputs.deploy_enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
