name: Telegram Mini App
on:
  push:
    branches: [main]
    paths:
      - "web/telegram/**"
      - ".github/workflows/telegram_miniapp.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: telegram-miniapp-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Enable Pages on first deployment instead of failing with 404 when the site is not yet configured.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/telegram
      - id: deployment
        uses: actions/deploy-pages@v4
