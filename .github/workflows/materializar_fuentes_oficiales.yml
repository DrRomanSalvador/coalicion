name: Materializar fuentes oficiales
# Canonical ingestion: immutable snapshots + live primary indexes + audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install --upgrade pip certifi openpyxl pandas

      - name: Búsqueda exhaustiva multi-fuente
        run: |
          python scripts/exhaustive_data_acquisition.py --search --resolve

      - name: Ejecutar motor robusto
        continue-on-error: true
        run: |
          chmod +x scripts/run_ai_electoral_engine_robust.sh
          MAX_ATTEMPTS=5 RETRY_DELAY=10 bash scripts/run_ai_electoral_engine_robust.sh

      - name: Registrar hashes de fuentes binarias
        run: |
          python - <<'PY'
          import hashlib, json
          from datetime import datetime, timezone
          from pathlib import Path

          def manifest(source_id, authority, url, path, catalog_url):
              p = Path(path)
              data = p.read_bytes()
              return {
                  "source_id": source_id,
                  "authority": authority,
                  "source_url": url,
                  "catalog_url": catalog_url,
                  "retrieved_at": datetime.now(timezone.utc).isoformat(),
                  "path": str(p),
                  "size_bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest()
              }

          Path("data/manifests").mkdir(parents=True, exist_ok=True)
          specs = [
              ("INTERIOR_RESULTADOS_CONGRESO", "Ministerio del Interior",
               "https://descargas.interior.gob.es/datasets/resultados_electorales/Elecciones-Congreso.xlsx",
               "data/raw/official/Elecciones-Congreso.xlsx",
               "https://datos.gob.es/es/catalogo/e00003801-resultados-electorales"),
              ("INE_PADRON_MUNICIPAL", "Instituto Nacional de Estadística",
               "https://www.ine.es/pob_xls/pobmun.zip",
               "data/raw/official/ine/pobmun.zip",
               "https://www.ine.es/dynt3/inebase/es/index.htm?padre=525"),
          ]
          for args in specs:
              if not Path(args[3]).is_file():
                  print("MISSING_SOURCE_SNAPSHOT", args[0], args[3])
                  continue
              payload = manifest(*args)
              Path("data/manifests", payload["source_id"] + ".json").write_text(
                  json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8"
              )
          PY

      - name: Inspeccionar y normalizar Interior si existe
        run: |
          if [ -s data/raw/official/Elecciones-Congreso.xlsx ]; then
            python cli.py inspect data/raw/official/Elecciones-Congreso.xlsx || true
            python cli.py normalize data/raw/official/Elecciones-Congreso.xlsx --output data/processed/congress_rows.json || true
          else
            echo "Interior no materializado; se conserva evidencia de fallo."
          fi

      - name: Registrar catálogo CIS vivo (no bloqueante)
        continue-on-error: true
        run: |
          mkdir -p data/live
          python - <<'PY'
          import hashlib, json, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          url = "https://www.cis.es/es/estudios/catalogo?catalogo=estudio"
          req = urllib.request.Request(url, headers={"User-Agent": "REINA-SEEC/1.0"})
          raw = None
          last = None
          for attempt in range(1, 4):
              try:
                  raw = urllib.request.urlopen(req, timeout=60).read()
                  if not raw:
                      raise RuntimeError("empty_response")
                  break
              except Exception as exc:
                  last = exc
                  if attempt < 3:
                      import time; time.sleep(2 ** attempt)
          if raw is None:
              raise last
          Path("data/live/CIS_CATALOGO_ESTUDIOS.html").write_bytes(raw)
          Path("data/live/CIS_CATALOGO_ESTUDIOS.json").write_text(
              json.dumps({
                  "source_id": "CIS_CATALOGO_ESTUDIOS",
                  "authority": "Centro de Investigaciones Sociológicas",
                  "source_url": url,
                  "retrieved_at": datetime.now(timezone.utc).isoformat(),
                  "sha256": hashlib.sha256(raw).hexdigest(),
                  "size_bytes": len(raw),
                  "mode": "LIVE_INDEX_WITH_SNAPSHOT"
              }, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          PY

      - name: Verificar matriz canónica si fue generada
        continue-on-error: true
        run: |
          if [ -s artifacts/data/election_2023_canonical.json ]; then
            python scripts/verify_canonical_2023.py
          else
            echo "No hay matriz canónica; el motor quedó fail-closed."
          fi

      - name: Commit materialización, auditoría y matriz
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/official data/raw/exhaustive data/processed data/manifests data/live             artifacts/data artifacts/audit artifacts/exhaustive_search_2023.json artifacts/execution_log.md scripts/verify_canonical_2023.py
          if git diff --cached --quiet; then
            echo "NO_CHANGES"
          else
            git commit -m "data: materialize and audit official electoral sources"
            git push
          fi

      - name: Gate final fail-closed
        if: always()
        run: |
          if [ ! -s artifacts/data/election_2023_canonical.json ] || [ ! -s artifacts/audit/certificate_2023.json ]; then
            echo "FAIL_CLOSED: no existe matriz/certificado oficial completo."
            exit 1
          fi
          python scripts/verify_canonical_2023.py
