name: COALICIÓN — Asignación persistente de misiones HF

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Número de misiones que la Reina puede asignar (1–5)"
        required: true
        default: "5"
        type: string

permissions:
  contents: write

concurrency:
  group: colmena-hf-${{ github.ref }}
  cancel-in-progress: false

jobs:
  assign-batch:
    name: Asignar y persistir un lote, sin ejecutar agentes
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar y asignar exclusivamente mediante la Reina
        env:
          BATCH_SIZE: ${{ inputs.batch_size }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          try:
              size = int(os.environ["BATCH_SIZE"])
          except (TypeError, ValueError):
              raise SystemExit("batch_size debe ser un entero entre 1 y 5.")
          if not 1 <= size <= 5:
              raise SystemExit("Fail-closed: batch_size debe estar entre 1 y 5.")
          PY
          before="$(python -c 'import json; d=json.load(open("docs/COLMENA_MISSION_CONTROL.json", encoding="utf-8")); print(sum(m.get("status") == "ASSIGNED" for m in d["missions"]))')"
          python scripts/colmena_queen_hf.py --assign "$BATCH_SIZE"
          after="$(python -c 'import json; d=json.load(open("docs/COLMENA_MISSION_CONTROL.json", encoding="utf-8")); print(sum(m.get("status") == "ASSIGNED" for m in d["missions"]))')"
          delta=$((after - before))
          if [ "$delta" -lt 1 ] || [ "$delta" -gt "$BATCH_SIZE" ]; then
            echo "Fail-closed: la Reina no asignó un lote válido (delta=$delta)." >&2
            exit 1
          fi
          echo "Asignación validada: $delta misión(es). No se ha invocado Hugging Face."
      - name: Persistir asignación con reintentos seguros
        env:
          BATCH_SIZE: ${{ inputs.batch_size }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "coalicion-colmena[bot]"
          git config user.email "coalicion-colmena[bot]@users.noreply.github.com"
          git add docs/COLMENA_MISSION_CONTROL.json
          if git diff --cached --quiet; then
            echo "No hay asignaciones nuevas para persistir."
            exit 0
          fi
          git commit -m "Persist Queen-approved Colmena HF mission assignment"
          branch="${GITHUB_REF_NAME}"
          for attempt in 1 2 3 4 5; do
            git fetch origin "$branch"
            if git merge-base --is-ancestor HEAD "origin/$branch"; then
              echo "Queen assignment commit is already present on $branch."
              exit 0
            fi
            if git rebase "origin/$branch"; then
              if git push origin "HEAD:$branch"; then
                echo "Queen assignment persisted (attempt $attempt)."
                exit 0
              fi
            else
              git rebase --abort
              echo "::error::Mission control changed concurrently; assignment was not overwritten. Re-run assignment from fresh mission control."
              exit 1
            fi
            echo "Concurrent branch update; retrying assignment persistence ($attempt/5)." >&2
            sleep "$((attempt * 3))"
          done
          echo "::error::Unable to persist Queen assignment after 5 retries."
          exit 1
