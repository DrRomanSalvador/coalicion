name: Electoral intelligence radar

on:
  workflow_dispatch:
  push:
    paths:
      - "src/electoral_intelligence.py"
      - "tests/test_electoral_intelligence.py"
      - "config/electoral_alerts.json"
      - "scripts/notify_webhook.py"
      - ".github/workflows/electoral_intelligence.yml"

permissions:
  contents: read

jobs:
  radar-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Compile radar and notifier
        run: python -m py_compile src/electoral_intelligence.py scripts/notify_webhook.py
      - name: Test electoral intelligence
        run: python -m pytest -q tests/test_electoral_intelligence.py tests/test_rapid_decision_center.py tests/test_marginality.py tests/test_projection_suite.py tests/test_telegram_notifier.py
