name: Electoral intelligence radar

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    paths:
      - "src/electoral_intelligence.py"
      - "src/electoral_radar_adapter.py"
      - "src/rapid_decision_center.py"
      - "src/projection_suite.py"
      - "src/electoral.py"
      - "src/marginality.py"
      - "src/coalition.py"
      - "src/uncertainty.py"
      - "scripts/electoral_radar.py"
      - "scripts/build_electoral_decision_snapshot.py"
      - "scripts/survey_watch.py"
      - "scripts/notify_webhook.py"
      - "config/electoral_alerts.json"
      - "tests/test_electoral_intelligence.py"
      - ".github/workflows/electoral_intelligence.yml"

permissions:
  contents: read

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip pytest numpy beautifulsoup4 requests
      - name: Compile connected pipeline
        run: |
          python -m py_compile \
            src/electoral_intelligence.py \
            src/electoral_radar_adapter.py \
            src/rapid_decision_center.py \
            src/projection_suite.py \
            src/electoral.py \
            src/marginality.py \
            src/coalition.py \
            src/uncertainty.py \
            scripts/electoral_radar.py \
            scripts/survey_watch.py \
            scripts/notify_webhook.py
      - name: Test canonical pipeline
        run: python -m pytest -q tests/test_electoral_intelligence.py tests/test_rapid_decision_center.py tests/test_marginality.py tests/test_projection_suite.py tests/test_telegram_notifier.py
      - name: Ingest surveys continuously
        run: python scripts/survey_watch.py || test "$?" = "1"
      - name: Materialize explicit historical baseline snapshot when current snapshot is absent
        run: |
          if [ ! -f artifacts/electoral_decision_snapshot.json ]; then
            python scripts/build_electoral_decision_snapshot.py
          fi
      - name: Build connected electoral radar
        run: python scripts/electoral_radar.py
      - name: Publish radar artifact
        uses: actions/upload-artifact@v4
        with:
          name: electoral-radar
          path: |
            artifacts/electoral_radar_report.json
            artifacts/electoral_radar_state.json
          if-no-files-found: error
      - name: Notify Telegram when configured
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/notify_webhook.py artifacts/electoral_radar_report.json
