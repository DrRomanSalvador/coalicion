name: MC 10000 evidence

on:
  push:
    branches: [main]
    paths:
      - "scripts/run_mc_10000.py"
      - "src/electoral.py"
      - "src/reproducibility_contract.py"
      - "artifacts/data/election_2023_canonical.json"
      - ".github/workflows/mc-10000.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mc-10000-main
  cancel-in-progress: false

jobs:
  mc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check --no-input "numpy>=2.0,<2.4" pandas
      - name: Resolve canonical seed
        run: echo "COALICION_SEED=$(python -c 'from src.reproducibility_contract import ExecutionContract; print(ExecutionContract.seed)')" >> "$GITHUB_ENV"
      - run: python scripts/run_mc_10000.py --iterations 10000 --seed "$COALICION_SEED"
      - name: Verify evidence
        run: |
          python - <<'PY'
          import json, os
          x=json.load(open("ci_evidence/mc_10000.json"))
          assert x["status"]=="PASS"
          assert x["iterations"]>=10000
          assert x["seed"]==int(os.environ["COALICION_SEED"])==x["canonical_seed"]
          assert x["constituencies"]==52 and x["seats"]==350
          assert x["invariants"]["every_draw_seat_sum_350"]
          assert x["invariants"]["all_allocations_status_OK"]
          assert x["sampler"].startswith("Dirichlet-multinomial")
          PY
      - name: Commit evidence with concurrent-update recovery
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp ci_evidence/mc_10000.json /tmp/mc_10000.json
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p ci_evidence
            cp /tmp/mc_10000.json ci_evidence/mc_10000.json
            git add ci_evidence/mc_10000.json
            if git diff --cached --quiet; then
              echo "Canonical Monte Carlo evidence is already persisted."
              exit 0
            fi
            git commit -m "ci: materialize reproducible 10k Monte Carlo evidence"
            if git push origin HEAD:main; then
              echo "Monte Carlo evidence persisted on attempt $attempt."
              exit 0
            fi
            echo "Concurrent main update; retrying evidence persistence ($attempt/5)."
            sleep 3
          done
          echo "Unable to persist Monte Carlo evidence after 5 attempts."
          exit 1
