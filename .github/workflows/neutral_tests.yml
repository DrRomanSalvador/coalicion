name: Neutral coalition tests

on:
  push:
    paths:
      - "src/neutral_coalition.py"
      - "src/electoral.py"
      - "tests/test_neutral_coalition.py"
      - "src/neutral_audit.py"
      - "scripts/neutral_coalition_cli.py"
      - "tests/test_neutral_audit.py"
      - "artifacts/data/election_2023_canonical.schema.json"
      - "scripts/notify_webhook.py"
      - "tests/test_telegram_notifier.py"
      - ".github/workflows/neutral_tests.yml"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar pytest
        run: python -m pip install --upgrade pip pytest beautifulsoup4
      - name: Comprobar scripts
        run: python -m py_compile scripts/neutral_coalition_cli.py scripts/survey_watch.py scripts/build_poll_report.py scripts/notify_webhook.py
      - name: Ejecutar tests
        run: python -m pytest -q tests/test_neutral_coalition.py tests/test_neutral_audit.py tests/test_electoral.py tests/test_decision_engine.py tests/test_survey_watch.py tests/test_poll_ingest.py tests/test_telegram_notifier.py
