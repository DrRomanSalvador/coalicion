name: Telegram bot service

on:
  schedule:
    - cron: "0 */5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/telegram_bot.py"
      - "src/telegram_timezone.py"
      - "src/telegram_persistence.py"
      - "scripts/verify_telegram_integration.py"
      - "tests/test_telegram_bot.py"
      - "tests/test_telegram_integration.py"
      - "tests/test_telegram_source_status.py"
      - "requirements.txt"
      - ".github/workflows/telegram_bot_service.yml"

permissions:
  contents: write

concurrency:
  group: telegram-bot-service
  cancel-in-progress: true

jobs:
  service:
    runs-on: ubuntu-latest
    timeout-minutes: 295
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ALLOWED_CHATS: ${{ secrets.TELEGRAM_ALLOWED_CHATS }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_ADMIN_IDS: ${{ secrets.TELEGRAM_ADMIN_IDS }}
      TELEGRAM_BOT_USERNAME: ${{ secrets.TELEGRAM_BOT_USERNAME }}
      TELEGRAM_WEBAPP_URL: ${{ secrets.TELEGRAM_WEBAPP_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate token configuration
        run: |
          test -n "$TELEGRAM_BOT_TOKEN"
          test "$TELEGRAM_BOT_TOKEN" != "TU_TOKEN_AQUI"

      - name: Validate Telegram integration
        run: |
          python -m py_compile src/telegram_bot.py src/telegram_timezone.py src/telegram_persistence.py scripts/verify_telegram_integration.py
          python -m pytest -q tests/test_telegram_bot.py tests/test_telegram_integration.py tests/test_telegram_source_status.py
          if [ -z "$TELEGRAM_ALLOWED_CHATS" ]; then echo "Telegram allowlist absent; runtime remains fail-closed."; fi

      - name: Materialize Telegram integration evidence
        run: python scripts/verify_telegram_integration.py

      - name: Persist Telegram integration evidence before long-running service
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          snapshot="$(mktemp)"
          cp ci_evidence/telegram_integration.json "$snapshot"
          git config user.name "coalicion-telegram-bot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p ci_evidence
            cp "$snapshot" ci_evidence/telegram_integration.json
            git add ci_evidence/telegram_integration.json
            if git diff --cached --quiet; then
              echo "Telegram integration evidence already current."
              exit 0
            fi
            git commit -m "ci: persist current Telegram integration evidence"
            if git push origin HEAD:main; then
              echo "Telegram integration evidence persisted before service startup."
              exit 0
            fi
            echo "Concurrent main update; retrying Telegram evidence persistence ($attempt/5)."
          done
          echo "FAIL-CLOSED: unable to persist Telegram integration evidence."
          exit 1

      - name: Run Telegram bot
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=30s 290m python -m src.telegram_bot
          rc=$?
          if [ "$rc" -eq 124 ]; then
            echo "Bot cycle ended normally for scheduled restart."
            exit 0
          fi
          exit "$rc"

      - name: Persist Telegram state
        if: always() && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          if [ ! -f artifacts/telegram_state.json ]; then
            echo "No Telegram state snapshot was produced."
            exit 0
          fi
          git config user.name "coalicion-telegram-bot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          snapshot="$(mktemp -d)"
          files=(artifacts/telegram_state.json artifacts/telegram_config.json artifacts/telegram_user_state.json artifacts/telegram_alert_state.json artifacts/telegram_digest_state.json artifacts/telegram_audit.jsonl ci_evidence/telegram_integration.json)
          for file in "${files[@]}"; do
            if [ -f "$file" ]; then
              mkdir -p "$snapshot/$(dirname "$file")"
              cp "$file" "$snapshot/$file"
              git add "$file"
            fi
          done
          if git diff --cached --quiet; then
            echo "No Telegram state changes."
            exit 0
          fi
          git commit -m "chore: persist Telegram service state"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Telegram state persisted."
              exit 0
            fi
            echo "Concurrent main update; restoring Telegram snapshot (attempt $attempt/5)."
            git fetch origin main
            git reset --hard origin/main
            for file in "${files[@]}"; do
              if [ -f "$snapshot/$file" ]; then
                mkdir -p "$(dirname "$file")"
                cp "$snapshot/$file" "$file"
                git add "$file"
              fi
            done
            if git diff --cached --quiet; then
              echo "Telegram snapshot already matches main."
              exit 0
            fi
            git commit -m "chore: persist Telegram service state"
          done
          echo "Unable to persist Telegram state after 5 attempts."
          exit 1
