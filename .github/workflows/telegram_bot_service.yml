name: Telegram bot service

on:
  schedule:
    - cron: "0 */5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/telegram_bot.py"
      - "requirements.txt"
      - ".github/workflows/telegram_bot_service.yml"

permissions:
  contents: write

concurrency:
  group: telegram-bot-service
  cancel-in-progress: true

jobs:
  service:
    runs-on: ubuntu-latest
    timeout-minutes: 295
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ALLOWED_CHATS: ${{ secrets.TELEGRAM_ALLOWED_CHATS }}
      TELEGRAM_ADMIN_IDS: ${{ secrets.TELEGRAM_ADMIN_IDS }}
      TELEGRAM_BOT_USERNAME: ${{ secrets.TELEGRAM_BOT_USERNAME }}
      TELEGRAM_WEBAPP_URL: ${{ secrets.TELEGRAM_WEBAPP_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate token configuration
        run: |
          test -n "$TELEGRAM_BOT_TOKEN"
          test "$TELEGRAM_BOT_TOKEN" != "TU_TOKEN_AQUI"

      - name: Validate Telegram integration
        run: |
          test -n "$TELEGRAM_ALLOWED_CHATS"
          python -m py_compile src/telegram_bot.py src/telegram_timezone.py src/telegram_persistence.py scripts/verify_telegram_integration.py
          python -m pytest -q tests/test_telegram_bot.py tests/test_telegram_integration.py tests/test_telegram_source_status.py

      - name: Materialize Telegram integration evidence
        run: python scripts/verify_telegram_integration.py

      - name: Run Telegram bot
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=30s 290m python -m src.telegram_bot
          rc=$?
          if [ "$rc" -eq 124 ]; then
            echo "Bot cycle ended normally for scheduled restart."
            exit 0
          fi
          exit "$rc"

      - name: Persist Telegram state
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f artifacts/telegram_state.json ]; then
            echo "No Telegram state snapshot was produced."
            exit 0
          fi
          git config user.name "coalicion-telegram-bot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/telegram_state.json artifacts/telegram_config.json artifacts/telegram_user_state.json artifacts/telegram_alert_state.json artifacts/telegram_digest_state.json artifacts/telegram_audit.jsonl ci_evidence/telegram_integration.json
          if git diff --cached --quiet; then
            echo "No Telegram state changes."
            exit 0
          fi
          git commit -m "chore: persist Telegram service state"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Telegram state persisted."
              exit 0
            fi
            git fetch origin main
            git reset --hard origin/main
            git add artifacts/telegram_state.json artifacts/telegram_config.json artifacts/telegram_user_state.json artifacts/telegram_alert_state.json artifacts/telegram_digest_state.json artifacts/telegram_audit.jsonl
            git commit -m "chore: persist Telegram service state" || true
          done
          echo "Unable to persist Telegram state after retries."
          exit 1
