name: Telegram bot service

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/telegram_bot.py"
      - "src/telegram_timezone.py"
      - "src/telegram_persistence.py"
      - "scripts/verify_telegram_integration.py"
      - "tests/test_telegram_bot.py"
      - "tests/test_telegram_integration.py"
      - "tests/test_telegram_source_status.py"
      - "requirements.txt"
      - ".github/workflows/telegram_bot_service.yml"

permissions:
  contents: write

concurrency:
  group: telegram-bot-service-${{ github.ref }}
  cancel-in-progress: false

jobs:
  service:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ALLOWED_CHATS: ${{ secrets.TELEGRAM_ALLOWED_CHATS }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_ADMIN_IDS: ${{ secrets.TELEGRAM_ADMIN_IDS }}
      TELEGRAM_BOT_USERNAME: ${{ secrets.TELEGRAM_BOT_USERNAME }}
      TELEGRAM_WEBAPP_URL: ${{ secrets.TELEGRAM_WEBAPP_URL }}
      TELEGRAM_TEAM_CHAT_ID: ${{ secrets.TELEGRAM_TEAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install runtime dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Validate token
        run: |
          test -n "$TELEGRAM_BOT_TOKEN"
          test "$TELEGRAM_BOT_TOKEN" != "TU_TOKEN_AQUI"
      - name: Detect active Telegram webhook
        id: webhook
        shell: bash
        run: |
          set -euo pipefail
          info="$(curl --fail --silent --show-error --retry 2 --retry-delay 1 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getWebhookInfo")"
          webhook_url="$(python -c 'import json,sys; print(json.loads(sys.argv[1]).get("result",{}).get("url",""))' "$info")"
          if [[ -n "$webhook_url" ]]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
            echo "Webhook mode is active; skipping getUpdates polling to avoid Telegram conflict."
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Drain Telegram updates
        if: steps.webhook.outputs.active != 'true'
        run: python -c "from src.telegram_bot import run_polling; run_polling(max_runtime_seconds=270, poll_timeout=20)"
      - name: Persist bot state
        if: always() && steps.webhook.outputs.active != 'true'
        shell: bash
        run: |
          set -euo pipefail
          files=(
            artifacts/telegram_state.json
            artifacts/telegram_poll_offset.json
            artifacts/telegram_config.json
            artifacts/telegram_user_state.json
            artifacts/telegram_alert_state.json
            artifacts/telegram_digest_state.json
            artifacts/telegram_audit.jsonl
            artifacts/telegram_tasks.json
          )
          git config user.name "coalicion-telegram-bot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          snapshot="$(mktemp -d)"
          for file in "${files[@]}"; do
            if [[ -f "$file" ]]; then
              mkdir -p "$snapshot/$(dirname "$file")"
              cp "$file" "$snapshot/$file"
            fi
          done
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            for file in "${files[@]}"; do
              if [[ -f "$snapshot/$file" ]]; then
                mkdir -p "$(dirname "$file")"
                cp "$snapshot/$file" "$file"
                git add "$file"
              fi
            done
            if git diff --cached --quiet; then
              echo "State already current."
              exit 0
            fi
            git commit -m "chore: persist Telegram bot state"
            if git push origin HEAD:main; then
              echo "Telegram state persisted."
              exit 0
            fi
            echo "Concurrent main update; retry $attempt/3."
          done
          echo "::error::Telegram state could not be persisted after 3 attempts."
          exit 1
