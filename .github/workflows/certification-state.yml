name: certification state materialization
on:
  push:
    branches: [main]
    paths:
      - "ci_evidence/**"
      - "scripts/master_certification.py"
      - ".github/workflows/certification-state.yml"
  workflow_dispatch:
permissions: {contents: write}
jobs:
  state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scripts/master_certification.py || test -f ci_evidence/master_certification.json
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci_evidence/master_certification.json
          git diff --cached --quiet || (git commit -m "ci: refresh master certification state" && git push origin HEAD:main)
