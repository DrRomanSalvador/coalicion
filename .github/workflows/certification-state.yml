name: certification state materialization

on:
  push:
    branches: [main]
    paths:
      - "ci_evidence/**"
      - "scripts/master_certification.py"
      - ".github/workflows/certification-state.yml"
  workflow_dispatch:
    inputs:
      reason:
        description: "Motivo de la ejecución manual"
        required: false
        default: "manual-certification"
        type: string

permissions:
  contents: read

concurrency:
  group: certification-state-main
  cancel-in-progress: true

jobs:
  state:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate certification state
        run: |
          set -euo pipefail
          python scripts/master_certification.py || rc=$?
          if [ "${rc:-0}" -ne 0 ] && [ ! -f ci_evidence/master_certification.json ]; then
            exit "${rc}"
          fi
      - name: Upload certification state
        uses: actions/upload-artifact@v4
        with:
          name: master-certification-state
          path: ci_evidence/master_certification.json
          if-no-files-found: error
