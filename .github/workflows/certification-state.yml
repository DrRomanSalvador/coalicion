name: certification state materialization

on:
  push:
    branches: [main]
    paths:
      - "ci_evidence/**"
      - "scripts/master_certification.py"
      - ".github/workflows/certification-state.yml"
  workflow_dispatch:
    inputs:
      reason:
        description: "Motivo de la ejecución manual"
        required: false
        default: "manual-certification"
        type: string

permissions:
  contents: read

concurrency:
  group: certification-state-main
  cancel-in-progress: true

jobs:
  state:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate certification state without stale-file fallback
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci_evidence
          rm -f ci_evidence/master_certification.json
          set +e
          python scripts/master_certification.py
          rc=$?
          set -e
          if [ ! -s ci_evidence/master_certification.json ]; then
            echo "::error::Certification generator did not create fresh evidence."
            exit 1
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::error::Master certification gates failed; fresh diagnostic evidence is retained, but the workflow must fail."
            exit "$rc"
          fi
      - name: Upload certification state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-certification-state
          path: ci_evidence/master_certification.json
          if-no-files-found: error
