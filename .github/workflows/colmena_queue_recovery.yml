name: COALICION — Actions Queue Recovery

on:
  push:
    branches: [main]
    paths:
      - "scripts/colmena_queue_recovery.py"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: colmena-queue-recovery
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Cancel stale Colmena executions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for workflow in "colmena_execute.yml" "colmena_atomic_swarm.yml"; do
            gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --limit 100 \
              --json databaseId,status,createdAt \
              --jq 'sort_by(.createdAt) | reverse | .[] | [.databaseId,.status] | @tsv' |
            while IFS=$'\t' read -r id status; do
              [ -z "$id" ] && continue
              if [ "$workflow" = "colmena_atomic_swarm.yml" ]; then
                # Keep the newest atomic swarm; older pending/in-progress copies are stale.
                newest="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --limit 100 --json databaseId,createdAt --jq 'sort_by(.createdAt) | reverse | .[0].databaseId')"
                [ "$id" = "$newest" ] && continue
              fi
              case "$status" in
                queued|in_progress|pending)
                  gh run cancel "$id" --repo "$GITHUB_REPOSITORY" || true
                  ;;
              esac
            done
          done
          echo "COLMENA_STALE_EXECUTOR_CLEANUP=PASS"
