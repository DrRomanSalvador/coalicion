name: COALICION — Actions Queue Recovery

on:
  push:
    branches: [main]
    paths:
      - "scripts/colmena_queue_recovery.py"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: colmena-queue-recovery
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Cancel stale Colmena executions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for workflow in "colmena_execute.yml" "colmena_atomic_swarm.yml"; do
            ids="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --limit 100 --json databaseId,status,createdAt --jq 'sort_by(.createdAt) | reverse | .[] | [.databaseId,.status] | @tsv')"
            newest=""
            if [ "$workflow" = "colmena_atomic_swarm.yml" ]; then
              newest="$(printf '%s\n' "$ids" | head -n1 | cut -f1)"
            fi
            while IFS=$'\t' read -r id status; do
              [ -z "$id" ] && continue
              [ "$workflow" = "colmena_atomic_swarm.yml" ] && [ "$id" = "$newest" ] && continue
              case "$status" in
                queued|in_progress|pending)
                  gh run cancel "$id" --repo "$GITHUB_REPOSITORY" || true
                  ;;
              esac
            done <<< "$ids"
          done
          echo "COLMENA_STALE_EXECUTOR_CLEANUP=PASS"
