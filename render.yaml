services:
  - type: web
    name: coalicion
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: COALICION_SERVICE
        value: api
      - key: COALICION_API_HOST
        value: 0.0.0.0
      - key: COALICION_API_PORT
        value: 8080
      - key: COALICION_API_KEY
        generateValue: true

  - type: web
    name: coalicion-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run src/web/dashboard.py --server.address 0.0.0.0 --server.port $PORT --server.headless true

  - type: web
    name: coalicion-decision-demo
    runtime: python
    plan: free
    buildCommand: python -m py_compile scripts/demo_decision_server.py scripts/demo_decision_analysis.py src/electoral.py src/coalition.py
    startCommand: python scripts/demo_decision_server.py --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
